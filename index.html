<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Luyện tập — Deutsch.vn</title>

<style>
@font-face{
  font-family:"GFF";
  src:
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --font:"GFF",-apple-system,"Segoe UI",sans-serif;
  --ink:#0a0a0a;
  --ink-2:#18181b;
  --muted:#71717a;
  --muted-2:#a1a1aa;
  --bg:#ffffff;
  --bg-soft:#fafafa;
  --border:#e4e4e7;
  --border-soft:#f1f1f3;
  --accent:#6366f1;
  --accent-2:#8b5cf6;
  --accent-3:#ec4899;
  --green:#10b981;
  --green-bg:#ecfdf5;
  --red:#ef4444;
  --red-bg:#fef2f2;
  --amber:#f59e0b;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}

html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-0.01em;
  overflow-x:hidden;
  font-weight:700;
  min-height:100vh;
  background:
    radial-gradient(ellipse 50% 40% at 10% 0%, #eef2ff 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 90% 10%, #fdf2f8 0%, transparent 55%),
    radial-gradient(ellipse 40% 30% at 50% 100%, #ecfeff 0%, transparent 60%),
    #ffffff;
  background-attachment:fixed;
}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
ul,ol{list-style:none}

/* ===== APP SHELL ===== */
.app{
  max-width:820px;
  margin:0 auto;
  padding:20px 20px 60px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== TOP BAR ===== */
.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 0 24px;
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-weight:900;font-size:17px;
  letter-spacing:-0.04em;
}
.brand-icon{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;
  box-shadow:0 4px 12px -4px rgba(99,102,241,.5);
}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.7);
  border:1px solid var(--border);
  color:var(--muted);
  backdrop-filter:blur(8px);
  transition:all .2s var(--ease);
}
.icon-btn:hover{color:var(--ink);border-color:var(--ink);transform:translateY(-1px)}
.icon-btn svg{width:16px;height:16px}

/* ===== SEGMENTED MODE SWITCH ===== */
.modes{
  display:flex;
  gap:4px;
  padding:5px;
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);
  border-radius:16px;
  margin-bottom:28px;
  box-shadow:0 1px 2px rgba(0,0,0,.03), 0 8px 24px -16px rgba(0,0,0,.08);
}
.mode-btn{
  flex:1;
  padding:11px 14px;
  border-radius:12px;
  font-size:13.5px;
  font-weight:900;
  color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:all .25s var(--ease);
  white-space:nowrap;
}
.mode-btn svg{width:15px;height:15px;flex-shrink:0}
.mode-btn:hover{color:var(--ink)}
.mode-btn.active{
  background:linear-gradient(180deg,#18181b,#0a0a0a);
  color:#fff;
  box-shadow:0 4px 12px -4px rgba(0,0,0,.4);
}
.mode-btn .emoji{font-size:14px}

/* ===== VIEW CONTAINER ===== */
.views{flex:1;position:relative}
.view{
  display:none;
  animation:viewIn .45s var(--ease-out);
}
.view.active{display:block}
@keyframes viewIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

/* ===== QUIZ ===== */
.quiz-progress{
  display:flex;align-items:center;gap:12px;
  margin-bottom:20px;
  font-size:12.5px;font-weight:800;color:var(--muted);
}
.quiz-progress .bar{
  flex:1;height:6px;border-radius:99px;
  background:var(--border-soft);
  overflow:hidden;
  position:relative;
}
.quiz-progress .bar::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,#6366f1,#8b5cf6,#ec4899);
  border-radius:99px;
  width:var(--p,0%);
  transition:width .5s var(--ease-out);
}
.quiz-progress .count{
  font-variant-numeric:tabular-nums;
  color:var(--ink-2);
  font-weight:900;
}

.q-card{
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:24px;
  padding:28px;
  box-shadow:0 2px 4px rgba(0,0,0,.03), 0 24px 48px -24px rgba(99,102,241,.15);
  margin-bottom:16px;
}
.q-tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:99px;
  background:#eef2ff;color:var(--accent);
  font-size:11.5px;font-weight:900;letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:14px;
}
.q-text{
  font-size:clamp(19px, 2.4vw, 24px);
  line-height:1.35;
  font-weight:900;
  letter-spacing:-0.025em;
  color:var(--ink);
}
.q-hint{
  margin-top:10px;
  font-size:14px;font-weight:700;color:var(--muted);
  line-height:1.55;
}

/* options */
.options{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:16px;
  text-align:left;
  width:100%;
  font-size:16px;font-weight:800;
  color:var(--ink-2);
  transition:all .2s var(--ease);
  position:relative;
  overflow:hidden;
}
.opt::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(99,102,241,.04),transparent);
  transform:translateX(-100%);
  transition:transform .5s var(--ease);
}
.opt:hover:not(:disabled){
  border-color:#c7c9ff;
  background:#fbfbff;
  transform:translateX(2px);
}
.opt:hover:not(:disabled)::before{transform:translateX(100%)}
.opt-letter{
  width:32px;height:32px;flex-shrink:0;
  border-radius:9px;
  background:var(--bg-soft);
  border:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;color:var(--muted);
  transition:all .25s var(--ease);
}
.opt-text{flex:1}
.opt-mark{
  width:22px;height:22px;flex-shrink:0;
  opacity:0;
  transition:opacity .25s var(--ease);
}
.opt:disabled{cursor:default}

/* correct */
.opt.correct{
  border-color:var(--green);
  background:var(--green-bg);
  color:#065f46;
}
.opt.correct .opt-letter{
  background:var(--green);color:#fff;border-color:var(--green);
}
.opt.correct .opt-mark{opacity:1;color:var(--green)}

/* wrong */
.opt.wrong{
  border-color:var(--red);
  background:var(--red-bg);
  color:#991b1b;
  animation:shake .4s ease;
}
.opt.wrong .opt-letter{
  background:var(--red);color:#fff;border-color:var(--red);
}
.opt.wrong .opt-mark{opacity:1;color:var(--red)}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

.opt.dim{opacity:.5}

/* feedback bar */
.feedback{
  margin-top:16px;
  padding:14px 18px;
  border-radius:14px;
  font-size:14px;font-weight:800;
  display:none;
  align-items:flex-start;gap:10px;
  animation:viewIn .35s var(--ease-out);
}
.feedback.show{display:flex}
.feedback.ok{background:var(--green-bg);color:#065f46;border:1px solid #a7f3d0}
.feedback.no{background:var(--red-bg);color:#991b1b;border:1px solid #fecaca}
.feedback .ico{font-size:16px;flex-shrink:0;margin-top:1px}
.feedback .body{flex:1;line-height:1.5}
.feedback strong{font-weight:900}

/* primary action */
.action-row{
  display:flex;gap:10px;margin-top:20px;
}
.btn-primary{
  flex:1;
  height:52px;
  border-radius:16px;
  background:linear-gradient(180deg,#18181b,#0a0a0a);
  color:#fff;
  font-size:14.5px;font-weight:900;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset, 0 8px 24px -8px rgba(0,0,0,.4);
  transition:all .25s var(--ease);
  position:relative;
  overflow:hidden;
}
.btn-primary::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(110deg, transparent 30%, rgba(255,255,255,.15) 50%, transparent 70%);
  transform:translateX(-100%);
  transition:transform .8s var(--ease);
}
.btn-primary:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset, 0 16px 32px -10px rgba(0,0,0,.45);
}
.btn-primary:hover:not(:disabled)::before{transform:translateX(100%)}
.btn-primary:disabled{
  opacity:.35;
  cursor:not-allowed;
}
.btn-primary svg{transition:transform .25s var(--ease)}
.btn-primary:hover:not(:disabled) svg{transform:translateX(3px)}

.btn-ghost{
  height:52px;
  padding:0 22px;
  border-radius:16px;
  background:#fff;
  border:1.5px solid var(--border);
  font-size:14px;font-weight:900;
  color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:all .25s var(--ease);
}
.btn-ghost:hover{
  border-color:var(--ink);
  transform:translateY(-2px);
}
.btn-ghost svg{width:16px;height:16px;transition:transform .2s var(--ease)}

/* ===== GRAMMAR ===== */
.grammar-card{
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px 28px;
  box-shadow:0 2px 4px rgba(0,0,0,.03), 0 24px 48px -24px rgba(139,92,246,.18);
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.grammar-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#6366f1,#8b5cf6,#ec4899);
}
.grammar-q-label{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
  gap:12px;
}
.grammar-q-label .num{
  font-size:12px;font-weight:900;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);
}
.tts-btn{
  display:inline-flex;align-items:center;gap:7px;
  height:38px;padding:0 14px;
  background:#eef2ff;color:var(--accent);
  border-radius:99px;
  font-size:12.5px;font-weight:900;
  transition:all .2s var(--ease);
  flex-shrink:0;
}
.tts-btn:hover{background:#e0e7ff;transform:translateY(-1px)}
.tts-btn.speaking{background:var(--accent);color:#fff;animation:pulseBg 1.2s infinite}
@keyframes pulseBg{
  0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,.4)}
  50%{box-shadow:0 0 0 8px rgba(99,102,241,0)}
}
.tts-btn svg{width:14px;height:14px}

.grammar-question{
  font-size:clamp(18px, 2.3vw, 22px);
  line-height:1.5;
  font-weight:900;
  letter-spacing:-0.015em;
  color:var(--ink);
  margin-bottom:24px;
}

.reveal-btn{
  width:100%;
  height:48px;
  border-radius:14px;
  background:linear-gradient(180deg,#ffffff,#fafafa);
  border:1.5px dashed var(--border);
  color:var(--muted);
  font-size:13.5px;font-weight:900;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:all .25s var(--ease);
}
.reveal-btn:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:#fbfbff;
}
.reveal-btn svg{width:16px;height:16px;transition:transform .3s var(--ease)}
.reveal-btn.open svg{transform:rotate(180deg)}

.grammar-answer{
  margin-top:16px;
  padding:20px;
  background:linear-gradient(135deg,#f0fdf4 0%,#ecfdf5 100%);
  border:1.5px solid #a7f3d0;
  border-radius:16px;
  display:none;
  animation:viewIn .4s var(--ease-out);
}
.grammar-answer.show{display:block}
.grammar-answer .label{
  font-size:11px;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:#047857;
  margin-bottom:8px;
}
.grammar-answer .content{
  font-size:16px;line-height:1.55;
  font-weight:800;color:#064e3b;
}
.grammar-answer .note{
  margin-top:12px;padding-top:12px;
  border-top:1px dashed #a7f3d0;
  font-size:13px;line-height:1.55;
  color:#065f46;font-weight:700;
}

/* ===== FLASHCARD ===== */
.fc-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
  font-size:12.5px;font-weight:800;color:var(--muted);
  gap:12px;
}
.fc-top .left{display:flex;align-items:center;gap:8px}
.fc-top .learned{color:var(--green);font-weight:900}
.fc-top .remaining{color:var(--muted)}
.fc-top .progress{
  flex:1;max-width:200px;height:6px;
  background:var(--border-soft);
  border-radius:99px;overflow:hidden;
  position:relative;
}
.fc-top .progress::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,#10b981,#22c55e);
  border-radius:99px;
  width:var(--p,0%);
  transition:width .4s var(--ease-out);
}

.fc-stage{
  perspective:1400px;
  margin-bottom:20px;
  position:relative;
}
.fc-card{
  width:100%;
  min-height:280px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .6s var(--ease-out);
  cursor:pointer;
}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:24px;
  padding:32px 28px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  min-height:280px;
}
.fc-front{
  background:linear-gradient(135deg,#0a0a0f 0%,#18181b 50%,#1e1b4b 100%);
  color:#fff;
  box-shadow:0 30px 60px -24px rgba(30,27,75,.5);
  position:relative;
  overflow:hidden;
}
.fc-front::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:36px 36px;
  mask-image:radial-gradient(ellipse 60% 60% at 50% 50%, #000 20%, transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%, #000 20%, transparent 70%);
}
.fc-front > *{position:relative}
.fc-front .label{
  font-size:11px;font-weight:900;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(255,255,255,.45);
  margin-bottom:16px;
}
.fc-front .word{
  font-size:clamp(28px, 5vw, 44px);
  font-weight:900;letter-spacing:-0.04em;
  line-height:1.1;
  margin-bottom:8px;
}
.fc-front .sub{
  font-size:13px;font-weight:700;
  color:rgba(255,255,255,.55);
  letter-spacing:-0.005em;
}
.fc-front .hint{
  margin-top:24px;
  font-size:12px;font-weight:800;
  color:rgba(255,255,255,.35);
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:99px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
}
.fc-back{
  background:linear-gradient(135deg,#ffffff 0%,#fafafa 100%);
  color:var(--ink);
  border:1.5px solid var(--border);
  transform:rotateY(180deg);
  box-shadow:0 30px 60px -24px rgba(0,0,0,.15);
  align-items:flex-start;
  text-align:left;
  justify-content:flex-start;
  overflow:auto;
}
.fc-back .label{
  font-size:11px;font-weight:900;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);
  margin-bottom:12px;
}
.fc-back .meaning{
  font-size:clamp(18px, 3vw, 24px);
  font-weight:900;letter-spacing:-0.02em;
  color:var(--ink);line-height:1.3;
  margin-bottom:16px;
}
.fc-back .example{
  padding:14px 16px;
  background:#fafafa;
  border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;
  font-size:13.5px;line-height:1.55;
  color:var(--ink-2);font-weight:700;
  margin-bottom:10px;
}
.fc-back .example strong{color:var(--ink);font-weight:900}
.fc-back .example em{
  font-style:normal;display:block;
  color:var(--muted);font-size:12.5px;
  margin-top:4px;
}
.fc-back .grammar-note{
  font-size:12.5px;color:var(--muted);
  font-weight:700;line-height:1.55;
}

.fc-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  opacity:.3;
  pointer-events:none;
  transition:opacity .3s var(--ease);
}
.fc-actions.ready{opacity:1;pointer-events:auto}
.fc-btn{
  height:56px;
  border-radius:16px;
  font-size:14px;font-weight:900;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s var(--ease);
}
.fc-btn.again{
  background:#fff;color:#991b1b;
  border:1.5px solid #fecaca;
}
.fc-btn.again:hover{background:var(--red-bg);border-color:var(--red);transform:translateY(-2px)}
.fc-btn.good{
  background:linear-gradient(180deg,#10b981,#059669);
  color:#fff;
  box-shadow:0 8px 20px -8px rgba(16,185,129,.5);
}
.fc-btn.good:hover{transform:translateY(-2px);box-shadow:0 12px 24px -8px rgba(16,185,129,.55)}
.fc-btn svg{width:16px;height:16px}

/* flashcard complete */
.fc-complete{
  text-align:center;
  padding:48px 24px;
  background:linear-gradient(135deg,#ecfdf5 0%,#f0fdf4 100%);
  border:1.5px solid #a7f3d0;
  border-radius:24px;
  display:none;
  animation:viewIn .5s var(--ease-out);
}
.fc-complete.show{display:block}
.fc-complete .emoji{font-size:48px;margin-bottom:16px}
.fc-complete h3{
  font-size:24px;font-weight:900;
  letter-spacing:-0.03em;color:#065f46;
  margin-bottom:8px;
}
.fc-complete p{
  font-size:14px;font-weight:700;
  color:#047857;margin-bottom:24px;
}
.fc-complete .btn-primary{max-width:280px;margin:0 auto}

/* ===== RESULTS ===== */
.result-screen{
  text-align:center;
  padding:48px 24px;
  background:rgba(255,255,255,.9);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:0 2px 4px rgba(0,0,0,.03), 0 24px 48px -24px rgba(99,102,241,.18);
  animation:viewIn .5s var(--ease-out);
  display:none;
}
.result-screen.show{display:block}
.result-screen .emoji{font-size:56px;margin-bottom:16px}
.result-screen h3{
  font-size:26px;font-weight:900;
  letter-spacing:-0.03em;color:var(--ink);
  margin-bottom:8px;
}
.result-screen .score{
  font-size:48px;font-weight:900;
  background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:-0.05em;
  margin:8px 0 4px;
}
.result-screen p{
  font-size:14px;font-weight:700;
  color:var(--muted);margin-bottom:28px;
}
.result-screen .btn-primary{max-width:280px;margin:0 auto}

/* ===== SPEAK NOTICE ===== */
.speak-indicator{
  position:fixed;
  bottom:24px;left:50%;
  transform:translateX(-50%) translateY(120%);

  pointer-events:none;
}
.speak-indicator.show{transform:translateX(-50%) translateY(0)}
.speak-indicator .bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.speak-indicator .bars span{

}

@keyframes bar{
  0%,100%{transform:scaleY(.5)}

}

<script>

// GRAMMAR — chỉ đọc câu hỏi, KHÔNG đọc đáp án
const grammarData = [

// FLASHCARD

  },
  {

    grammar: "Số nhiều: die Erfahrungen. Ghép: erfahren + -ung."
  }
];

/* ============================================================
   STATE
   ============================================================ */
const state = {
  mode: "quiz",
  soundOn: true,
  quiz: {
    index: 0,
    answered: false,
    score: 0
  },
  grammar: {
    index: 0,
    revealed: false
  },
  flashcard: {
    queue: [],
    learned: 0,
    total: 0,
    flipped: false,
    finished: false
  }
};

/* ============================================================
   TTS
   ============================================================ */
let currentUtterance = null;
let isSpeaking = false;

function speak(text, lang = "vi-VN") {
  if (!state.soundOn) return;
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();
  isSpeaking = true;
  showSpeakIndicator(true);

  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.92;
  u.pitch = 1.02;

  // try to pick a matching voice
  const voices = window.speechSynthesis.getVoices();
  const match = voices.find(v => v.lang.toLowerCase().startsWith(lang.split("-")[0].toLowerCase()));
  if (match) u.voice = match;

  u.onend = () => {
    isSpeaking = false;
    showSpeakIndicator(false);
  };
  u.onerror = () => {
    isSpeaking = false;
    showSpeakIndicator(false);
  };

  currentUtterance = u;
  window.speechSynthesis.speak(u);
}

function stopSpeak() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  isSpeaking = false;
  showSpeakIndicator(false);
}

function showSpeakIndicator(show) {
  const el = document.getElementById("speakIndicator");
  if (show) el.classList.add("show");
  else el.classList.remove("show");
}

// preload voices
if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

/* ============================================================
   MODE SWITCH
   ============================================================ */
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const mode = btn.dataset.mode;
    if (mode === state.mode) return;
    stopSpeak();
    state.mode = mode;
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + mode).classList.add("active");

    if (mode === "quiz") renderQuiz();
    if (mode === "grammar") renderGrammar();
    if (mode === "flashcard") renderFlashcard();
  });
});

/* ============================================================
   QUIZ RENDER
   ============================================================ */
function renderQuiz() {
  const q = quizData[state.quiz.index];
  const body = document.getElementById("quizBody");
  const progress = document.getElementById("quizBar");
  const counter = document.getElementById("quizCount");

  progress.style.setProperty("--p", `${(state.quiz.index / quizData.length) * 100}%`);
  counter.textContent = `${state.quiz.index + 1} / ${quizData.length}`;

  body.innerHTML = `
    <div class="q-card">
      <div class="q-tag">${q.tag}</div>
      <div class="q-text">${q.question}</div>
      ${q.hint ? `<div class="q-hint">${q.hint}</div>` : ""}
    </div>
    <div class="options" id="quizOptions">
      ${q.options.map((opt, i) => `
        <button class="opt" data-index="${i}">
          <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
          <span class="opt-text">${opt}</span>
          <svg class="opt-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </button>
      `).join("")}
    </div>
    <div class="feedback" id="quizFeedback">
      <span class="ico"></span>
      <span class="body"></span>
    </div>
    <div class="action-row">
      <button class="btn-primary" id="quizNext" disabled>
        <span>Tiếp theo</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  `;

  document.querySelectorAll("#quizOptions .opt").forEach(btn => {
    btn.addEventListener("click", () => handleQuizAnswer(parseInt(btn.dataset.index)));
  });

  document.getElementById("quizNext").addEventListener("click", () => {
    if (state.quiz.index < quizData.length - 1) {
      state.quiz.index++;
      state.quiz.answered = false;
      renderQuiz();
    } else {
      showQuizResult();
    }
  });
}

function handleQuizAnswer(selected) {
  if (state.quiz.answered) return;
  state.quiz.answered = true;

  const q = quizData[state.quiz.index];
  const correct = q.correct;
  const options = document.querySelectorAll("#quizOptions .opt");
  const feedback = document.getElementById("quizFeedback");
  const nextBtn = document.getElementById("quizNext");

  options.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct) {
      btn.classList.add("correct");
    } else if (i === selected) {
      btn.classList.add("wrong");
    } else {
      btn.classList.add("dim");
    }
  });

  if (selected === correct) {
    state.quiz.score++;
    feedback.className = "feedback ok show";
    feedback.querySelector(".ico").textContent = "✓";
    feedback.querySelector(".body").innerHTML = `<strong>Chính xác!</strong> Đáp án đúng là <strong>${String.fromCharCode(65 + correct)}. ${q.options[correct]}</strong>.`;
    if (state.soundOn) speak("Chính xác!", "vi-VN");
  } else {
    feedback.className = "feedback no show";
    feedback.querySelector(".ico").textContent = "✕";
    feedback.querySelector(".body").innerHTML = `Chưa đúng. Đáp án đúng là <strong>${String.fromCharCode(65 + correct)}. ${q.options[correct]}</strong>.`;
    if (state.soundOn) speak("Chưa đúng.", "vi-VN");
  }

  nextBtn.disabled = false;
  nextBtn.innerHTML = state.quiz.index < quizData.length - 1
    ? `<span>Tiếp theo</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`
    : `<span>Xem kết quả</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`;
}

function showQuizResult() {
  const body = document.getElementById("quizBody");
  const progress = document.getElementById("quizBar");
  const counter = document.getElementById("quizCount");
  progress.style.setProperty("--p", "100%");
  counter.textContent = `${quizData.length} / ${quizData.length}`;

  const total = quizData.length;
  const score = state.quiz.score;
  const pct = Math.round((score / total) * 100);

  let emoji = "🎉", title = "Hoàn thành!";
  if (pct === 100) { emoji = "🏆"; title = "Hoàn hảo!"; }
  else if (pct >= 70) { emoji = "🎉"; title = "Làm tốt lắm!"; }
  else if (pct >= 40) { emoji = "💪"; title = "Cố gắng thêm!"; }
  else { emoji = "📚"; title = "Ôn lại nhé!"; }

  body.innerHTML = `
    <div class="result-screen show">
      <div class="emoji">${emoji}</div>
      <h3>${title}</h3>
      <div class="score">${score}/${total}</div>
      <p>Bạn trả lời đúng ${pct}% câu hỏi</p>
      <button class="btn-primary" id="quizRestart">
        <span>Làm lại</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  `;

  document.getElementById("quizRestart").addEventListener("click", () => {
    state.quiz.index = 0;
    state.quiz.score = 0;
    state.quiz.answered = false;
    renderQuiz();
  });
}

  body.innerHTML = `
    <div class="grammar-card">
      <div class="grammar-q-label">

        <button class="tts-btn" id="grammarSpeak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <span>Đọc câu hỏi</span>
        </button>
      </div>
      <div class="grammar-question">${g.question}</div>

      <button class="reveal-btn" id="grammarReveal">
        <span>Hiện đáp án</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>

      <div class="grammar-answer" id="grammarAnswer">
        <div class="label">Đáp án</div>
        <div class="content">${g.answer}</div>
        ${g.note ? `<div class="note">💡 ${g.note}</div>` : ""}
      </div>
    </div>

    <div class="action-row">
      <button class="btn-ghost" id="grammarPrev" ${state.grammar.index === 0 ? "disabled style='opacity:.4;pointer-events:none'" : ""}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Trước
      </button>
      <button class="btn-primary" id="grammarNext">
        <span>${state.grammar.index < grammarData.length - 1 ? "Câu tiếp" : "Hoàn thành"}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  `;

  // TTS button — CHỈ đọc câu hỏi, không đọc đáp án
  document.getElementById("grammarSpeak").addEventListener("click", function () {
    const btn = this;
    if (isSpeaking) {
      stopSpeak();
      btn.classList.remove("speaking");
      return;
    }
    btn.classList.add("speaking");
    speak(g.question, "vi-VN");
    // remove speaking state after estimated duration
    setTimeout(() => btn.classList.remove("speaking"), Math.min(g.question.length * 80 + 800, 8000));
  });

  // Reveal answer
  document.getElementById("grammarReveal").addEventListener("click", function () {
    const answer = document.getElementById("grammarAnswer");
    this.classList.toggle("open");
    if (answer.classList.contains("show")) {
      answer.classList.remove("show");
      this.querySelector("span").textContent = "Hiện đáp án";
      state.grammar.revealed = false;
    } else {
      answer.classList.add("show");
      this.querySelector("span").textContent = "Ẩn đáp án";
      state.grammar.revealed = true;
    }
  });

  document.getElementById("grammarPrev").addEventListener("click", () => {
    if (state.grammar.index > 0) {
      stopSpeak();
      state.grammar.index--;
      renderGrammar();
    }
  });

  document.getElementById("grammarNext").addEventListener("click", () => {
    stopSpeak();
    if (state.grammar.index < grammarData.length - 1) {
      state.grammar.index++;
      renderGrammar();
    } else {
      // loop back
      state.grammar.index = 0;
      renderGrammar();
    }
  });
}

/* ============================================================
   FLASHCARD RENDER — cơ chế mới
   - Hiển thị 1 thẻ
   - Click để lật
   - Chọn "Chưa biết" (đưa lại cuối hàng) / "Đã biết" (loại khỏi hàng)
   - Kết thúc khi hết thẻ
   ============================================================ */
function initFlashcard() {
  // shuffle
  const deck = [...flashcardData];
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  state.flashcard.queue = deck;
  state.flashcard.learned = 0;
  state.flashcard.total = deck.length;
  state.flashcard.finished = false;
  state.flashcard.flipped = false;
}

function renderFlashcard() {
  const fc = state.flashcard;
  const body = document.getElementById("fcBody");

  // init if empty
  if (!fc.queue.length && fc.learned === 0 && !fc.finished) {
    initFlashcard();
  }

  updateFcStats();

  // finished?
  if (fc.finished || fc.queue.length === 0) {
    showFcComplete();
    return;
  }

  const card = fc.queue[0];
  fc.flipped = false;

  body.innerHTML = `
    <div class="fc-stage">
      <div class="fc-card" id="fcCard">
        <div class="fc-face fc-front">
          <div class="label">Từ tiếng Đức</div>
          <div class="word">${card.word}</div>
          <div class="sub">${card.sub}</div>
          <div class="hint">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Nhấn để lật
          </div>
        </div>
        <div class="fc-face fc-back">
          <div class="label">Nghĩa</div>
          <div class="meaning">${card.meaning}</div>
          <div class="example">${card.example}<em>${card.exampleVi}</em></div>
          ${card.grammar ? `<div class="grammar-note">📌 ${card.grammar}</div>` : ""}
        </div>
      </div>
    </div>

    <div class="fc-actions" id="fcActions">
      <button class="fc-btn again" id="fcAgain">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Chưa biết
      </button>
      <button class="fc-btn good" id="fcGood">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        Đã biết
      </button>
    </div>
  `;

  const cardEl = document.getElementById("fcCard");
  const actions = document.getElementById("fcActions");

  cardEl.addEventListener("click", () => {
    if (fc.flipped) return;
    fc.flipped = true;
    cardEl.classList.add("flipped");
    actions.classList.add("ready");
  });

  // Đã biết → loại khỏi queue
  document.getElementById("fcGood").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!fc.flipped) return;
    fc.queue.shift();
    fc.learned++;
    nextFcCard();
  });

  // Chưa biết → đưa xuống cuối
  document.getElementById("fcAgain").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!fc.flipped) return;
    const first = fc.queue.shift();
    fc.queue.push(first);
    nextFcCard();
  });
}

function nextFcCard() {
  state.flashcard.flipped = false;
  if (state.flashcard.queue.length === 0) {
    state.flashcard.finished = true;
    showFcComplete();
  } else {
    renderFlashcard();
  }
  updateFcStats();
}

function updateFcStats() {
  const fc = state.flashcard;
  const learned = fc.learned;
  const remaining = fc.queue.length;
  const total = fc.total || flashcardData.length;
  const pct = total ? Math.round((learned / total) * 100) : 0;

  document.getElementById("fcLearned").textContent = `${learned} đã biết`;
  document.getElementById("fcRemaining").textContent = `· còn ${remaining}`;
  document.getElementById("fcProgress").style.setProperty("--p", pct + "%");
}

function showFcComplete() {
  const body = document.getElementById("fcBody");
  body.innerHTML = `
    <div class="fc-complete show">
      <div class="emoji">🎉</div>
      <h3>Hoàn thành bộ thẻ!</h3>
      <p>Bạn đã học thuộc ${state.flashcard.learned} / ${state.flashcard.total} thẻ.</p>
      <button class="btn-primary" id="fcRestart">
        <span>Học lại từ đầu</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  `;
  document.getElementById("fcRestart").addEventListener("click", () => {
    initFlashcard();
    renderFlashcard();
  });
}

/* ============================================================
   SOUND TOGGLE
   ============================================================ */
document.getElementById("soundToggle").addEventListener("click", function () {
  state.soundOn = !state.soundOn;
  if (!state.soundOn) {
    stopSpeak();
    this.style.opacity = ".4";
  } else {
    this.style.opacity = "1";
  }
});

/* ============================================================
   INIT
   ============================================================ */
renderQuiz();

// prevent double-tap zoom on mobile
document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
</script>
