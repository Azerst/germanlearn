<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học tiếng Đức – Số &amp; Bảng chữ cái</title>
<style>
  :root{
    --bg-0:#070a12; --bg-1:#0d1220;
    --surface:rgba(255,255,255,0.045); --surface-2:rgba(255,255,255,0.075);
    --border:rgba(255,255,255,0.08); --border-2:rgba(255,255,255,0.18);
    --text:#eef2fb; --dim:#c3cce0; --muted:#7888ad;
    --gold:#fbbf24; --gold-2:#f59e0b; --gold-glow:rgba(251,191,36,0.35);
    --green:#10b981; --green-2:#059669; --green-soft:rgba(16,185,129,0.15);
    --red:#ef4444; --red-soft:rgba(239,68,68,0.15);
    --indigo:#6366f1; --indigo-2:#4f46e5; --indigo-soft:rgba(99,102,241,0.2);
    --amber:#f59e0b; --amber-soft:rgba(245,158,11,0.15);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
    padding:24px 14px 40px;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:var(--text);background:var(--bg-0);
    background-image:
      radial-gradient(900px 500px at 15% -10%,rgba(99,102,241,0.20),transparent 60%),
      radial-gradient(800px 500px at 90% 10%,rgba(251,191,36,0.10),transparent 55%),
      radial-gradient(900px 600px at 50% 110%,rgba(16,185,129,0.10),transparent 60%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1));
    background-attachment:fixed;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:620px;display:flex;flex-direction:column;gap:11px;
    animation:appIn .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes appIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  h1{font-size:clamp(17px,4.5vw,22px);text-align:center;margin:0;font-weight:800;
    letter-spacing:-.3px;line-height:1.3}
  h1 em{font-style:normal;background:linear-gradient(100deg,#fff,var(--gold) 60%,var(--gold-2));
    -webkit-background-clip:text;background-clip:text;color:transparent}

  /* ========== SHARED CARD ========== */
  .glass{background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border:1px solid var(--border);border-radius:22px;padding:22px 20px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);position:relative}
  .glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:linear-gradient(135deg,rgba(251,191,36,.20),transparent 40%,transparent 60%,rgba(99,102,241,.16));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .animate{animation:cardIn .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.99)}
    to{opacity:1;transform:translateY(0) scale(1)}}

  /* ========== SETUP SCREEN ========== */
  .setup-title{font-size:20px;font-weight:800;text-align:center;margin:0 0 4px;
    letter-spacing:-.3px}
  .setup-sub{font-size:13px;color:var(--muted);text-align:center;margin:0 0 22px;
    font-weight:600;line-height:1.5}

  .setup-label{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);font-weight:800;margin:18px 0 8px;padding-left:2px;
    display:flex;align-items:center;gap:8px}
  .setup-label:first-of-type{margin-top:0}
  .setup-label .count{
    font-size:9.5px;letter-spacing:.5px;padding:2px 7px;border-radius:99px;
    background:rgba(255,255,255,.06);color:var(--dim);text-transform:none;font-weight:700}

  .section-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pick-card{display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:14px 6px;background:var(--surface);border:1.5px solid var(--border);
    border-radius:14px;color:var(--text);font-family:inherit;cursor:pointer;
    transition:all .2s cubic-bezier(.2,.8,.2,1)}
  .pick-card:hover{background:var(--surface-2);border-color:var(--border-2);
    transform:translateY(-1px)}
  .pick-card:active{transform:translateY(0) scale(.98)}
  .pick-card .icon{font-size:22px;line-height:1}
  .pick-card .label{font-size:12px;font-weight:800;letter-spacing:.1px}
  .pick-card .sub{font-size:9.5px;color:var(--muted);font-weight:600;margin-top:1px}
  .pick-card.active[data-section="quiz"]{
    background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(99,102,241,.08));
    border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  .pick-card.active[data-section="essay"]{
    background:linear-gradient(135deg,rgba(16,185,129,.22),rgba(16,185,129,.08));
    border-color:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
  .pick-card.active[data-section="flash"]{
    background:linear-gradient(135deg,rgba(251,191,36,.22),rgba(251,191,36,.08));
    border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}

  .category-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .cat-card{display:flex;flex-direction:column;gap:5px;padding:12px 14px;
    background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
    color:var(--text);font-family:inherit;text-align:left;cursor:pointer;
    transition:all .2s cubic-bezier(.2,.8,.2,1)}
  .cat-card:hover{background:var(--surface-2);border-color:var(--border-2);
    transform:translateY(-1px)}
  .cat-card:active{transform:translateY(0) scale(.99)}
  .cat-card.active{
    background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(251,191,36,.05));
    border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
  .cat-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cat-card-name{font-size:13px;font-weight:800;color:var(--text)}
  .cat-card.active .cat-card-name{color:var(--gold)}
  .cat-card-badge{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:99px;
    background:rgba(255,255,255,.06);color:var(--muted);font-variant-numeric:tabular-nums}
  .cat-card.active .cat-card-badge{background:rgba(251,191,36,.15);color:var(--gold)}
  .cat-card-bar{height:3px;background:rgba(255,255,255,.06);border-radius:99px;
    overflow:hidden;margin-top:2px}
  .cat-card-bar > i{display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--green),var(--green-2));
    border-radius:99px;transition:width .35s}

  .seg-picker{display:flex;gap:5px;background:var(--surface);padding:5px;
    border-radius:12px;border:1px solid var(--border)}
  .seg-picker button{flex:1;padding:10px 8px;border:0;border-radius:8px;
    background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;
    font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
  .seg-picker button:hover:not(.active){color:var(--dim);background:var(--surface-2)}
  .seg-picker button.active{
    background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1a1200;
    box-shadow:0 3px 12px var(--gold-glow)}

  .start-btn{width:100%;margin-top:22px;padding:17px;border-radius:15px;border:0;
    background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1a1200;
    font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;
    box-shadow:0 8px 28px var(--gold-glow);transition:all .2s;
    letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px}
  .start-btn:hover{transform:translateY(-1px);box-shadow:0 10px 36px var(--gold-glow)}
  .start-btn:active{transform:translateY(0) scale(.99)}

  /* ========== STUDY SCREEN ========== */
  .study-topbar{display:flex;align-items:center;gap:10px;padding:0 2px}
  .back-btn{padding:9px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-family:inherit;font-size:12.5px;
    font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px}
  .back-btn:hover{background:var(--surface-2);border-color:var(--border-2)}
  .back-btn:active{transform:scale(.97)}
  .study-info{display:flex;gap:6px;flex:1;justify-content:flex-end;align-items:center;
    flex-wrap:wrap}
  .study-tag{font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:8px;
    letter-spacing:.5px;text-transform:uppercase}
  .study-tag.quiz{background:var(--indigo-soft);color:#a5b4fc}
  .study-tag.essay{background:rgba(16,185,129,.2);color:#6ee7b7}
  .study-tag.flash{background:rgba(251,191,36,.2);color:var(--gold)}
  .study-cat{font-size:12px;font-weight:700;color:var(--muted)}

  /* Stats */
  .stats{display:flex;gap:6px}
  .stat{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
    background:var(--surface);border:1px solid var(--border);border-radius:11px;
    padding:9px 6px;font-size:11.5px;font-weight:600;color:var(--muted);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .stat b{color:var(--text);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat.correct b{color:var(--green)}
  .stat.streak b{color:var(--gold)}
  .stat.learned b{color:#8b9dff}

  /* Session progress */
  .session-bar{display:flex;flex-direction:column;gap:5px}
  .session-bar-meta{display:flex;justify-content:space-between;font-size:11.5px;
    font-weight:700;color:var(--muted);padding:0 2px}
  .session-bar-meta .lbl{letter-spacing:1px;text-transform:uppercase}
  .bar{height:7px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--gold),var(--gold-2));
    transition:width .4s cubic-bezier(.2,.8,.2,1)}

  /* Q header */
  .q-header{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:15px;gap:10px}
  .q-label{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--muted);font-weight:800}
  .q-number{font-size:11px;font-weight:800;color:var(--gold);
    background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.25);
    padding:4px 11px;border-radius:99px;margin-left:auto;font-variant-numeric:tabular-nums}

  .speak-btn{width:40px;height:40px;border-radius:50%;padding:0;flex-shrink:0;
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:.2s}
  .speak-btn:hover{background:var(--surface-2);border-color:var(--border-2);transform:scale(1.08)}
  .speak-btn:active{transform:scale(.94)}
  .speak-btn.speaking{background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#1a1200;border-color:transparent;animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--gold-glow)}
    70%{box-shadow:0 0 0 14px rgba(251,191,36,0)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}}

  .q-text{font-size:clamp(17px,4.6vw,21px);font-weight:700;line-height:1.5;
    margin-bottom:18px;min-height:2.6em;letter-spacing:-.2px}
  .q-text b{color:var(--gold);font-weight:800}

  /* Options */
  .options{display:flex;flex-direction:column;gap:9px}
  .option{display:flex;align-items:center;gap:13px;padding:14px 16px;background:var(--surface);
    border:1.5px solid var(--border);border-radius:14px;color:var(--text);font-family:inherit;
    font-size:15px;font-weight:600;cursor:pointer;text-align:left;
    transition:all .18s cubic-bezier(.2,.8,.2,1);
    animation:optionIn .35s cubic-bezier(.2,.8,.2,1) backwards}
  .option:nth-child(1){animation-delay:.04s}.option:nth-child(2){animation-delay:.08s}
  .option:nth-child(3){animation-delay:.12s}.option:nth-child(4){animation-delay:.16s}
  @keyframes optionIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .option:hover:not(:disabled){background:var(--surface-2);border-color:var(--border-2);
    transform:translateX(3px)}
  .option:disabled{cursor:default}
  .option-letter{display:flex;align-items:center;justify-content:center;width:32px;height:32px;
    border-radius:9px;flex-shrink:0;background:rgba(251,191,36,.13);color:var(--gold);
    font-weight:800;font-size:13.5px}
  .option-text{flex:1;word-break:break-word;line-height:1.35}
  .option.correct{background:var(--green-soft);border-color:var(--green);
    animation:pop .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
  .option.correct .option-letter{background:rgba(16,185,129,.3);color:#6ee7b7}
  .option.correct .option-text{color:#6ee7b7}
  .option.wrong{background:var(--red-soft);border-color:var(--red)}
  .option.wrong .option-letter{background:rgba(239,68,68,.3);color:#fca5a5}
  .option.wrong .option-text{color:#fca5a5}
  .option.dimmed{opacity:.4}

  /* Essay */
  .essay-input{width:100%;padding:16px 18px;border-radius:14px;border:2px solid var(--border);
    background:rgba(0,0,0,.25);color:var(--text);font-family:inherit;
    font-size:clamp(17px,4.6vw,21px);font-weight:700;transition:.22s;letter-spacing:-.2px}
  .essay-input::placeholder{color:#4d5d80;font-weight:500;font-size:15px;letter-spacing:0}
  .essay-input:focus{outline:none;border-color:var(--gold);background:rgba(251,191,36,.04);
    box-shadow:0 0 0 4px var(--gold-glow)}
  .essay-input:disabled{opacity:.7;cursor:not-allowed}
  .essay-input.correct{border-color:var(--green);background:var(--green-soft);color:#6ee7b7}
  .essay-input.wrong{border-color:var(--red);background:var(--red-soft);color:#fca5a5}

  .check-btn{width:100%;margin-top:14px;padding:15px;border-radius:14px;border:none;
    background:linear-gradient(135deg,var(--green),var(--green-2));color:#fff;
    font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;
    box-shadow:0 6px 22px rgba(16,185,129,.35);transition:all .2s}
  .check-btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(16,185,129,.45)}
  .check-btn:active{transform:translateY(0) scale(.99)}

  /* Feedback */
  .feedback{padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;
    line-height:1.5;animation:rowIn .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .feedback.correct{background:var(--green-soft);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
  .feedback.wrong{background:var(--red-soft);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
  .feedback small{display:block;margin-top:5px;font-size:12px;opacity:.9;font-weight:500;
    line-height:1.5}
  .feedback small b{color:#fff;font-weight:700}
  .feedback small i{font-style:normal;background:rgba(255,255,255,.1);padding:1px 6px;
    border-radius:4px}

  /* Marking */
  .mark-row{display:none;gap:8px;margin-top:14px;animation:rowIn .35s cubic-bezier(.2,.8,.2,1)}
  .mark-row.show{display:flex}
  .mark-btn{flex:1;padding:15px 12px;border-radius:14px;font-family:inherit;font-size:14.5px;
    font-weight:800;cursor:pointer;transition:all .2s cubic-bezier(.2,.8,.2,1);
    display:flex;align-items:center;justify-content:center;gap:7px;letter-spacing:.2px}
  .mark-btn.unlearn{background:var(--amber-soft);border:1.5px solid rgba(245,158,11,.4);
    color:#fcd34d}
  .mark-btn.unlearn:hover{background:rgba(245,158,11,.25);border-color:var(--amber);
    transform:translateY(-1px)}
  .mark-btn.unlearn.suggested{border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(245,158,11,.25),0 4px 16px rgba(245,158,11,.3)}
  .mark-btn.learn{background:var(--green-soft);border:1.5px solid rgba(16,185,129,.4);
    color:#6ee7b7}
  .mark-btn.learn:hover{background:rgba(16,185,129,.25);border-color:var(--green);
    transform:translateY(-1px)}
  .mark-btn.learn.suggested{border-color:var(--green);
    box-shadow:0 0 0 3px rgba(16,185,129,.25),0 4px 16px rgba(16,185,129,.3)}
  .mark-btn:active{transform:translateY(0) scale(.98)}

  /* Flashcard */
  .flash-scene{perspective:1600px;margin:8px 0 10px}
  .flashcard{position:relative;width:100%;height:320px;cursor:pointer;
    transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.4,.2,.2,1)}
  .flashcard.flipped{transform:rotateY(180deg)}
  .flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;text-align:center;
    overflow:hidden;border:1px solid rgba(255,255,255,.08)}
  .flash-front{background:linear-gradient(160deg,#1d2f52,#141f34)}
  .flash-back{background:linear-gradient(160deg,#3d2b0e,#1d1508);transform:rotateY(180deg)}
  .flash-label{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--muted);font-weight:800}
  .flash-back .flash-label{color:#d8a93a}
  .flash-main{font-size:clamp(24px,7.6vw,40px);font-weight:800;line-height:1.15;
    word-break:break-word;max-width:100%}
  .flash-letter{font-size:clamp(76px,24vw,120px);font-weight:800;line-height:1;
    letter-spacing:2px}
  .flash-sub{font-size:clamp(13.5px,3.6vw,16px);color:var(--muted);font-weight:600;
    line-height:1.5}
  .flash-back .flash-sub{color:#e0c68a}
  .flash-badge{position:absolute;top:12px;right:14px;font-size:11px;font-weight:800;
    color:#a9bcdd;background:rgba(255,255,255,.07);padding:4px 10px;border-radius:99px}
  .flash-back .flash-badge{color:#e8cf94;background:rgba(255,255,255,.08)}
  .flash-hint{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:6px;
    font-weight:600}
  .flash-controls{display:flex;gap:8px}
  .flash-controls button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-family:inherit;font-size:13.5px;
    font-weight:700;cursor:pointer;transition:all .2s}
  .flash-controls button:hover{background:var(--surface-2);border-color:var(--border-2)}
  .flash-controls button:active{transform:scale(.98)}

  /* Summary */
  .summary-card{text-align:center;padding:36px 24px}
  .summary-emoji{font-size:56px;line-height:1;margin-bottom:12px}
  .summary-title{font-size:24px;font-weight:800;margin:0 0 6px;
    background:linear-gradient(100deg,#fff,var(--gold));-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .summary-sub{color:var(--muted);font-size:14px;font-weight:600;margin-bottom:22px}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;
    text-align:left}
  .summary-stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:14px 16px}
  .summary-stat .lbl{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--muted);font-weight:800;margin-bottom:4px}
  .summary-stat .val{font-size:22px;font-weight:800;color:var(--text)}
  .summary-stat.gold .val{color:var(--gold)}
  .summary-stat.green .val{color:var(--green)}
  .summary-stat.indigo .val{color:#8b9dff}
  .summary-actions{display:flex;gap:9px}
  .summary-actions button{flex:1;padding:14px;border-radius:13px;font-family:inherit;
    font-size:14.5px;font-weight:800;cursor:pointer;transition:all .2s;border:1px solid var(--border)}
  .restart-btn{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1a1200;
    border-color:transparent;box-shadow:0 5px 18px var(--gold-glow)}
  .restart-btn:hover{transform:translateY(-1px)}
  .change-btn{background:var(--surface);color:var(--text)}
  .change-btn:hover{background:var(--surface-2)}

  .hint{text-align:center;font-size:11.5px;color:#5a6b8f;font-weight:500;
    line-height:1.7;padding:0 10px;margin-top:4px}
  .hint kbd{background:rgba(255,255,255,.06);border:1px solid var(--border);
    border-radius:5px;padding:1px 7px;font-size:10.5px;font-family:inherit;
    color:var(--dim);font-weight:700}

  @media (max-width:420px){
    .glass{padding:18px 15px;border-radius:20px}
    .option{padding:12px 13px;font-size:14px;gap:11px}
    .option-letter{width:28px;height:28px;font-size:12.5px}

<script>
/* ============================================================
   TIỆN ÍCH
   ============================================================ */
const randInt = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = arr => {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
};
const escapeHtml = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================================================
   SỐ → TIẾNG ĐỨC (0 – 1000)
   ============================================================ */
const ONES  = ['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
const TEENS = ['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS  = ['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];

function numToGerman(n){
  if (n === 0) return 'null';
  let r = '';
  if (n >= 1000) {
    const th = Math.floor(n/1000);
    r += (th === 1 ? 'ein' : ONES[th]) + 'tausend';
    n %= 1000;
    if (n === 0) return r;
  }
  if (n >= 100) {
    const h = Math.floor(n/100);
    r += (h === 1 ? 'ein' : ONES[h]) + 'hundert';
    n %= 100;
    if (n === 0) return r;
  }
  if (n >= 20) {
    const t = Math.floor(n/10), u = n%10;
    if (u === 0) r += TENS[t];
    else         r += ONES[u] + 'und' + TENS[t];
  } else if (n === 1) {
    r += 'eins';
  } else if (n >= 2 && n <= 9) {
    r += ONES[n];
  } else if (n >= 10 && n <= 19) {
    r += TEENS[n-10];
  }
  return r;
}

const VN_ONES = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function numToVietnamese(n){
  if (n === 1000) return 'một nghìn';
  if (n === 0) return 'không';
  if (n < 10) return VN_ONES[n];
  if (n < 20) {
    if (n === 10) return 'mười';
    if (n === 15) return 'mười lăm';
    return 'mười ' + VN_ONES[n-10];
  }
  if (n < 100) {
    const t = Math.floor(n/10), u = n%10;
    if (u === 0) return VN_ONES[t] + ' mươi';
    if (u === 1) return VN_ONES[t] + ' mươi mốt';
    if (u === 5) return VN_ONES[t] + ' mươi lăm';
    return VN_ONES[t] + ' mươi ' + VN_ONES[u];
  }
  const h = Math.floor(n/100), rest = n%100;
  let out = VN_ONES[h] + ' trăm';
  if (rest === 0) return out;
  if (rest < 10) return out + ' lẻ ' + VN_ONES[rest];
  if (rest < 20) {
    if (rest === 10) return out + ' mười';
    if (rest === 15) return out + ' mười lăm';
    return out + ' mười ' + VN_ONES[rest-10];
  }
  const t = Math.floor(rest/10), u = rest%10;
  if (u === 0) return out + ' ' + VN_ONES[t] + ' mươi';
  if (u === 1) return out + ' ' + VN_ONES[t] + ' mươi mốt';
  if (u === 5) return out + ' ' + VN_ONES[t] + ' mươi lăm';
  return out + ' ' + VN_ONES[t] + ' mươi ' + VN_ONES[u];
}

/* ============================================================
   BẢNG CHỮ CÁI
   ============================================================ */
const ALPHABET_RAW = [
  {letter:'A',name:'ah',       ex:'Apfel',    mean:'quả táo'},
  {letter:'B',name:'beh',      ex:'Buch',     mean:'quyển sách'},
  {letter:'C',name:'tseh',     ex:'Computer', mean:'máy tính'},
  {letter:'D',name:'deh',      ex:'Danke',    mean:'cảm ơn'},
  {letter:'E',name:'eh',       ex:'Elefant',  mean:'con voi'},
  {letter:'F',name:'ef',       ex:'Fisch',    mean:'con cá'},
  {letter:'G',name:'geh',      ex:'Garten',   mean:'khu vườn'},
  {letter:'H',name:'hah',      ex:'Haus',     mean:'ngôi nhà'},
  {letter:'I',name:'ih',       ex:'Insel',    mean:'hòn đảo'},
  {letter:'J',name:'yot',      ex:'Jahr',     mean:'năm (thời gian)'},
  {letter:'K',name:'kah',      ex:'Katze',    mean:'con mèo'},
  {letter:'L',name:'el',       ex:'Lampe',    mean:'cái đèn'},
  {letter:'M',name:'em',       ex:'Mutter',   mean:'mẹ'},
  {letter:'N',name:'en',       ex:'Nacht',    mean:'ban đêm'},
  {letter:'O',name:'oh',       ex:'Obst',     mean:'trái cây'},
  {letter:'P',name:'peh',      ex:'Papa',     mean:'bố'},
  {letter:'Q',name:'kuh',      ex:'Quelle',   mean:'nguồn'},
  {letter:'R',name:'err',      ex:'Rot',      mean:'màu đỏ'},
  {letter:'S',name:'ess',      ex:'Sonne',    mean:'mặt trời'},
  {letter:'T',name:'teh',      ex:'Tisch',    mean:'cái bàn'},
  {letter:'U',name:'uh',       ex:'Uhr',      mean:'đồng hồ'},
  {letter:'V',name:'fau',      ex:'Vater',    mean:'bố'},
  {letter:'W',name:'weh',      ex:'Wasser',   mean:'nước'},
  {letter:'X',name:'iks',      ex:'Xylophon', mean:'đàn xylophone'},
  {letter:'Y',name:'üpsilon',  ex:'Yoga',     mean:'yoga'},
  {letter:'Z',name:'tsett',    ex:'Zug',      mean:'đoàn tàu'},
  {letter:'Ä',name:'a-umlaut', ex:'Äpfel',    mean:'những quả táo'},
  {letter:'Ö',name:'o-umlaut', ex:'Öl',       mean:'dầu'},
  {letter:'Ü',name:'u-umlaut', ex:'Übung',    mean:'bài tập'},
  {letter:'ß',name:'eszett',   ex:'Straße',   mean:'con đường'},
];

/* ============================================================
   CHỦ ĐỀ
   ============================================================ */
function buildNumItem(n){
  return { id:'num-'+n, type:'number', n, de:numToGerman(n), vi:numToVietnamese(n) };
}

const CATEGORIES = {
  'num-0-20': {
    label:'Số 0–20',
    icon:'0️⃣',
    items: Array.from({length:21}, (_,i) => buildNumItem(i)),
  },
  'num-21-100': {
    label:'Số 21–100',
    icon:'2️⃣',
    items: Array.from({length:80}, (_,i) => buildNumItem(21+i)),
  },
  'num-101-1000': {
    label:'Số 101–1000',
    icon:'💯',
    items: [101,110,111,123,150,178,200,234,250,300,345,400,500,555,600,700,777,800,888,900,999,1000]
      .map(buildNumItem),
  },
  'alphabet': {
    label:'Bảng chữ cái',
    icon:'🔤',
    items: ALPHABET_RAW.map(a => ({
      id:'alpha-'+a.letter, type:'alphabet',
      letter:a.letter, name:a.name, ex:a.ex, mean:a.mean,
    })),
  },
};

// "Tất cả số" = ghép 3 nhóm số
CATEGORIES['num-all'] = {
  label:'Tất cả số',
  icon:'🔢',
  items: [
    ...CATEGORIES['num-0-20'].items,
    ...CATEGORIES['num-21-100'].items,
    ...CATEGORIES['num-101-1000'].items,
  ],
};

const CATEGORY_ORDER = ['num-0-20','num-21-100','num-101-1000','num-all','alphabet'];

/* ============================================================
   TIẾN ĐỘ (localStorage)
   ============================================================ */
const STORAGE_KEY = 'german-learn-progress-v1';
let PROGRESS = {};
try { PROGRESS = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ PROGRESS = {}; }
function saveProgress(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS)); } catch(e){}
}
function learnedCount(catKey){
  const items = CATEGORIES[catKey].items;
  const learned = items.filter(it => PROGRESS[it.id] === 'learned').length;
  return { learned, total: items.length };
}

/* ============================================================
   TRẠNG THÁI
   ============================================================ */
const state = {
  screen: 'setup',          // setup | study
  // cài đặt người dùng chọn trong setup
  setup: {
    section: 'quiz',
    category: 'num-0-20',
    direction: 'vi-de',
    sessionSize: 25,
  },
  // cài đặt đang dùng trong phiên
  section: 'quiz',
  category: 'num-0-20',
  direction: 'vi-de',
  // session
  session: { items:[], index:0, correct:0, total:0, streak:0, bestStreak:0 },
  currentItem: null,
  quizAnswered: false,
  essayAnswered: false,
  flipped: false,
  quizOptions: null, quizCorrectIndex: -1, quizHint: '', quizSpeakText: '',
  essayCorrectAnswer: '', essayCheckMode: '', essayHintHTML: '', essaySpeakText: '',
  autoSpeak: false,
};

/* ============================================================
   ÂM THANH
   ============================================================ */
let germanVoice = null;
function loadVoices(){
  if (!('speechSynthesis' in window)) return;
  const vs = window.speechSynthesis.getVoices();
  germanVoice = vs.find(v => /^de(-|_)/i.test(v.lang))
             || vs.find(v => /deutsch|german/i.test(v.name))
             || null;
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speakGerman(text, btn){
  if (!text) return;
  if (!('speechSynthesis' in window)) {
    alert('Trình duyệt không hỗ trợ phát âm. Hãy dùng Chrome / Edge / Safari / Firefox mới.');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = 0.85; u.pitch = 1;
  if (germanVoice) u.voice = germanVoice;
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (btn) btn.classList.add('speaking');
  u.onend = () => { if (btn) btn.classList.remove('speaking'); };
  u.onerror = () => { if (btn) btn.classList.remove('speaking'); };
  window.speechSynthesis.speak(u);
}

/* ============================================================
   SETUP SCREEN
   ============================================================ */
const setupScreen = document.getElementById('setupScreen');
const studyScreen = document.getElementById('studyScreen');
const categoryPicker = document.getElementById('categoryPicker');
const catCountLabel = document.getElementById('catCountLabel');
const directionPicker = document.getElementById('directionPicker');
const sizePicker = document.getElementById('sizePicker');

// Build category cards
function renderCategoryCards(){
  categoryPicker.innerHTML = '';
  CATEGORY_ORDER.forEach(key => {
    const cat = CATEGORIES[key];
    const { learned, total } = learnedCount(key);
    const pct = total > 0 ? (learned/total*100) : 0;
    const btn = document.createElement('button');
    btn.className = 'cat-card' + (state.setup.category === key ? ' active' : '');
    btn.dataset.cat = key;
    btn.innerHTML = `
      <div class="cat-card-head">
        <span class="cat-card-name">${cat.label}</span>
        <span class="cat-card-badge">${learned}/${total}</span>
      </div>
      <div class="cat-card-bar"><i style="width:${pct}%"></i></div>
    `;
    btn.addEventListener('click', () => {
      state.setup.category = key;
      if (key === 'alphabet' && state.setup.direction === 'vi-de') {
        // direction vẫn giữ, chỉ đổi nhãn
      }
      document.querySelectorAll('.cat-card').forEach(c =>
        c.classList.toggle('active', c.dataset.cat === key));
      updateSetupLabels();
    });
    categoryPicker.appendChild(btn);
  });
}

function updateSetupLabels(){
  const isAlpha = state.setup.category === 'alphabet';
  catCountLabel.textContent = CATEGORIES[state.setup.category].items.length + ' mục';

  // Direction labels
  const dirBtns = directionPicker.querySelectorAll('button');
  if (isAlpha) {
    dirBtns[0].textContent = 'Chữ ➜ Cách đọc';
    dirBtns[1].textContent = 'Cách đọc ➜ Chữ';
  } else {
    dirBtns[0].textContent = 'Số ➜ Tiếng Đức';
    dirBtns[1].textContent = 'Tiếng Đức ➜ Số';
  }
}

// Section picker
document.querySelectorAll('.pick-card').forEach(btn => {
  btn.addEventListener('click', () => {
    state.setup.section = btn.dataset.section;
    document.querySelectorAll('.pick-card').forEach(b =>
      b.classList.toggle('active', b.dataset.section === btn.dataset.section));
  });
});

// Direction picker
directionPicker.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.setup.direction = btn.dataset.dir;
    directionPicker.querySelectorAll('button').forEach(b =>
      b.classList.toggle('active', b.dataset.dir === btn.dataset.dir));
  });
});

// Size picker
sizePicker.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.setup.sessionSize = parseInt(btn.dataset.size, 10);
    sizePicker.querySelectorAll('button').forEach(b =>
      b.classList.toggle('active', b.dataset.size === btn.dataset.size));
  });
});

// Start button
document.getElementById('startBtn').addEventListener('click', () => {
  state.section = state.setup.section;
  state.category = state.setup.category;
  state.direction = state.setup.direction;
  state.session.size = state.setup.sessionSize;

  setupScreen.style.display = 'none';
  studyScreen.style.display = 'flex';
  studyScreen.style.flexDirection = 'column';
  studyScreen.style.gap = '11px';
  state.screen = 'study';

  // update study topbar
  updateStudyTopbar();
  startNewSession();
});

function updateStudyTopbar(){
  const tag = document.getElementById('studyTag');
  tag.className = 'study-tag ' + state.section;
  tag.textContent = state.section === 'quiz' ? 'Trắc nghiệm'
                  : state.section === 'essay' ? 'Tự luận' : 'Lật thẻ';
  document.getElementById('studyCat').textContent = CATEGORIES[state.category].label;
}

// Back button
document.getElementById('backBtn').addEventListener('click', () => {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  state.screen = 'setup';
  studyScreen.style.display = 'none';
  setupScreen.style.display = 'block';
  renderCategoryCards();
  updateSetupLabels();
});

/* ============================================================
   SESSION
   ============================================================ */
function pickSessionItems(catKey, size){
  const items = CATEGORIES[catKey].items;
  const unlearned = items.filter(it => PROGRESS[it.id] !== 'learned');
  const learned   = items.filter(it => PROGRESS[it.id] === 'learned');
  shuffle(unlearned); shuffle(learned);

  const n = Math.min(size, items.length);
  const out = [];
  for (let i = 0; i < unlearned.length && out.length < n; i++) out.push(unlearned[i]);
  for (let i = 0; i < learned.length && out.length < n; i++) out.push(learned[i]);
  return shuffle(out);
}

function startNewSession(){
  const items = pickSessionItems(state.category, state.session.size || 25);
  state.session = { items, index:0, correct:0, total:0, streak:0, bestStreak:0 };
  state.quizAnswered = false;
  state.essayAnswered = false;
  state.flipped = false;
  renderCurrent();
}

/* ============================================================
   RENDER CONTENT
   ============================================================ */
const contentArea = document.getElementById('contentArea');

function renderCurrent(){
  if (!state.session.items.length) { startNewSession(); return; }
  if (state.session.index >= state.session.items.length) { renderSummary(); return; }

  updateSessionProgress();
  updateStats();

  const item = state.session.items[state.session.index];
  state.currentItem = item;

  if (state.section === 'quiz')       renderQuizView(item);
  else if (state.section === 'essay') renderEssayView(item);
  else                                renderFlashView(item);
}

function updateSessionProgress(){
  const { index, items } = state.session;
  document.getElementById('sessionProgressText').textContent =
    Math.min(index + 1, items.length) + ' / ' + items.length;
  document.getElementById('sessionProgressBar').style.width =
    (Math.min(index, items.length) / items.length * 100) + '%';
}

function updateStats(){
  document.getElementById('correctCount').textContent = state.session.correct;
  document.getElementById('totalCount').textContent   = state.session.total;
  document.getElementById('streak').textContent       = state.session.streak;
  const { learned, total } = learnedCount(state.category);
  document.getElementById('learnedCount').textContent = learned + '/' + total;
}

/* ---------- QUIZ ---------- */
function renderQuizView(item){
  const dir = state.direction;
  let questionHTML, options, correctIndex, speakText, hint = '';

  if (item.type === 'number') {
    if (dir === 'vi-de') {
      questionHTML = `Số <b>${item.n}</b> trong tiếng Đức viết là gì?`;
      const correct = item.de;
      options = shuffle([correct, ...buildNumberDistractors(item.n, true)]);
      correctIndex = options.indexOf(correct);
      speakText = item.de;
    } else {
      questionHTML = `Từ tiếng Đức <b>"${item.de}"</b> là số nào?`;
      const correct = String(item.n);
      options = shuffle([correct, ...buildNumberDistractors(item.n, false)]);
      correctIndex = options.indexOf(correct);
      speakText = item.de;
      hint = `Số đúng: ${item.n}`;
    }
  } else {
    const others = ALPHABET_RAW.filter(a => a.letter !== item.letter);
    shuffle(others);
    if (dir === 'vi-de') {
      questionHTML = `Chữ <b style="font-size:1.25em">${item.letter}</b> trong tiếng Đức đọc là gì?`;
      options = shuffle([item.name, ...others.slice(0,3).map(a => a.name)]);
      correctIndex = options.indexOf(item.name);
      speakText = item.letter;
      hint = `Ví dụ: ${item.ex} — ${item.mean}`;
    } else {
      questionHTML = `Cách đọc <b>"${item.name}"</b> là chữ cái nào?`;
      options = shuffle([item.letter, ...others.slice(0,3).map(a => a.letter)]);
      correctIndex = options.indexOf(item.letter);
      speakText = item.letter;
      hint = `Ví dụ: ${item.ex} — ${item.mean}`;
    }
  }

  state.quizOptions = options;
  state.quizCorrectIndex = correctIndex;
  state.quizHint = hint;
  state.quizSpeakText = speakText;
  state.quizAnswered = false;

  const LETTERS = ['A','B','C','D'];
  contentArea.innerHTML = `
    <div class="glass animate">
      <div class="q-header">
        <span class="q-label">Câu hỏi</span>
        <button class="speak-btn" id="speakBtn" title="Nghe tiếng Đức">🔊</button>
        <span class="q-number">#${state.session.index + 1}</span>
      </div>
      <div class="q-text">${questionHTML}</div>
      <div class="options" id="opts"></div>
      <div id="feedbackArea" style="margin-top:14px"></div>
    </div>
    <div class="mark-row" id="markRow">
      <button class="mark-btn unlearn" id="markUnlearn">😕 Chưa thuộc</button>
      <button class="mark-btn learn"   id="markLearn">✅ Thuộc rồi</button>
    </div>
  `;

  const optsEl = document.getElementById('opts');
  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span>` +
                    `<span class="option-text">${escapeHtml(opt)}</span>`;
    btn.addEventListener('click', () => selectQuizOption(i));
    optsEl.appendChild(btn);
  });

  document.getElementById('speakBtn').addEventListener('click', e => {
    e.stopPropagation();
    speakGerman(speakText, e.currentTarget);
  });
  document.getElementById('markUnlearn').addEventListener('click', () => markAndAdvance(false));
  document.getElementById('markLearn').addEventListener('click',   () => markAndAdvance(true));

  if (state.autoSpeak) {
    setTimeout(() => {
      const b = document.getElementById('speakBtn');
      if (b) speakGerman(speakText, b);
    }, 200);
  }
}

function selectQuizOption(idx){
  if (state.quizAnswered) return;
  state.quizAnswered = true;

  const isCorrect = idx === state.quizCorrectIndex;
  state.session.total++;
  if (isCorrect) { state.session.correct++; state.session.streak++; }
  else            { state.session.streak = 0; }
  if (state.session.streak > state.session.bestStreak)
    state.session.bestStreak = state.session.streak;
  updateStats();

  const opts = document.querySelectorAll('.option');
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === state.quizCorrectIndex) btn.classList.add('correct');
    else if (i === idx) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });

  const LETTERS = ['A','B','C','D'];
  const fbArea = document.getElementById('feedbackArea');
  const cL = LETTERS[state.quizCorrectIndex];
  const cT = escapeHtml(state.quizOptions[state.quizCorrectIndex]);

  if (isCorrect) {
    fbArea.innerHTML = `<div class="feedback correct">✅ Chính xác!<small>Đáp án: ${cL} — ${cT}</small></div>`;
  } else {
    fbArea.innerHTML = `<div class="feedback wrong">❌ Sai rồi! Đáp án đúng: <b>${cL}</b> — <b>${cT}</b>` +
      (state.quizHint ? `<small>${state.quizHint}</small>` : '') + `</div>`;
  }

  document.getElementById('markRow').classList.add('show');
  if (isCorrect) document.getElementById('markLearn').classList.add('suggested');
  else           document.getElementById('markUnlearn').classList.add('suggested');

  if (state.autoSpeak) speakGerman(state.quizSpeakText, document.getElementById('speakBtn'));
}

function buildNumberDistractors(correctNum, asGerman){
  const set = new Set();
  const correctStr = asGerman ? numToGerman(correctNum) : String(correctNum);
  const cands = [];
  const offsets = [-1,1,-2,2,-10,10,-20,20,-100,100,-11,11,-101,101];
  for (const o of offsets) {
    const c = correctNum + o;
    if (c >= 0 && c <= 1000) cands.push(c);
  }
  if (correctNum >= 10 && correctNum <= 99) {
    const t = Math.floor(correctNum/10), u = correctNum%10;
    if (u !== 0 && t !== u) cands.push(u*10 + t);
  }
  if (correctNum >= 100 && correctNum <= 999) {
    const h = Math.floor(correctNum/100), rest = correctNum%100;
    if (rest >= 10) {
      const t = Math.floor(rest/10), u = rest%10;
      if (u !== 0 && t !== u) cands.push(h*100 + u*10 + t);
    }
  }
  for (let i = 0; i < 25; i++) cands.push(randInt(0, 1000));
  shuffle(cands);
  for (const c of cands) {
    if (set.size >= 3) break;
    if (c === correctNum) continue;
    const s = asGerman ? numToGerman(c) : String(c);
    if (s === correctStr || set.has(s)) continue;
    set.add(s);
  }
  let fb = 0;
  while (set.size < 3 && fb <= 1000) {
    if (fb !== correctNum) {
      const s = asGerman ? numToGerman(fb) : String(fb);
      if (s !== correctStr && !set.has(s)) set.add(s);
    }
    fb++;
  }
  return [...set];
}

/* ---------- ESSAY ---------- */
function renderEssayView(item){
  let questionHTML, correctAnswer, checkMode, speakText, hintHTML, placeholder;

  if (item.type === 'number') {
    if (state.direction === 'vi-de') {
      questionHTML = `Số <b>${item.n}</b> trong tiếng Đức viết là gì?`;
      correctAnswer = item.de; checkMode = 'german';
      speakText = item.de; hintHTML = ''; placeholder = 'VD: eins, zwei, drei…';
    } else {
      questionHTML = `Từ tiếng Đức <b>"${item.de}"</b> là số nào?`;
      correctAnswer = String(item.n); checkMode = 'number';
      speakText = item.de; hintHTML = ''; placeholder = 'Nhập số…';
    }
  } else {
    if (state.direction === 'vi-de') {
      questionHTML = `Chữ <b style="font-size:1.3em">${item.letter}</b> trong tiếng Đức đọc là gì?`;
      correctAnswer = item.name; checkMode = 'german';
      speakText = item.letter;
      hintHTML = `Ví dụ: ${item.ex} — ${item.mean}`;
      placeholder = 'VD: ah, beh, tseh…';
    } else {
      questionHTML = `Cách đọc <b>"${item.name}"</b> là chữ cái nào?`;
      correctAnswer = item.letter; checkMode = 'german';
      speakText = item.letter;
      hintHTML = `Ví dụ: ${item.ex} — ${item.mean}`;
      placeholder = 'Nhập chữ cái…';
    }
  }

  state.essayCorrectAnswer = correctAnswer;
  state.essayCheckMode = checkMode;
  state.essayHintHTML = hintHTML;
  state.essaySpeakText = speakText;
  state.essayAnswered = false;

  contentArea.innerHTML = `
    <div class="glass animate">
      <div class="q-header">
        <span class="q-label">Câu hỏi</span>
        <button class="speak-btn" id="speakBtn" title="Nghe tiếng Đức">🔊</button>
        <span class="q-number">#${state.session.index + 1}</span>
      </div>
      <div class="q-text">${questionHTML}</div>
      <input type="text" id="essayInput" class="essay-input" placeholder="${placeholder}"
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="check-btn" id="checkBtn">✓ Kiểm tra</button>
      <div id="feedbackArea" style="margin-top:14px"></div>
    </div>
    <div class="mark-row" id="markRow">
      <button class="mark-btn unlearn" id="markUnlearn">😕 Chưa thuộc</button>
      <button class="mark-btn learn"   id="markLearn">✅ Thuộc rồi</button>
    </div>
  `;

  document.getElementById('speakBtn').addEventListener('click', e => {
    e.stopPropagation();
    speakGerman(speakText, e.currentTarget);
  });
  document.getElementById('checkBtn').addEventListener('click', checkEssay);
  document.getElementById('essayInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); checkEssay(); }
  });
  document.getElementById('markUnlearn').addEventListener('click', () => markAndAdvance(false));
  document.getElementById('markLearn').addEventListener('click',   () => markAndAdvance(true));

  setTimeout(() => document.getElementById('essayInput')?.focus(), 80);
}

function normalizeGerman(s){
  return String(s).toLowerCase().trim()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[-_]/g,' ').replace(/\s+/g,' ');
}

function checkEssay(){
  if (state.essayAnswered) return;
  const input = document.getElementById('essayInput');
  const raw = input.value.trim();
  if (!raw) { input.focus(); return; }

  state.essayAnswered = true;
  input.disabled = true;

  let isCorrect = false;
  if (state.essayCheckMode === 'number') {
    const u = parseInt(raw.replace(/\D/g,''), 10);
    const t = parseInt(state.essayCorrectAnswer, 10);
    isCorrect = !isNaN(u) && u === t;
  } else {
    isCorrect = normalizeGerman(raw) === normalizeGerman(state.essayCorrectAnswer);
  }

  state.session.total++;
  if (isCorrect) { state.session.correct++; state.session.streak++; }
  else            { state.session.streak = 0; }
  if (state.session.streak > state.session.bestStreak)
    state.session.bestStreak = state.session.streak;
  updateStats();

  const fbArea = document.getElementById('feedbackArea');
  if (isCorrect) {
    input.classList.add('correct');
    fbArea.innerHTML = `<div class="feedback correct">✅ Chính xác!<small>Đáp án: <b>${escapeHtml(state.essayCorrectAnswer)}</b></small></div>`;
  } else {
    input.classList.add('wrong');
    fbArea.innerHTML = `<div class="feedback wrong">❌ Chưa đúng!<small>Bạn nhập: <i>${escapeHtml(raw)}</i><br>Đáp án: <b>${escapeHtml(state.essayCorrectAnswer)}</b></small>` +
      (state.essayHintHTML ? `<small>💡 ${state.essayHintHTML}</small>` : '') + `</div>`;
  }

  document.getElementById('markRow').classList.add('show');
  if (isCorrect) document.getElementById('markLearn').classList.add('suggested');
  else           document.getElementById('markUnlearn').classList.add('suggested');

  document.getElementById('checkBtn').style.display = 'none';

  if (state.autoSpeak) speakGerman(state.essaySpeakText, document.getElementById('speakBtn'));
}

/* ---------- FLASHCARD ---------- */
function renderFlashView(item){
  let frontLabel, frontMain, frontSub, frontClass = 'flash-main';
  let backLabel, backMain, backSub, backClass = 'flash-main';
  let speakText;

  if (item.type === 'number') {
    if (state.direction === 'vi-de') {
      frontLabel = 'Số'; frontMain = 'Số ' + item.n;
      frontSub = 'Nhấn thẻ để xem tiếng Đức';
      backLabel = 'Deutsch'; backMain = item.de; backSub = item.vi;
      speakText = item.de;
    } else {
      frontLabel = 'Deutsch'; frontMain = item.de;
      frontSub = 'Nhấn thẻ để xem nghĩa';
      backLabel = 'Nghĩa'; backMain = item.n + ' — ' + item.vi;
      backSub = 'Số ' + item.n; speakText = item.de;
    }
  } else {
    frontClass = 'flash-letter'; backClass = 'flash-main';
    if (state.direction === 'vi-de') {
      frontLabel = 'Buchstabe'; frontMain = item.letter;
      frontSub = 'Chữ này đọc là gì?';
      backLabel = 'Aussprache'; backMain = item.name;
      backSub = item.ex + ' — ' + item.mean; speakText = item.letter;
    } else {
      frontLabel = 'Aussprache'; frontMain = item.name;
      frontSub = 'Đây là chữ cái nào?';
      backLabel = 'Buchstabe'; backMain = item.letter;
      backSub = item.ex + ' — ' + item.mean; speakText = item.letter;
    }
  }

  state.flipped = false;

  contentArea.innerHTML = `
    <div class="glass animate">
      <div class="q-header">
        <span class="q-label">Lật thẻ</span>
        <button class="speak-btn" id="speakBtn" title="Nghe tiếng Đức">🔊</button>
        <span class="q-number">#${state.session.index + 1}</span>
      </div>

      <div class="flash-scene">
        <div class="flashcard" id="flashcard">
          <div class="flash-face flash-front">
            <span class="flash-badge">Câu hỏi</span>
            <span class="flash-label">${frontLabel}</span>
            <div class="${frontClass}">${escapeHtml(frontMain)}</div>
            <div class="flash-sub">${escapeHtml(frontSub)}</div>
          </div>
          <div class="flash-face flash-back">
            <span class="flash-badge">Đáp án</span>
            <span class="flash-label">${backLabel}</span>
            <div class="${backClass}">${escapeHtml(backMain)}</div>
            <div class="flash-sub">${escapeHtml(backSub)}</div>
          </div>
        </div>
      </div>

      <div class="flash-hint" id="flashHint">Nhấn vào thẻ hoặc nút bên dưới để lật</div>
      <div class="flash-controls">
        <button id="flipBtn">🔄 Lật thẻ</button>
      </div>
    </div>
    <div class="mark-row" id="markRow">
      <button class="mark-btn unlearn" id="markUnlearn">😕 Chưa thuộc</button>
      <button class="mark-btn learn"   id="markLearn">✅ Thuộc rồi</button>
    </div>
  `;

  const flashcard = document.getElementById('flashcard');
  const flip = () => {
    if (state.flipped) return;
    state.flipped = true;
    flashcard.classList.add('flipped');
    document.getElementById('markRow').classList.add('show');
    document.getElementById('flashHint').textContent = 'Đánh dấu để chuyển thẻ tiếp theo';
    if (state.autoSpeak) speakGerman(speakText, document.getElementById('speakBtn'));
  };

  flashcard.addEventListener('click', flip);
  document.getElementById('flipBtn').addEventListener('click', e => {
    e.stopPropagation(); flip();
  });
  document.getElementById('speakBtn').addEventListener('click', e => {
    e.stopPropagation();
    speakGerman(speakText, e.currentTarget);
  });
  document.getElementById('markUnlearn').addEventListener('click', () => markAndAdvance(false));
  document.getElementById('markLearn').addEventListener('click',   () => markAndAdvance(true));
}

/* ---------- MARK & ADVANCE ---------- */
function markAndAdvance(learned){
  const item = state.currentItem;
  if (!item) return;
  PROGRESS[item.id] = learned ? 'learned' : 'unlearned';
  saveProgress();

  state.session.index++;
  if (state.session.index >= state.session.items.length) {
    renderSummary();
  } else {
    state.quizAnswered = false;
    state.essayAnswered = false;
    state.flipped = false;
    renderCurrent();
  }
}

/* ---------- SUMMARY ---------- */
function renderSummary(){
  const { correct, total, bestStreak } = state.session;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  const { learned, total: catTotal } = learnedCount(state.category);

  document.getElementById('sessionProgressText').textContent = total + ' / ' + total;
  document.getElementById('sessionProgressBar').style.width = '100%';
  updateStats();

  contentArea.innerHTML = `
    <div class="glass summary-card animate">
      <div class="summary-emoji">🎉</div>
      <h2 class="summary-title">Hoàn thành phiên!</h2>
      <div class="summary-sub">Bạn đã hoàn thành ${total} câu hỏi</div>
      <div class="summary-grid">
        <div class="summary-stat green">
          <div class="lbl">Đúng / Tổng</div>
          <div class="val">${correct} / ${total}</div>
        </div>
        <div class="summary-stat gold">
          <div class="lbl">Tỉ lệ đúng</div>
          <div class="val">${pct}%</div>
        </div>
        <div class="summary-stat gold">
          <div class="lbl">Chuỗi tốt nhất</div>
          <div class="val">🔥 ${bestStreak}</div>
        </div>
        <div class="summary-stat indigo">
          <div class="lbl">Đã thuộc chủ đề</div>
          <div class="val">${learned} / ${catTotal}</div>
        </div>
      </div>
      <div class="summary-actions">
        <button class="change-btn" id="changeCatBtn">← Đổi đề</button>
        <button class="restart-btn" id="restartBtn">🔄 Làm lại</button>
      </div>
    </div>
  `;

  document.getElementById('restartBtn').addEventListener('click', startNewSession);
  document.getElementById('changeCatBtn').addEventListener('click', () => {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    state.screen = 'setup';
    studyScreen.style.display = 'none';
    setupScreen.style.display = 'block';
    renderCategoryCards();
    updateSetupLabels();
  });
}

/* ============================================================
   KEYBOARD
   ============================================================ */
document.addEventListener('keydown', e => {
  if (state.screen !== 'study') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;

  if (state.section === 'quiz') {
    if (e.code === 'Digit1' || e.code === 'Numpad1') { e.preventDefault(); if (!state.quizAnswered) document.querySelectorAll('.option')[0]?.click(); }
    else if (e.code === 'Digit2' || e.code === 'Numpad2') { e.preventDefault(); if (!state.quizAnswered) document.querySelectorAll('.option')[1]?.click(); }
    else if (e.code === 'Digit3' || e.code === 'Numpad3') { e.preventDefault(); if (!state.quizAnswered) document.querySelectorAll('.option')[2]?.click(); }
    else if (e.code === 'Digit4' || e.code === 'Numpad4') { e.preventDefault(); if (!state.quizAnswered) document.querySelectorAll('.option')[3]?.click(); }
  } else if (state.section === 'flash') {
    if (e.code === 'Space') {
      e.preventDefault();
      if (!state.flipped) document.getElementById('flipBtn')?.click();
    }
  }
});

/* ============================================================
   INIT
   ============================================================ */
renderCategoryCards();
updateSetupLabels();
</script>
