<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học tiếng Đức – Số 1-1000 &amp; Bảng chữ cái</title>
<style>
  :root{
    --panel:#16213a;
    --text:#e8eefc;
    --muted:#8fa3c8;
    --gold:#f4b400;
    --red:#f85149;
    --red-light:#ffa198;
    --green:#2ea043;
    --green-light:#7ee787;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px 14px;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1b2b4d,#0b1220 65%);
    color:var(--text);
  }
  .app{width:100%;max-width:620px;display:flex;flex-direction:column;gap:12px}

  h1{
    font-size:clamp(17px,4.6vw,23px);text-align:center;margin:0;font-weight:800;letter-spacing:.3px;
  }
  h1 em{
    font-style:normal;
    background:linear-gradient(90deg,#3a3a3a,#fff 25%,var(--red) 55%,var(--gold) 85%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* ====== MAIN MENU (2 phần) ====== */
  .section-menu{
    display:flex;gap:8px;background:var(--panel);
    padding:8px;border-radius:16px;border:1px solid #24365c;
  }
  .section-menu button{
    flex:1;padding:14px 10px;border:0;border-radius:12px;
    background:transparent;color:var(--muted);
    font-size:15px;font-weight:800;cursor:pointer;
    transition:.22s;font-family:inherit;letter-spacing:.3px;
  }
  .section-menu button[data-section="quiz"].active{
    background:linear-gradient(135deg,#4a6db8,#2a3d63);color:#fff;
    box-shadow:0 4px 14px rgba(74,109,184,.4);
  }
  .section-menu button[data-section="essay"].active{
    background:linear-gradient(135deg,#2ea043,#1a6b2e);color:#fff;
    box-shadow:0 4px 14px rgba(46,160,67,.4);
  }

  /* ====== Sub-mode (Số / Chữ) ====== */
  .modes{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:13px;border:1px solid #24365c}
  .modes button{
    flex:1;padding:9px 6px;border:0;border-radius:9px;background:transparent;color:var(--muted);
    font-size:13px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit;
  }
  .modes button.active{
    background:linear-gradient(135deg,var(--gold),#e08b00);color:#1a1200;
    box-shadow:0 4px 12px rgba(244,180,0,.3);
  }

  /* ====== Toolbar ====== */
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select{
    flex:1;min-width:150px;padding:10px 12px;border-radius:11px;border:1px solid #2a3d63;
    background:#182741;color:var(--text);font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;
  }
  select:focus{outline:2px solid rgba(244,180,0,.5);outline-offset:1px}

  .toggle{
    display:flex;align-items:center;gap:7px;
    padding:9px 13px;border-radius:11px;
    background:#182741;border:1px solid #2a3d63;
    font-size:13px;font-weight:700;color:var(--muted);
    cursor:pointer;user-select:none;transition:.18s;white-space:nowrap;
  }
  .toggle:hover{background:#213458}
  .toggle input{accent-color:var(--gold);width:16px;height:16px;cursor:pointer;margin:0}
  .toggle.on{color:#f4d06a;border-color:rgba(244,180,0,.55);background:rgba(244,180,0,.08)}

  /* ====== Stats ====== */
  .stats{
    display:flex;gap:8px;justify-content:space-around;
    background:var(--panel);border:1px solid #24365c;border-radius:14px;padding:11px 10px;
    font-size:12.5px;font-weight:700;
  }
  .stats span{color:var(--muted);display:flex;align-items:center;gap:5px}
  .stats b{color:var(--text);font-size:15px;font-weight:800}

  /* ====== Card ====== */
  .quiz-card{
    background:linear-gradient(160deg,#1d2f52,#141f34);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:22px 20px;
    box-shadow:0 20px 45px rgba(0,0,0,.5);
    position:relative;
  }
  .q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
  .q-label{
    font-size:11px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--muted);font-weight:800;
  }
  .q-number{
    font-size:11px;font-weight:800;color:#a9bcdd;
    background:rgba(255,255,255,.07);padding:4px 10px;border-radius:99px;margin-left:auto;
  }

  .speak-btn{
    width:40px;height:40px;border-radius:50%;padding:0;flex-shrink:0;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.08);color:#e8eefc;
    font-size:18px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:.18s;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .speak-btn:hover{background:rgba(255,255,255,.18);transform:scale(1.07)}
  .speak-btn:active{transform:scale(.93)}
  .speak-btn.speaking{
    background:var(--gold);color:#1a1200;border-color:transparent;
    animation:pulse .9s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(244,180,0,.55)}
    70%{box-shadow:0 0 0 14px rgba(244,180,0,0)}
    100%{box-shadow:0 0 0 0 rgba(244,180,0,0)}
  }

  .q-text{
    font-size:clamp(16.5px,4.4vw,20px);
    font-weight:700;line-height:1.45;
    margin-bottom:18px;min-height:2.6em;
  }
  .q-text b{color:var(--gold)}

  /* ====== Options ====== */
  .options{display:flex;flex-direction:column;gap:9px}
  .option{
    display:flex;align-items:center;gap:13px;
    padding:13px 15px;
    background:#182741;border:1.5px solid #2a3d63;border-radius:13px;
    color:var(--text);font-family:inherit;font-size:15px;font-weight:600;
    cursor:pointer;text-align:left;transition:all .16s;
  }
  .option:hover:not(:disabled){background:#213458;border-color:#3d5585;transform:translateX(2px)}
  .option:disabled{cursor:default}
  .option-letter{
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:9px;flex-shrink:0;
    background:rgba(244,180,0,.15);color:var(--gold);
    font-weight:800;font-size:14px;
  }
  .option-text{flex:1;word-break:break-word;line-height:1.3}
  .option.correct{background:rgba(46,160,67,.2);border-color:var(--green)}
  .option.correct .option-letter{background:rgba(46,160,67,.3);color:var(--green-light)}
  .option.correct .option-text{color:var(--green-light)}
  .option.wrong{background:rgba(248,81,73,.18);border-color:var(--red)}
  .option.wrong .option-letter{background:rgba(248,81,73,.3);color:var(--red-light)}
  .option.wrong .option-text{color:var(--red-light)}
  .option.dimmed{opacity:.45}

  /* ====== Essay input ====== */
  .essay-input{
    width:100%;
    padding:15px 18px;
    border-radius:12px;
    border:2px solid #2a3d63;
    background:#0f1a30;
    color:var(--text);
    font-family:inherit;
    font-size:clamp(16.5px,4.4vw,20px);
    font-weight:700;
    margin-bottom:14px;
    transition:.18s;
  }
  .essay-input::placeholder{color:#4e638a;font-weight:600;font-size:15px}
  .essay-input:focus{
    outline:none;border-color:var(--gold);background:#142138;
    box-shadow:0 0 0 4px rgba(244,180,0,.15);
  }
  .essay-input:disabled{opacity:.7;cursor:not-allowed}
  .essay-input.correct{
    border-color:var(--green);background:rgba(46,160,67,.1);color:var(--green-light);
  }
  .essay-input.wrong{
    border-color:var(--red);background:rgba(248,81,73,.08);color:var(--red-light);
  }

  /* ====== Feedback ====== */
  .feedback{
    margin-top:14px;padding:12px 16px;border-radius:12px;
    font-size:14px;font-weight:600;line-height:1.5;
    display:none;
  }
  .feedback.show{display:block}
  .feedback.correct{background:rgba(46,160,67,.15);color:var(--green-light);border:1px solid rgba(46,160,67,.3)}
  .feedback.wrong{background:rgba(248,81,73,.12);color:var(--red-light);border:1px solid rgba(248,81,73,.3)}
  .feedback small{display:block;margin-top:6px;font-size:12.5px;opacity:.9;font-weight:600;line-height:1.5}
  .feedback small b{color:#fff}
  .feedback small i{font-style:normal;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:4px}

  /* ====== Buttons ====== */
  .next-btn{
    width:100%;padding:16px;border-radius:14px;border:0;
    background:linear-gradient(135deg,var(--gold),#e08b00);
    color:#1a1200;font-family:inherit;font-size:16px;font-weight:800;
    cursor:pointer;box-shadow:0 6px 22px rgba(244,180,0,.28);
    transition:.16s;display:none;
  }
  .next-btn:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(244,180,0,.36)}
  .next-btn:active{transform:translateY(0) scale(.99)}

  .essay-actions{display:flex;gap:9px;margin-top:14px}
  .essay-actions button{
    flex:1;padding:14px;border-radius:12px;border:0;
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    transition:.16s;
  }
  .check-btn{
    background:linear-gradient(135deg,#2ea043,#1a6b2e);
    color:#fff;box-shadow:0 6px 22px rgba(46,160,67,.3);
  }
  .check-btn:hover{transform:translateY(-1px)}
  .check-btn:active{transform:translateY(0) scale(.99)}
  .essay-actions .next-btn{display:none;margin:0;width:auto;flex:1}

  .hint{text-align:center;font-size:12px;color:#61789e;font-weight:600;line-height:1.6}
  .hint kbd{
    background:#1c2b48;border:1px solid #2a3d63;border-radius:4px;
    padding:1px 6px;font-size:11px;font-family:inherit;color:#a9bcdd;
  }

  @media (max-width:420px){
    .quiz-card{padding:18px 14px}
    .option{padding:11px 12px;font-size:14px}
    .option-letter{width:28px;height:28px;font-size:12.5px}
    .stats{font-size:11.5px}
    .section-menu button{font-size:14px;padding:12px 8px}
  }
</style>
</head>
<body>

<div class="app">
  <h1>🇩🇪 Học tiếng Đức: <em>Số 1–1000 &amp; Bảng chữ cái</em></h1>

  <!-- ═══════ MENU CHÍNH: 2 PHẦN ═══════ -->
  <div class="section-menu">
    <button data-section="quiz" class="active">📝 Trắc nghiệm</button>
    <button data-section="essay">✍️ Tự luận</button>
  </div>

  <!-- Sub-mode -->
  <div class="modes">
    <button data-mode="numbers" class="active">🔢 Số 1–1000</button>
    <button data-mode="alphabet">🔤 Bảng chữ cái</button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <select id="direction">
      <option value="vi-de">Số ➜ Tiếng Đức</option>
      <option value="de-vi">Tiếng Đức ➜ Số</option>
    </select>
    <label class="toggle" id="autoSpeakLabel">
      <input type="checkbox" id="autoSpeak">
      <span>🔊 Tự động</span>
    </label>
  </div>

  <!-- Stats -->
  <div class="stats">
    <span>✅ Đúng <b id="correctCount">0</b></span>
    <span>📊 Tổng <b id="totalCount">0</b></span>
    <span>🔥 Chuỗi <b id="streak">0</b></span>
  </div>

  <!-- ═══════ PHẦN 1: TRẮC NGHIỆM ═══════ -->
  <div id="quizSection">
    <div class="quiz-card">
      <div class="q-header">
        <span class="q-label">Câu hỏi</span>
        <button class="speak-btn" id="quizSpeakBtn" title="Nghe phát âm tiếng Đức" aria-label="Phát âm">🔊</button>
        <span class="q-number" id="quizQNumber">#1</span>
      </div>
      <div class="q-text" id="quizQuestionText">Đang tải…</div>
      <div class="options" id="quizOptions"></div>
      <div class="feedback" id="quizFeedback"></div>
    </div>
    <button class="next-btn" id="quizNextBtn">Câu tiếp theo →</button>
  </div>

  <!-- ═══════ PHẦN 2: TỰ LUẬN ═══════ -->
  <div id="essaySection" style="display:none">
    <div class="quiz-card">
      <div class="q-header">
        <span class="q-label">Câu hỏi</span>
        <button class="speak-btn" id="essaySpeakBtn" title="Nghe gợi ý phát âm tiếng Đức" aria-label="Phát âm">🔊</button>
        <span class="q-number" id="essayQNumber">#1</span>
      </div>
      <div class="q-text" id="essayQuestionText"></div>
      <input type="text" id="essayInput" class="essay-input" placeholder="Nhập câu trả lời…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="feedback" id="essayFeedback"></div>
      <div class="essay-actions">
        <button class="check-btn" id="essayCheckBtn">✓ Kiểm tra</button>
        <button class="next-btn" id="essayNextBtn">Câu tiếp →</button>
      </div>
    </div>
  </div>

  <div class="hint">
    <kbd>Enter</kbd> = kiểm tra / câu tiếp · <kbd>1</kbd>–<kbd>4</kbd> = chọn đáp án (trắc nghiệm) · <kbd>🔊</kbd> = nghe tiếng Đức
  </div>
</div>

<script>
/* ============================================================
   CHUYỂN SỐ → TIẾNG ĐỨC (1 – 1000)
   ============================================================ */
const ONES = ['', 'ein', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun'];
const TEENS = ['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS  = ['', '', 'zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];

function numToGerman(n) {
  if (n < 0 || n > 1000) return '?';
  if (n === 0) return 'null';
  let r = '';

  if (n >= 1000) {
    const th = Math.floor(n / 1000);
    r += (th === 1 ? 'ein' : ONES[th]) + 'tausend';
    n %= 1000;
    if (n === 0) return r;
  }
  if (n >= 100) {
    const h = Math.floor(n / 100);
    r += (h === 1 ? 'ein' : ONES[h]) + 'hundert';
    n %= 100;
    if (n === 0) return r;
  }
  if (n >= 20) {
    const t = Math.floor(n / 10), u = n % 10;
    if (u === 0) r += TENS[t];
    else          r += ONES[u] + 'und' + TENS[t];
  } else if (n === 1) {
    r += 'eins';
  } else if (n >= 2 && n <= 9) {
    r += ONES[n];
  } else if (n >= 10 && n <= 19) {
    r += TEENS[n - 10];
  }
  return r;
}

/* Bảng chữ cái */
const alphabet = [
  { letter:'A', name:'ah',        ex:'Apfel',    mean:'quả táo' },
  { letter:'B', name:'beh',       ex:'Buch',     mean:'quyển sách' },
  { letter:'C', name:'tseh',      ex:'Computer', mean:'máy tính' },
  { letter:'D', name:'deh',       ex:'Danke',    mean:'cảm ơn' },
  { letter:'E', name:'eh',        ex:'Elefant',  mean:'con voi' },
  { letter:'F', name:'ef',        ex:'Fisch',    mean:'con cá' },
  { letter:'G', name:'geh',       ex:'Garten',   mean:'khu vườn' },
  { letter:'H', name:'hah',       ex:'Haus',     mean:'ngôi nhà' },
  { letter:'I', name:'ih',        ex:'Insel',    mean:'hòn đảo' },
  { letter:'J', name:'yot',       ex:'Jahr',     mean:'năm (thời gian)' },
  { letter:'K', name:'kah',       ex:'Katze',    mean:'con mèo' },
  { letter:'L', name:'el',        ex:'Lampe',    mean:'cái đèn' },
  { letter:'M', name:'em',        ex:'Mutter',   mean:'mẹ' },
  { letter:'N', name:'en',        ex:'Nacht',    mean:'ban đêm' },
  { letter:'O', name:'oh',        ex:'Obst',     mean:'trái cây' },
  { letter:'P', name:'peh',       ex:'Papa',     mean:'bố' },
  { letter:'Q', name:'kuh',       ex:'Quelle',   mean:'nguồn' },
  { letter:'R', name:'err',       ex:'Rot',      mean:'màu đỏ' },
  { letter:'S', name:'ess',       ex:'Sonne',    mean:'mặt trời' },
  { letter:'T', name:'teh',       ex:'Tisch',    mean:'cái bàn' },
  { letter:'U', name:'uh',        ex:'Uhr',      mean:'đồng hồ' },
  { letter:'V', name:'fau',       ex:'Vater',    mean:'bố' },
  { letter:'W', name:'weh',       ex:'Wasser',   mean:'nước' },
  { letter:'X', name:'iks',       ex:'Xylophon', mean:'đàn xylophone' },
  { letter:'Y', name:'üpsilon',   ex:'Yoga',     mean:'yoga' },
  { letter:'Z', name:'tsett',     ex:'Zug',      mean:'đoàn tàu' },
  { letter:'Ä', name:'a-umlaut',  ex:'Äpfel',    mean:'những quả táo' },
  { letter:'Ö', name:'o-umlaut',  ex:'Öl',       mean:'dầu' },
  { letter:'Ü', name:'u-umlaut',  ex:'Übung',    mean:'bài tập' },
  { letter:'ß', name:'eszett',    ex:'Straße',   mean:'con đường' },
];

/* ============================================================
   TRẠNG THÁI
   ============================================================ */
const state = {
  section: 'quiz',        // 'quiz' | 'essay'
  mode: 'numbers',        // 'numbers' | 'alphabet'
  direction: 'vi-de',
  correct: 0, total: 0, streak: 0,
  autoSpeak: false,
  // quiz
  currentQuiz: null, quizAnswered: false, quizNo: 0,
  // essay
  currentEssay: null, essayAnswered: false, essayNo: 0,
};

/* Elements */
const el = {
  direction:      document.getElementById('direction'),
  autoSpeak:      document.getElementById('autoSpeak'),
  autoSpeakLabel: document.getElementById('autoSpeakLabel'),
  correctCount:   document.getElementById('correctCount'),
  totalCount:     document.getElementById('totalCount'),
  streak:         document.getElementById('streak'),
  sectionBtns:    document.querySelectorAll('.section-menu button'),
  modeBtns:       document.querySelectorAll('.modes button'),
  // quiz
  quizSection:     document.getElementById('quizSection'),
  quizSpeakBtn:    document.getElementById('quizSpeakBtn'),
  quizQNumber:     document.getElementById('quizQNumber'),
  quizQuestionText:document.getElementById('quizQuestionText'),
  quizOptions:     document.getElementById('quizOptions'),
  quizFeedback:    document.getElementById('quizFeedback'),
  quizNextBtn:     document.getElementById('quizNextBtn'),
  // essay
  essaySection:    document.getElementById('essaySection'),
  essaySpeakBtn:   document.getElementById('essaySpeakBtn'),
  essayQNumber:    document.getElementById('essayQNumber'),
  essayQuestionText:document.getElementById('essayQuestionText'),
  essayInput:      document.getElementById('essayInput'),
  essayFeedback:   document.getElementById('essayFeedback'),
  essayCheckBtn:   document.getElementById('essayCheckBtn'),
  essayNextBtn:    document.getElementById('essayNextBtn'),
};

const LETTERS = ['A','B','C','D'];

/* ============================================================
   TIỆN ÍCH
   ============================================================ */
function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Chuẩn hoá câu trả lời tiếng Đức — chấp nhận cả ae/oe/ue/ss */
function normalizeGerman(s) {
  return String(s).toLowerCase().trim()
    .replace(/ä/g,'ae')
    .replace(/ö/g,'oe')
    .replace(/ü/g,'ue')
    .replace(/ß/g,'ss')
    .replace(/[-_]/g,' ')
    .replace(/\s+/g,' ');
}

/* ============================================================
   ÂM THANH (Web Speech API)
   ============================================================ */
let germanVoice = null;
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  germanVoice =
    voices.find(v => /^de(-|_)/i.test(v.lang)) ||
    voices.find(v => /deutsch|german/i.test(v.name)) ||
    null;
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speakGerman(text, btn) {
  if (!text) return;
  if (!('speechSynthesis' in window)) {
    alert('Trình duyệt không hỗ trợ phát âm. Hãy dùng Chrome / Edge / Safari / Firefox mới.');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = 0.85;
  u.pitch = 1;
  if (germanVoice) u.voice = germanVoice;

  // Xác định nút nào đang "nói" để thêm hiệu ứng
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  const target = btn || null;
  if (target) target.classList.add('speaking');

  u.onend = () => { if (target) target.classList.remove('speaking'); };
  u.onerror = () => { if (target) target.classList.remove('speaking'); };
  window.speechSynthesis.speak(u);
}

/* ============================================================
   TẠO CÂU HỎI — TRẮC NGHIỆM
   ============================================================ */
function buildNumberDistractors(correctNum, asGerman) {
  const set = new Set();
  const correctStr = asGerman ? numToGerman(correctNum) : String(correctNum);
  const candidates = [];

  const offsets = [-1, 1, -2, 2, -10, 10, -20, 20, -100, 100, -11, 11, -101, 101];
  for (const o of offsets) {
    const c = correctNum + o;
    if (c >= 1 && c <= 1000) candidates.push(c);
  }
  if (correctNum >= 10 && correctNum <= 99) {
    const t = Math.floor(correctNum / 10), u = correctNum % 10;
    if (u !== 0 && t !== u) candidates.push(u * 10 + t);
  }
  if (correctNum >= 100 && correctNum <= 999) {
    const h = Math.floor(correctNum / 100), rest = correctNum % 100;
    if (rest >= 10) {
      const t = Math.floor(rest / 10), u = rest % 10;
      if (u !== 0 && t !== u) candidates.push(h * 100 + u * 10 + t);
    }
  }
  for (let i = 0; i < 20; i++) candidates.push(randInt(1, 1000));

  shuffle(candidates);
  for (const c of candidates) {
    if (set.size >= 3) break;
    if (c === correctNum) continue;
    const s = asGerman ? numToGerman(c) : String(c);
    if (s === correctStr || set.has(s)) continue;
    set.add(s);
  }
  let fb = 1;
  while (set.size < 3 && fb <= 1000) {
    if (fb !== correctNum) {
      const s = asGerman ? numToGerman(fb) : String(fb);
      if (s !== correctStr && !set.has(s)) set.add(s);
    }
    fb++;
  }
  return [...set];
}

function genQuizNumber() {
  const n = randInt(1, 1000);
  if (state.direction === 'vi-de') {
    const correct = numToGerman(n);
    const options = shuffle([correct, ...buildNumberDistractors(n, true)]);
    return {
      questionHTML: `Số <b>${n}</b> trong tiếng Đức viết là gì?`,
      options,
      correctIndex: options.indexOf(correct),
      speakText: correct,
      hint: '',
    };
  } else {
    const german = numToGerman(n);
    const correct = String(n);
    const options = shuffle([correct, ...buildNumberDistractors(n, false)]);
    return {
      questionHTML: `Từ tiếng Đức <b>"${german}"</b> là số nào?`,
      options,
      correctIndex: options.indexOf(correct),
      speakText: german,
      hint: `Số đúng: ${n}`,
    };
  }
}

function genQuizAlphabet() {
  const correct = alphabet[randInt(0, alphabet.length - 1)];
  const others = alphabet.filter(a => a !== correct);
  shuffle(others);

  if (state.direction === 'vi-de') {
    const distractors = others.slice(0, 3).map(a => a.name);
    const options = shuffle([correct.name, ...distractors]);
    return {
      questionHTML: `Chữ <b style="font-size:1.25em">${correct.letter}</b> trong tiếng Đức đọc là gì?`,
      options,
      correctIndex: options.indexOf(correct.name),
      speakText: correct.letter,
      hint: `Ví dụ: ${correct.ex} — ${correct.mean}`,
    };
  } else {
    const distractors = others.slice(0, 3).map(a => a.letter);
    const options = shuffle([correct.letter, ...distractors]);
    return {
      questionHTML: `Cách đọc <b>"${correct.name}"</b> là chữ cái nào?`,
      options,
      correctIndex: options.indexOf(correct.letter),
      speakText: correct.letter,
      hint: `Ví dụ: ${correct.ex} — ${correct.mean}`,
    };
  }
}

function genQuizQuestion() {
  return state.mode === 'alphabet' ? genQuizAlphabet() : genQuizNumber();
}

/* ============================================================
   TẠO CÂU HỎI — TỰ LUẬN
   ============================================================ */
function genEssayQuestion() {
  if (state.mode === 'alphabet') {
    const correct = alphabet[randInt(0, alphabet.length - 1)];
    if (state.direction === 'vi-de') {
      // Chữ → Cách đọc
      return {
        questionHTML: `Chữ <b style="font-size:1.3em">${correct.letter}</b> trong tiếng Đức đọc là gì?`,
        correctAnswer: correct.name,
        checkMode: 'german',
        speakText: correct.letter,
        hintHTML: `Ví dụ: ${correct.ex} — ${correct.mean}`,
        inputPlaceholder: 'VD: ah, beh, tseh…',
      };
    } else {
      // Cách đọc → Chữ
      return {
        questionHTML: `Cách đọc <b>"${correct.name}"</b> là chữ cái nào?`,
        correctAnswer: correct.letter,
        checkMode: 'german',
        speakText: correct.letter,
        hintHTML: `Ví dụ: ${correct.ex} — ${correct.mean}`,
        inputPlaceholder: 'Nhập chữ cái…',
      };
    }
  }

  const n = randInt(1, 1000);
  const german = numToGerman(n);

  if (state.direction === 'vi-de') {
    // Số → Tiếng Đức
    return {
      questionHTML: `Số <b>${n}</b> trong tiếng Đức viết là gì?`,
      correctAnswer: german,
      checkMode: 'german',
      speakText: german,
      hintHTML: '',
      inputPlaceholder: 'VD: eins, zwei, drei…',
    };
  } else {
    // Tiếng Đức → Số
    return {
      questionHTML: `Từ tiếng Đức <b>"${german}"</b> là số nào?`,
      correctAnswer: String(n),
      checkMode: 'number',
      speakText: german,
      hintHTML: '',
      inputPlaceholder: 'Nhập số…',
    };
  }
}

/* ============================================================
   RENDER — TRẮC NGHIỆM
   ============================================================ */
function renderQuiz() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));

  const q = genQuizQuestion();
  state.currentQuiz = q;
  state.quizAnswered = false;
  state.quizNo++;

  el.quizQNumber.textContent = '#' + state.quizNo;
  el.quizQuestionText.innerHTML = q.questionHTML;

  el.quizOptions.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.dataset.index = i;
    btn.innerHTML =
      `<span class="option-letter">${LETTERS[i]}</span>` +
      `<span class="option-text">${escapeHtml(opt)}</span>`;
    btn.addEventListener('click', () => selectQuizOption(i));
    el.quizOptions.appendChild(btn);
  });

  el.quizFeedback.className = 'feedback';
  el.quizFeedback.innerHTML = '';
  el.quizNextBtn.style.display = 'none';
}

function selectQuizOption(index) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;

  const q = state.currentQuiz;
  const isCorrect = index === q.correctIndex;

  state.total++;
  if (isCorrect) { state.correct++; state.streak++; }
  else            { state.streak = 0; }

  const btns = el.quizOptions.querySelectorAll('.option');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correctIndex) btn.classList.add('correct');
    else if (i === index)     btn.classList.add('wrong');
    else                      btn.classList.add('dimmed');
  });

  if (isCorrect) {
    el.quizFeedback.className = 'feedback correct show';
    el.quizFeedback.innerHTML =
      `✅ Chính xác!<small>Đáp án: ${LETTERS[q.correctIndex]} — ${escapeHtml(q.options[q.correctIndex])}</small>`;
  } else {
    el.quizFeedback.className = 'feedback wrong show';
    el.quizFeedback.innerHTML =
      `❌ Sai rồi! Đáp án đúng là <b>${LETTERS[q.correctIndex]}</b> — <b>${escapeHtml(q.options[q.correctIndex])}</b>` +
      (q.hint ? `<small>${q.hint}</small>` : '');
  }

  updateStats();
  el.quizNextBtn.style.display = 'block';

  if (state.autoSpeak) speakGerman(q.speakText, el.quizSpeakBtn);
}

/* ============================================================
   RENDER — TỰ LUẬN
   ============================================================ */
function renderEssay() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));

  const q = genEssayQuestion();
  state.currentEssay = q;
  state.essayAnswered = false;
  state.essayNo++;

  el.essayQNumber.textContent = '#' + state.essayNo;
  el.essayQuestionText.innerHTML = q.questionHTML;

  el.essayInput.value = '';
  el.essayInput.disabled = false;
  el.essayInput.className = 'essay-input';
  el.essayInput.placeholder = q.inputPlaceholder || 'Nhập câu trả lời…';

  el.essayFeedback.className = 'feedback';
  el.essayFeedback.innerHTML = '';

  el.essayCheckBtn.style.display = 'block';
  el.essayNextBtn.style.display = 'none';

  setTimeout(() => el.essayInput.focus(), 50);
}

function checkEssay() {
  if (state.essayAnswered) return;
  const raw = el.essayInput.value.trim();
  if (!raw) { el.essayInput.focus(); return; }

  state.essayAnswered = true;
  el.essayInput.disabled = true;

  const q = state.currentEssay;
  let isCorrect = false;

  if (q.checkMode === 'number') {
    const userNum = parseInt(raw.replace(/\D/g, ''), 10);
    const target  = parseInt(q.correctAnswer, 10);
    isCorrect = !isNaN(userNum) && userNum === target;
  } else {
    isCorrect = normalizeGerman(raw) === normalizeGerman(q.correctAnswer);
  }

  state.total++;
  if (isCorrect) { state.correct++; state.streak++; }
  else            { state.streak = 0; }
  updateStats();

  if (isCorrect) {
    el.essayInput.classList.add('correct');
    el.essayFeedback.className = 'feedback correct show';
    el.essayFeedback.innerHTML =
      `✅ Chính xác!<small>Đáp án: <b>${escapeHtml(q.correctAnswer)}</b></small>`;
  } else {
    el.essayInput.classList.add('wrong');
    el.essayFeedback.className = 'feedback wrong show';
    el.essayFeedback.innerHTML =
      `❌ Chưa đúng!<small>Bạn nhập: <i>${escapeHtml(raw)}</i><br>Đáp án: <b>${escapeHtml(q.correctAnswer)}</b></small>` +
      (q.hintHTML ? `<small>💡 ${q.hintHTML}</small>` : '');
  }

  el.essayCheckBtn.style.display = 'none';
  el.essayNextBtn.style.display = 'block';

  if (state.autoSpeak) speakGerman(q.speakText, el.essaySpeakBtn);
}

/* ============================================================
   DÙNG CHUNG
   ============================================================ */
function updateStats() {
  el.correctCount.textContent = state.correct;
  el.totalCount.textContent   = state.total;
  el.streak.textContent       = state.streak;
}

function updateDirectionOptions() {
  if (state.mode === 'alphabet') {
    el.direction.innerHTML = `
      <option value="vi-de">Chữ ➜ Cách đọc</option>
      <option value="de-vi">Cách đọc ➜ Chữ</option>
    `;
  } else {
    el.direction.innerHTML = `
      <option value="vi-de">Số ➜ Tiếng Đức</option>
      <option value="de-vi">Tiếng Đức ➜ Số</option>
    `;
  }
  el.direction.value = state.direction;
}

function renderCurrent() {
  if (state.section === 'quiz') renderQuiz();
  else                          renderEssay();
}

/* ============================================================
   SỰ KIỆN — MENU CHÍNH
   ============================================================ */
el.sectionBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const sec = btn.dataset.section;
    if (state.section === sec) return;
    state.section = sec;
    el.sectionBtns.forEach(b => b.classList.toggle('active', b.dataset.section === sec));

    if (sec === 'quiz') {
      el.quizSection.style.display = 'block';
      el.essaySection.style.display = 'none';
      renderQuiz();
    } else {
      el.quizSection.style.display = 'none';
      el.essaySection.style.display = 'block';
      renderEssay();
    }
  });
});

/* Sự kiện — sub-mode (Số / Chữ) */
el.modeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    el.modeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;

    // Reset thống kê khi đổi chủ đề
    state.correct = 0; state.total = 0; state.streak = 0;
    updateStats();

    updateDirectionOptions();
    renderCurrent();
  });
});

/* Sự kiện — chọn chiều */
el.direction.addEventListener('change', e => {
  state.direction = e.target.value;
  renderCurrent();
});

/* Sự kiện — tự động phát âm */
el.autoSpeak.addEventListener('change', e => {
  state.autoSpeak = e.target.checked;
  el.autoSpeakLabel.classList.toggle('on', state.autoSpeak);
});

/* Sự kiện — nút loa */
el.quizSpeakBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (state.currentQuiz) speakGerman(state.currentQuiz.speakText, el.quizSpeakBtn);
});
el.essaySpeakBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (state.currentEssay) speakGerman(state.currentEssay.speakText, el.essaySpeakBtn);
});

/* Sự kiện — điều hướng quiz */
el.quizNextBtn.addEventListener('click', renderQuiz);

/* Sự kiện — điều hướng essay */
el.essayCheckBtn.addEventListener('click', checkEssay);
el.essayNextBtn.addEventListener('click', renderEssay);
el.essayInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (state.essayAnswered) renderEssay();
    else                     checkEssay();
  }
});

/* Sự kiện — bàn phím toàn cục */
document.addEventListener('keydown', e => {
  if (state.section === 'essay') return; // essay đã xử lý riêng

  if (e.code === 'Digit1' || e.code === 'Numpad1') { e.preventDefault(); clickQuizOption(0); }
  else if (e.code === 'Digit2' || e.code === 'Numpad2') { e.preventDefault(); clickQuizOption(1); }
  else if (e.code === 'Digit3' || e.code === 'Numpad3') { e.preventDefault(); clickQuizOption(2); }
  else if (e.code === 'Digit4' || e.code === 'Numpad4') { e.preventDefault(); clickQuizOption(3); }
  else if (e.code === 'Enter' && state.quizAnswered) { e.preventDefault(); renderQuiz(); }
});

function clickQuizOption(idx) {
  if (state.quizAnswered) return;
  const btns = el.quizOptions.querySelectorAll('.option');
  if (btns[idx]) btns[idx].click();
}

/* ============================================================
   KHỞI TẠO
   ============================================================ */
updateDirectionOptions();
renderQuiz();
updateStats();
</script>
</body>
</html>
