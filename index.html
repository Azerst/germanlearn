<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Tiếng Đức · VANBAC</title>
<style>
  :root{
    --bg:#faf8f4;
    --bg-2:#f5f2ec;
    --surface:#ffffff;
    --surface-2:#f5f2ec;
    --line:#e8e3d9;
    --line-2:#d0c9ba;
    --ink:#0a0a14;
    --ink-soft:#3a3a4a;
    --muted:#8a8a95;
    --gold:#c9a227;
    --gold-soft:#faf0d0;
    --gold-2:#f4c542;
    --red:#c81e1e;
    --red-soft:#fce8e8;
    --green:#0a7a4a;
    --green-soft:#ddf5ea;
    --amber:#92500a;
    --amber-soft:#fdf0d5;
    --indigo:#3d3dc9;
    --indigo-soft:#e5e5ff;
    --blue:#1d4ed8;
    --blue-soft:#e0e8ff;
    --shadow-sm:0 1px 3px rgba(10,10,20,.05);
    --shadow-md:0 12px 32px -16px rgba(10,10,20,.15);
    --shadow-lg:0 24px 60px -24px rgba(10,10,20,.22);
    --serif:'Iowan Old Style','Palatino Linotype','Times New Roman',Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    background-image:
      radial-gradient(900px 500px at 100% -10%, rgba(201,162,39,.09), transparent 60%),
      radial-gradient(800px 500px at 0% 100%, rgba(61,61,201,.05), transparent 55%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    letter-spacing:-0.01em;
  }
  .app{
    max-width:600px;margin:0 auto;padding:32px 18px 56px;
    display:flex;flex-direction:column;gap:20px;
    animation:fadeUp .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* ============ HERO ============ */
  .hero{
    display:flex;flex-direction:column;align-items:center;gap:0;
    text-align:center;padding:8px 0 12px;
  }
  .hero-flag{
    display:inline-flex;flex-direction:column;
    width:34px;height:23px;border-radius:5px;overflow:hidden;
    box-shadow:0 4px 14px rgba(10,10,20,.15),inset 0 0 0 1px rgba(0,0,0,.05);
    margin-bottom:18px;
  }
  .hero-flag span{flex:1}
  .hero-flag span:nth-child(1){background:#0a0a14}
  .hero-flag span:nth-child(2){background:#c81e1e}
  .hero-flag span:nth-child(3){background:#f4c542}

  .hero-title{
    margin:0;font-size:clamp(30px,7.5vw,44px);font-weight:800;
    letter-spacing:-1.4px;line-height:1.05;color:var(--ink);
  }
  .hero-divider{
    width:36px;height:2px;background:var(--gold);
    border-radius:2px;margin:16px 0 14px;
  }
  .hero-credit{
    margin:0;font-size:10px;letter-spacing:3.5px;
    text-transform:uppercase;font-weight:700;color:var(--muted);
  }
  .hero-credit strong{
    color:var(--ink);font-weight:800;letter-spacing:3.5px;
  }

  /* ============ SECTION HEAD ============ */
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:0 4px;margin-top:8px;
  }
  .section-label{
    font-size:11px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--muted);font-weight:800;
  }

  /* ============ CATEGORY GRID ============ */
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cat-card{
    display:flex;flex-direction:column;gap:10px;
    padding:18px 16px 16px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    text-align:left;cursor:pointer;font-family:inherit;
    transition:all .22s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-sm);
    position:relative;overflow:hidden;
  }
  .cat-card:hover{
    border-color:var(--ink);transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
  .cat-card:active{transform:translateY(0) scale(.99)}
  .cat-head{display:flex;justify-content:space-between;align-items:flex-start}
  .cat-icon{
    width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
  }
  .cat-count{
    font-size:10.5px;font-weight:800;color:var(--muted);
    font-variant-numeric:tabular-nums;letter-spacing:.3px;
  }
  .cat-name{
    font-size:15px;font-weight:800;letter-spacing:-.3px;
    color:var(--ink);margin-top:2px;
  }
  .cat-sub{font-size:11px;font-weight:600;color:var(--muted);margin-top:-6px}
  .cat-bar{
    height:4px;background:var(--bg-2);
    border-radius:99px;overflow:hidden;margin-top:4px;
  }
  .cat-bar > i{
    display:block;height:100%;border-radius:99px;
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }

  /* ============ QUICK BUTTON ============ */
  .quick-btn{
    display:flex;align-items:center;gap:14px;
    padding:17px 20px;
    background:var(--ink);color:#fff;
    border:none;border-radius:18px;
    font-family:inherit;font-size:14.5px;font-weight:700;
    letter-spacing:-.1px;
    cursor:pointer;transition:all .22s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 8px 24px -10px rgba(10,10,20,.4);
  }
  .quick-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 32px -10px rgba(10,10,20,.45);
  }
  .quick-btn:active{transform:translateY(0) scale(.99)}
  .quick-icon{font-size:18px;line-height:1}
  .quick-label{flex:1;text-align:left}
  .quick-arrow{
    font-size:16px;font-weight:800;opacity:.85;
    transition:transform .2s;
  }
  .quick-btn:hover .quick-arrow{transform:translateX(4px)}

  /* ============ EXAM GRID ============ */
  .exam-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .exam-card{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:16px 6px 14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    font-family:inherit;cursor:pointer;
    transition:all .22s cubic-bezier(.2,.8,.2,1);
    position:relative;overflow:hidden;
    box-shadow:var(--shadow-sm);
  }
  .exam-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--accent);
  }
  .exam-card:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
  .exam-card:active{transform:translateY(0) scale(.98)}
  .exam-level{
    font-size:22px;font-weight:800;letter-spacing:-.8px;
    color:var(--accent);line-height:1;margin-top:2px;
  }
  .exam-name{
    font-size:9.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:1.2px;
    color:var(--muted);margin-top:2px;
  }

  /* ============ FOOT ============ */
  .foot{
    text-align:center;font-size:11px;color:var(--muted);
    font-weight:500;line-height:1.8;padding-top:12px;
    letter-spacing:.05px;
  }
  .foot kbd{
    background:var(--surface);border:1px solid var(--line);
    border-radius:5px;padding:1.5px 7px;font-size:10.5px;
    font-family:inherit;color:var(--ink-soft);font-weight:700;
    box-shadow:0 1px 0 var(--line);
  }

  /* ============ BACK BUTTON ============ */
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;
    background:var(--surface);color:var(--ink-soft);
    border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:12.5px;font-weight:700;
    cursor:pointer;transition:all .18s;
    box-shadow:var(--shadow-sm);
  }
  .back-btn:hover{border-color:var(--ink);color:var(--ink)}
  .back-btn:active{transform:scale(.97)}

  /* ============ SETUP SCREEN ============ */
  .setup-top{display:flex;align-items:center;margin-bottom:6px}
  .setup-hero{
    display:flex;align-items:center;gap:14px;
    padding:4px 0 8px;
  }
  .setup-icon{
    width:52px;height:52px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;
  }
  .setup-titles{display:flex;flex-direction:column;gap:2px;min-width:0}
  .setup-title{
    font-size:22px;font-weight:800;letter-spacing:-.6px;
    color:var(--ink);margin:0;line-height:1.1;
  }
  .setup-sub{
    font-size:12.5px;font-weight:600;color:var(--muted);
    margin:0;letter-spacing:.05px;
  }
  .setup-sub b{color:var(--ink);font-weight:800}

  .setup-label{
    display:flex;align-items:center;gap:8px;
    font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);font-weight:800;
    margin:22px 0 10px;padding-left:2px;
  }
  .setup-label:first-of-type{margin-top:0}
  .setup-label .count{
    font-size:9.5px;letter-spacing:.4px;padding:2px 8px;
    border-radius:99px;background:var(--bg-2);color:var(--ink-soft);
    text-transform:none;font-weight:700;
  }

  .mode-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mode-card{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:16px 6px;
    background:var(--surface);
    border:1.5px solid var(--line);border-radius:14px;
    color:var(--ink);font-family:inherit;cursor:pointer;
    transition:all .2s cubic-bezier(.2,.8,.2,1);
    box-shadow:var(--shadow-sm);
  }
  .mode-card:hover:not(.active){
    border-color:var(--line-2);transform:translateY(-1px);
  }
  .mode-card:active{transform:translateY(0) scale(.98)}
  .mode-card .icon{font-size:22px;line-height:1}
  .mode-card .name{font-size:12px;font-weight:800;letter-spacing:-.1px}
  .mode-card .desc{font-size:9.5px;color:var(--muted);font-weight:600}
  .mode-card.active[data-mode="flash"]{
    background:var(--indigo-soft);border-color:var(--indigo);
    box-shadow:0 0 0 3px rgba(61,61,201,.12);
  }
  .mode-card.active[data-mode="quiz"]{
    background:var(--green-soft);border-color:var(--green);
    box-shadow:0 0 0 3px rgba(10,122,74,.12);
  }
  .mode-card.active[data-mode="type"]{
    background:var(--gold-soft);border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,39,.15);
  }

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    padding:8px 15px;border-radius:10px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:700;
    cursor:pointer;transition:all .2s;white-space:nowrap;
    box-shadow:var(--shadow-sm);
  }
  .chip:hover:not(.active){border-color:var(--ink);color:var(--ink)}
  .chip.active{
    background:var(--ink);border-color:var(--ink);
    color:#fff;box-shadow:0 4px 12px -4px rgba(10,10,20,.3);
  }

  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    margin-top:16px;cursor:pointer;transition:all .2s;
    box-shadow:var(--shadow-sm);
  }
  .toggle-row:hover{border-color:var(--line-2)}
  .toggle-row .label{font-size:13px;font-weight:700;color:var(--ink)}
  .toggle-row .desc{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
  .toggle-row .switch{
    width:42px;height:24px;border-radius:12px;
    background:var(--line-2);position:relative;
    transition:all .25s;flex-shrink:0;
  }
  .toggle-row .switch::after{
    content:"";position:absolute;top:3px;left:3px;
    width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
    transition:all .25s cubic-bezier(.2,.8,.2,1);
  }
  .toggle-row.on .switch{background:var(--green)}
  .toggle-row.on .switch::after{left:21px}

  .start-btn{
    width:100%;margin-top:22px;padding:17px;
    border-radius:16px;border:0;
    background:var(--ink);color:#fff;
    font-family:inherit;font-size:15.5px;font-weight:800;
    cursor:pointer;transition:all .22s cubic-bezier(.2,.8,.2,1);
    letter-spacing:-.1px;
    box-shadow:0 10px 28px -12px rgba(10,10,20,.45);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .start-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 36px -12px rgba(10,10,20,.5);
  }
  .start-btn:active{transform:translateY(0) scale(.99)}

  /* ============ SESSION ============ */
  .session{display:flex;flex-direction:column;gap:16px;
    animation:fadeUp .35s cubic-bezier(.2,.8,.2,1)}
  .session-top{display:flex;align-items:center;gap:10px}
  .session-tag{
    margin-left:auto;padding:6px 12px;border-radius:99px;
    font-size:10.5px;font-weight:800;letter-spacing:.5px;
    text-transform:uppercase;white-space:nowrap;
  }
  .session-tag.flash{background:var(--indigo-soft);color:var(--indigo)}
  .session-tag.quiz{background:var(--green-soft);color:var(--green)}
  .session-tag.type{background:var(--gold-soft);color:var(--amber)}
  .session-tag.exam{background:var(--red-soft);color:var(--red)}

  .progress{display:flex;flex-direction:column;gap:7px}
  .progress-meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11.5px;font-weight:700;color:var(--muted);
  }
  .progress-meta .q-count{font-variant-numeric:tabular-nums}
  .progress-meta .score{color:var(--green);font-weight:800}
  .progress-bar{
    height:5px;background:var(--bg-2);
    border-radius:99px;overflow:hidden;
  }
  .progress-bar > i{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--gold),var(--gold-2));
    transition:width .4s cubic-bezier(.2,.8,.2,1);
  }

  /* ============ Q CARD ============ */
  .q-card{
    background:var(--surface);
    border:1px solid var(--line);border-radius:22px;padding:22px 20px;
    box-shadow:var(--shadow-sm),0 8px 32px -16px rgba(10,10,20,.1);
  }
  .card-head{
    display:flex;align-items:center;gap:8px;margin-bottom:16px;
  }
  .card-badges{display:flex;gap:6px;flex-wrap:wrap}
  .card-actions{margin-left:auto;display:flex;gap:6px}
  .level-badge{
    padding:3px 10px;border-radius:6px;font-size:10px;font-weight:900;
    letter-spacing:.5px;
  }
  .level-badge.A1{background:var(--green-soft);color:var(--green)}
  .level-badge.A2{background:var(--blue-soft);color:var(--blue)}
  .level-badge.B1{background:var(--amber-soft);color:var(--amber)}
  .level-badge.B2{background:var(--red-soft);color:var(--red)}
  .status-badge{
    padding:3px 10px;border-radius:6px;font-size:9.5px;font-weight:800;
    letter-spacing:.5px;text-transform:uppercase;
  }
  .status-badge.new{background:var(--indigo-soft);color:var(--indigo)}
  .status-badge.learning{background:var(--amber-soft);color:var(--amber)}
  .status-badge.mastered{background:var(--green-soft);color:var(--green)}

  .speak-btn,.hint-btn{
    width:38px;height:38px;border-radius:50%;padding:0;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink-soft);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
    box-shadow:var(--shadow-sm);
  }
  .hint-btn{font-family:Georgia,serif;font-weight:900;font-size:15px}
  .speak-btn:hover{border-color:var(--ink);color:var(--ink);transform:scale(1.06)}
  .speak-btn:active{transform:scale(.94)}
  .speak-btn.speaking{
    background:var(--gold);border-color:var(--gold);color:#fff;
    animation:pulse 1s infinite;
  }
  .hint-btn:hover,.hint-btn.active{
    background:var(--amber-soft);border-color:var(--amber);color:var(--amber);
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(201,162,39,.4)}
    70%{box-shadow:0 0 0 12px rgba(201,162,39,0)}
    100%{box-shadow:0 0 0 0 rgba(201,162,39,0)}
  }

  /* ============ FLASHCARD ============ */
  .flash-scene{perspective:1600px;margin:4px 0 12px}
  .flashcard{
    position:relative;width:100%;height:240px;cursor:pointer;
    transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.4,.2,.2,1);
  }
  .flashcard.flipped{transform:rotateY(180deg)}
  .flash-face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:18px;padding:26px 22px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    text-align:center;overflow:hidden;
    border:1px solid var(--line);
  }
  .flash-front{
    background:linear-gradient(160deg,#ffffff,#faf8f4);
  }
  .flash-back{
    background:linear-gradient(160deg,#1a1a24,#0a0a14);
    transform:rotateY(180deg);
    border-color:rgba(255,255,255,.08);
    color:#faf8f4;
  }
  .flash-label{
    font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--muted);font-weight:800;
  }
  .flash-back .flash-label{color:rgba(255,255,255,.55)}
  .flash-main{
    font-size:clamp(26px,7vw,40px);font-weight:800;line-height:1.15;
    word-break:break-word;max-width:100%;letter-spacing:-.8px;
  }
  .flash-main.letter{font-size:clamp(72px,22vw,110px);letter-spacing:2px}
  .flash-sub{
    font-size:13.5px;color:var(--muted);font-weight:600;line-height:1.5;
    max-width:100%;
  }
  .flash-back .flash-sub{color:rgba(255,255,255,.65)}

  .flip-hint{
    font-size:11.5px;color:var(--muted);text-align:center;
    font-weight:600;margin-bottom:10px;
  }
  .flip-btn{
    width:100%;padding:13px;border-radius:13px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink);font-family:inherit;font-size:14px;font-weight:800;
    cursor:pointer;transition:all .2s;
    box-shadow:var(--shadow-sm);
  }
  .flip-btn:hover{border-color:var(--ink)}
  .flip-btn:active{transform:scale(.98)}

  /* ============ OPTIONS ============ */
  .options{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;align-items:center;gap:13px;
    padding:14px 16px;
    background:var(--surface);
    border:1.5px solid var(--line);border-radius:14px;
    color:var(--ink);font-family:inherit;font-size:14.5px;font-weight:600;
    text-align:left;cursor:pointer;
    transition:all .18s cubic-bezier(.2,.8,.2,1);
    animation:optIn .32s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .opt:nth-child(1){animation-delay:.03s}
  .opt:nth-child(2){animation-delay:.07s}
  .opt:nth-child(3){animation-delay:.11s}
  .opt:nth-child(4){animation-delay:.15s}
  @keyframes optIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  .opt:hover:not(:disabled){
    border-color:var(--ink);background:var(--bg-2);
    transform:translateX(2px);
  }
  .opt:disabled{cursor:default}
  .opt-letter{
    width:30px;height:30px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-2);color:var(--ink-soft);
    font-weight:800;font-size:13px;
    transition:all .18s;
  }
  .opt.correct{
    background:var(--green-soft);border-color:var(--green);
    animation:pop .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
  .opt.correct .opt-letter{background:var(--green);color:#fff}
  .opt.correct .opt-text{color:var(--green);font-weight:700}
  .opt.wrong{background:var(--red-soft);border-color:var(--red)}
  .opt.wrong .opt-letter{background:var(--red);color:#fff}
  .opt.wrong .opt-text{color:var(--red);font-weight:700}
  .opt.dimmed{opacity:.4}

  /* ============ QUESTION TEXT ============ */
  .q-text{
    font-size:clamp(16px,4.4vw,20px);font-weight:700;line-height:1.5;
    margin:0 0 18px;letter-spacing:-.3px;color:var(--ink);
  }
  .q-text b{color:var(--gold);font-weight:800}
  .q-text .blank{
    display:inline-block;min-width:52px;
    border-bottom:2px dashed var(--gold);color:var(--gold);
  }

  /* ============ HINT BOX ============ */
  .hint-box{
    margin:0 0 16px;padding:13px 15px;
    background:var(--amber-soft);border:1px solid #e8ce8a;

══════════════════════════════════════════════════════════ */
const ONES  = ['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
const TEENS = ['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS  = ['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];

function numToGerman(n){
  if (n === 0) return 'null';
  let r = '';
  if (n >= 1000) {
    const th = Math.floor(n/1000);
    r += (th === 1 ? 'ein' : ONES[th]) + 'tausend';
    n %= 1000;
    if (n === 0) return r;
  }
  if (n >= 100) {
    const h = Math.floor(n/100);
    r += (h === 1 ? 'ein' : ONES[h]) + 'hundert';
    n %= 100;
    if (n === 0) return r;
  }
  if (n >= 20) {
    const t = Math.floor(n/10), u = n%10;
    if (u === 0) r += TENS[t];
    else         r += ONES[u] + 'und' + TENS[t];
  } else if (n === 1) r += 'eins';
  else if (n >= 2 && n <= 9) r += ONES[n];
  else if (n >= 10 && n <= 19) r += TEENS[n-10];
  return r;
}

const VN_ONES = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function numToVietnamese(n){
  if (n === 1000) return 'một nghìn';
  if (n === 0) return 'không';
  if (n < 10) return VN_ONES[n];
  if (n < 20) { if (n===10) return 'mười'; if (n===15) return 'mười lăm'; return 'mười ' + VN_ONES[n-10]; }
  if (n < 100) {
    const t = Math.floor(n/10), u = n%10;
    if (u === 0) return VN_ONES[t] + ' mươi';
    if (u === 1) return VN_ONES[t] + ' mươi mốt';
    if (u === 5) return VN_ONES[t] + ' mươi lăm';
    return VN_ONES[t] + ' mươi ' + VN_ONES[u];
  }
  const h = Math.floor(n/100), rest = n%100;
  let out = VN_ONES[h] + ' trăm';
  if (rest === 0) return out;
  if (rest < 10) return out + ' lẻ ' + VN_ONES[rest];
  if (rest < 20) { if (rest===10) return out + ' mười'; if (rest===15) return out + ' mười lăm'; return out + ' mười ' + VN_ONES[rest-10]; }
  const t = Math.floor(rest/10), u = rest%10;
  if (u === 0) return out + ' ' + VN_ONES[t] + ' mươi';
  if (u === 1) return out + ' ' + VN_ONES[t] + ' mươi mốt';
  if (u === 5) return out + ' ' + VN_ONES[t] + ' mươi lăm';
  return out + ' ' + VN_ONES[t] + ' mươi ' + VN_ONES[u];
}

        arr.push({id:'n-'+n,type:'number',num:n,front:'Số '+n,back:numToGerman(n),speak:numToGerman(n),extra:numToVietnamese(n),band:'21-100'});
      });
      [101,110,111,123,150,200,300,400,500,600,700,800,900,999,1000].forEach(n=>{
        arr.push({id:'n-'+n,type:'number',num:n,front:'Số '+n,back:numToGerman(n),speak:numToGerman(n),extra:numToVietnamese(n),band:'101-1000'});
      });
      return arr;
    })(),
  },
  alphabet: {
    name:'Alphabet', sub:'Chữ cái', icon:'🔤',
    color:'#b91c1c', colorSoft:'#fee2e2',
    filters:null,
    items: ALPHABET_RAW.map(a=>({
      id:'a-'+a.l, type:'alphabet', letter:a.l,
      front:a.l, back:a.p, speak:a.l,
      extra:`${a.ex} — ${a.mean}`,
    })),
  },
  grammar: {
    name:'Grammatik', sub:'Ngữ pháp', icon:'📚',
    color:'#047857', colorSoft:'#d1fae5',
    filters:[{key:'A1',label:'A1'},{key:'A2',label:'A2'},{key:'B1',label:'B1'},{key:'B2',label:'B2'}],
    items: GRAMMAR_RAW.map((g,i)=>({
      id:'g-'+i, type:'grammar',
      sentence:g.q, opts:g.opts, correct:g.a,
      hint:g.hint, explain:g.ex, level:g.lv,
      front:g.q.replace('___','______'),
      back:g.opts[g.a],
      speak:g.q.replace('___',g.opts[g.a]).replace(/[.,!?]/g,''),
    })),
  },
};

══════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'deutsch-vanbac-progress-v1';
let PROGRESS = {};
try { PROGRESS = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ PROGRESS = {}; }
function saveProgress(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS)); } catch(e){} }
function getStatus(id){ return PROGRESS[id] || 'new'; }
function setStatus(id, s){ PROGRESS[id] = s; saveProgress(); }
function catStats(k){
  const items = CATS[k].items;
  const m = items.filter(it=>getStatus(it.id)==='mastered').length;
  return {mastered:m, total:items.length};
}

/* ══════════════════════════════════════════════════════════
   TTS
══════════════════════════════════════════════════════════ */
let deVoice = null;
function loadVoices(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  deVoice = vs.find(v=>/^de(-|_)/i.test(v.lang)) || vs.find(v=>/deutsch|german/i.test(v.name)) || null;
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, btn){
  if (!text) return;
  if (!('speechSynthesis' in window)) { alert('Trình duyệt không hỗ trợ phát âm.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='de-DE'; u.rate=0.85; u.pitch=1;
  if (deVoice) u.voice = deVoice;
  $$('.speak-btn').forEach(b=>b.classList.remove('speaking'));
  if (btn) btn.classList.add('speaking');
  u.onend = ()=>{ if(btn) btn.classList.remove('speaking'); };
  u.onerror = ()=>{ if(btn) btn.classList.remove('speaking'); };
  speechSynthesis.speak(u);
}

/* ══════════════════════════════════════════════════════════
   SESSION START
══════════════════════════════════════════════════════════ */
const SESSION_SIZE = 20;

function pickSessionItems(items, onlyUnlearned){
  let pool = items;
  if (onlyUnlearned) {
    pool = items.filter(it=>getStatus(it.id)!=='mastered');
    if (pool.length===0) pool = items;
  }
  const unlearned = pool.filter(it=>getStatus(it.id)!=='mastered');
  const mastered  = pool.filter(it=>getStatus(it.id)==='mastered');
  shuffle(unlearned); shuffle(mastered);
  const n = Math.min(SESSION_SIZE, pool.length);
  const out = [];
  for (const it of unlearned) { if (out.length>=n) break; out.push(it); }
  for (const it of mastered)  { if (out.length>=n) break; out.push(it); }
  return shuffle(out);
}

function startSession(){
  const {cat, filter, mode} = state.setup;
  const pool = getFilteredItems(cat, filter);
  const items = pickSessionItems(pool, state.setup.onlyUnlearned);
  if (items.length===0) { alert('Không có mục nào. Thử bỏ "Chỉ ôn chưa thuộc".'); return; }

  state.session = {
    cat, filter, mode, items, index:0, correct:0,
    answered:false, flipped:false, currentOpts:null, currentCorrect:null,
    typeMode:null, isExam:false, examData:null, examLevel:null,
  };
  state.view='session';
  renderQuestion();
}

function startReviewAll(){
  const all = [];
  for (const k of Object.keys(CATS)) {
    for (const it of CATS[k].items) {
      if (getStatus(it.id)!=='mastered') all.push({...it});
    }
  }
  if (all.length===0) { alert('Tuyệt vời! Bạn đã thuộc hết tất cả các mục.'); return; }
  shuffle(all);
  const items = all.slice(0, SESSION_SIZE);
  state.session = {
    cat:'__review', filter:null, mode:'flash', items, index:0, correct:0,
    answered:false, flipped:false, currentOpts:null, currentCorrect:null,
    typeMode:null, isExam:false, examData:null, examLevel:null,
  };
  state.view='session';
  renderQuestion();
}

function startExam(level){
  const exam = EXAMS[level];
  const questions = shuffle([...exam.questions]);
  state.session = {
    cat:'__exam', filter:level, mode:'exam', items:questions,
    index:0, correct:0,
    answered:false, flipped:false, currentOpts:null, currentCorrect:null,
    typeMode:null, isExam:true, examData:exam, examLevel:level,
  };
  state.view='session';
  renderExamQuestion();
}

  const status = getStatus(item.id);

            ${level?`<span class="level-badge ${level}">${level}</span>`:''}

          </div>
          <div class="card-actions">
            ${item.type==='grammar'?`<button class="hint-btn" id="hintBtn" title="Cách làm">?</button>`:''}
            <button class="speak-btn" id="speakBtn" title="Nghe tiếng Đức">🔊</button>
          </div>
        </div>
        <div id="hintArea"></div>
        ${bodyHtml}
        <div id="fbArea"></div>
        <div class="mark-row" id="markRow">
          <button class="mark-btn unlearn" id="markUnlearn">😕 Chưa thuộc</button>
          <button class="mark-btn learn" id="markLearn">✅ Thuộc rồi</button>

      else {
        area.innerHTML = `<div class="hint-box"><span class="label">💡 Cách làm</span>${esc(item.hint)}</div>`;
        hintBtnEl.classList.add('active');

  if (s.mode==='flash') wireFlash(item);
  else if (s.mode==='quiz') wireQuiz(item);

function wireFlash(item){

function buildQuiz(item){
  let questionText, correctAnswer, pool, speakText;
  if (item.type==='vocab') {
    if (Math.random()<0.5) {
      questionText = `Từ <b>"${esc(item.front)}"</b> có nghĩa là gì?`;
      correctAnswer = item.back;
      pool = CATS.vocab.items.filter(x=>x.id!==item.id).map(x=>x.back);
      speakText = item.front;
    } else {
      questionText = `<b>"${esc(item.back)}"</b> trong tiếng Đức là?`;
      correctAnswer = item.front;
      pool = CATS.vocab.items.filter(x=>x.id!==item.id).map(x=>x.front);
      speakText = item.front;
    }
  } else if (item.type==='number') {
    if (Math.random()<0.5) {
      questionText = `Số <b>${item.num}</b> trong tiếng Đức là?`;
      correctAnswer = item.back;
      pool = buildNumberDistractors(item.num);
      speakText = item.back;
    } else {
      questionText = `Từ <b>"${esc(item.back)}"</b> là số nào?`;
      correctAnswer = String(item.num);
      pool = buildNumberDistractorsNum(item.num);
      speakText = item.back;
    }
  } else if (item.type==='alphabet') {
    const others = CATS.alphabet.items.filter(x=>x.id!==item.id);
    if (Math.random()<0.5) {
      questionText = `Chữ <b style="font-size:1.2em">${esc(item.letter)}</b> đọc là gì?`;
      correctAnswer = item.back;
      pool = others.map(x=>x.back);
      speakText = item.letter;
    } else {
      questionText = `Cách đọc <b>"${esc(item.back)}"</b> là chữ cái nào?`;
      correctAnswer = item.letter;
      pool = others.map(x=>x.letter);
      speakText = item.letter;
    }
  } else {
    questionText = item.sentence.replace('___','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    correctAnswer = item.opts[item.correct];
    pool = item.opts.filter((_,i)=>i!==item.correct);
    speakText = item.speak;
  }
  const opts = makeOpts(correctAnswer, pool, 4);
  return {questionText, options:opts, correctIndex:opts.indexOf(String(correctAnswer)), speakText};
}

function buildNumberDistractors(n){
  const set = new Set([numToGerman(n)]);
  const cands = [];
  for (const o of [-1,1,-2,2,-10,10,-20,20]) { const c=n+o; if (c>=0&&c<=1000) cands.push(numToGerman(c)); }
  for (let i=0;i<25;i++) cands.push(numToGerman(rand(0,1000)));
  shuffle(cands);
  for (const c of cands) { if (set.size>=4) break; set.add(c); }
  return [...set];
}
function buildNumberDistractorsNum(n){
  const set = new Set([String(n)]);
  const cands = [];
  for (const o of [-1,1,-2,2,-10,10,-20,20]) { const c=n+o; if (c>=0&&c<=1000) cands.push(String(c)); }
  for (let i=0;i<25;i++) cands.push(String(rand(0,1000)));
  shuffle(cands);
  for (const c of cands) { if (set.size>=4) break; set.add(c); }
  return [...set];
}
function makeOpts(correct, pool, n=4){
  const set = new Set([String(correct)]);
  for (const p of shuffle([...pool])) { if (set.size>=n) break; set.add(String(p)); }
  return shuffle([...set]);
}

function renderQuizBody(item, q){
  const LETTERS = ['A','B','C','D'];
  const optsHtml = q.options.map((o,i)=>`
    <button class="opt" data-idx="${i}">
      <span class="opt-letter">${LETTERS[i]}</span>
      <span class="opt-text">${esc(o)}</span>
    </button>
  `).join('');
  return `<div class="q-text">${q.questionText}</div><div class="options" id="opts">${optsHtml}</div>`;
}

function wireQuiz(item){
  const s = state.session;
  $$('#opts .opt').forEach((btn,i)=>{
    btn.addEventListener('click', ()=>{
      if (s.answered) return;
      s.answered = true;
      const correctIdx = s.currentCorrect;
      const isCorrect = i===correctIdx;
      if (isCorrect) s.correct++;
      $$('#opts .opt').forEach((b,j)=>{
        b.disabled = true;
        if (j===correctIdx) b.classList.add('correct');
        else if (j===i) b.classList.add('wrong');
        else b.classList.add('dimmed');
      });
      const fb = $('#fbArea');
      const LETTERS = ['A','B','C','D'];
      let extra = '';
      if (item.type==='grammar' && item.explain) extra = `<small>${esc(item.explain)}</small>`;
      else if (item.type==='alphabet') extra = `<small>${esc(item.extra||'')}</small>`;
      else if (item.type==='number') extra = `<small>${item.num} = ${esc(item.back)} · ${esc(item.extra||'')}</small>`;
      else if (item.type==='vocab') extra = `<small>${esc(item.front)} = ${esc(item.back)}</small>`;
      if (isCorrect) fb.innerHTML = `<div class="fb correct">✅ Chính xác!${extra}</div>`;
      else fb.innerHTML = `<div class="fb wrong">❌ Sai! Đáp án: <b>${LETTERS[correctIdx]}</b> — <b>${esc(s.currentOpts[correctIdx])}</b>${extra}</div>`;
      $('#markRow').classList.add('show');
      if (isCorrect) $('#markLearn').classList.add('suggested');
      else $('#markUnlearn').classList.add('suggested');
      $('.progress-meta .score').textContent = `✓ ${s.correct}`;
      if (state.autoSpeak) speak(item.speak, $('#speakBtn'));
    });
  });
}

function renderTypeBody(item){
  let questionText, placeholder, inputMode;
  if (item.type==='vocab') {
    if (Math.random()<0.5) {
      questionText = `Viết từ tiếng Đức cho: <b>"${esc(item.back)}"</b>`;
      placeholder = 'VD: der Apfel…'; inputMode='de';
    } else {
      questionText = `Nghĩa tiếng Việt của: <b>"${esc(item.front)}"</b>`;
      placeholder = 'Nhập nghĩa tiếng Việt…'; inputMode='vi';
    }
  } else if (item.type==='number') {
    if (Math.random()<0.5) {
      questionText = `Viết số <b>${item.num}</b> bằng tiếng Đức`;
      placeholder = 'VD: eins, zwei…'; inputMode='de';
    } else {
      questionText = `Số <b>"${esc(item.back)}"</b> là số nào?`;
      placeholder = 'Nhập số…'; inputMode='number';
    }
  } else if (item.type==='alphabet') {
    questionText = `Chữ <b style="font-size:1.2em">${esc(item.letter)}</b> đọc là gì?`;
    placeholder = 'VD: ah, beh, tseh…'; inputMode='de';
  } else {
    questionText = item.sentence.replace('___','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    placeholder = 'Điền từ còn thiếu…'; inputMode='de';
  }
  state.session.typeMode = inputMode;
  return `
    <div class="q-text">${questionText}</div>
    <input type="text" id="typeInput" class="type-input" placeholder="${placeholder}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="check-btn" id="checkBtn">✓ Kiểm tra</button>
  `;
}

function normalize(s){
  return String(s).toLowerCase().trim()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[.,!?;]/g,'').replace(/\s+/g,' ');
}

function wireType(item){
  const s = state.session;
  const input = $('#typeInput');
  const check = ()=>{
    if (s.answered) return;
    const val = input.value.trim();
    if (!val) { input.focus(); return; }
    s.answered = true; input.disabled = true;
    let correctAnswer, isCorrect;
    const mode = s.typeMode;
    if (item.type==='vocab') {
      correctAnswer = mode==='de' ? item.front : item.back;
      if (mode==='de') {
        const norm = normalize(val), full = normalize(correctAnswer);
        const noArt = full.replace(/^(der|die|das)\s+/,'');
        isCorrect = norm===full || norm===noArt;
      } else isCorrect = normalize(val)===normalize(correctAnswer);
    } else if (item.type==='number') {
      if (mode==='de') {
        correctAnswer = item.back;
        isCorrect = normalize(val)===normalize(correctAnswer);
      } else {
        correctAnswer = String(item.num);
        isCorrect = val.replace(/\D/g,'')===correctAnswer;
      }
    } else if (item.type==='alphabet') {
      correctAnswer = item.back;
      isCorrect = normalize(val)===normalize(correctAnswer);
    } else {
      correctAnswer = item.opts[item.correct];
      isCorrect = normalize(val)===normalize(correctAnswer);
    }
    if (isCorrect) s.correct++;
    input.classList.add(isCorrect?'correct':'wrong');
    const fb = $('#fbArea');
    let extra = '';
    if (item.type==='grammar' && item.explain) extra = `<small>${esc(item.explain)}</small>`;
    else if (item.type==='alphabet') extra = `<small>${esc(item.extra||'')}</small>`;
    else if (item.type==='number') extra = `<small>${item.num} = ${esc(item.back)} · ${esc(item.extra||'')}</small>`;
    else if (item.type==='vocab') extra = `<small>${esc(item.front)} = ${esc(item.back)}</small>`;
    if (isCorrect) fb.innerHTML = `<div class="fb correct">✅ Chính xác!${extra}</div>`;
    else fb.innerHTML = `<div class="fb wrong">❌ Chưa đúng! Đáp án: <b>${esc(correctAnswer)}</b>${extra}</div>`;
    $('#checkBtn').style.display = 'none';
    $('#markRow').classList.add('show');
    if (isCorrect) $('#markLearn').classList.add('suggested');
    else $('#markUnlearn').classList.add('suggested');
    $('.progress-meta .score').textContent = `✓ ${s.correct}`;
    if (state.autoSpeak) speak(item.speak, $('#speakBtn'));
  };
  input.addEventListener('keydown', e=>{ if (e.key==='Enter') { e.preventDefault(); check(); } });
  $('#checkBtn').addEventListener('click', check);
}

function markItem(item, learned){
  setStatus(item.id, learned?'mastered':'learning');
  state.session.index++;
  if (state.session.index >= state.session.items.length) renderSummary();
  else renderQuestion();
}

/* ══════════════════════════════════════════════════════════
   EXAM RENDER
══════════════════════════════════════════════════════════ */
function renderExamQuestion(){
  const s = state.session;
  if (s.index >= s.items.length) return renderSummary();

  const q = s.items[s.index];
  const exam = s.examData;
  s.answered = false;

  const LETTERS = ['a','b','c'];
  let passageHtml = '';
  if (exam.sharedText) {
    let text = exam.sharedText;
    const curBlank = q.blankNum;
    text = text.replace(/\((\d+)\)/g, (m,num)=>{
      const isHL = parseInt(num) === curBlank;
      return `<span class="blank-num${isHL?' hl':''}">(${num})</span>`;
    });
    passageHtml = `<div class="exam-passage">${text}</div>`;
  } else if (q.passage) {
    passageHtml = `<div class="exam-passage">${esc(q.passage)}</div>`;
  }

  document.title = `${exam.name} · ${s.index+1}/${s.items.length}`;

  app.innerHTML = `
    <div class="session">
      <div class="session-top">
        <button class="back-btn" id="backBtn">← Thoát</button>
        <span class="session-tag exam">${exam.name}</span>
      </div>

      <div class="exam-banner">
        <div class="exam-banner-title">${exam.subtitle}</div>
        <div class="exam-banner-sub">📖 ${exam.section} · ⏱ ${exam.duration} · ${s.items.length} Aufgaben</div>
      </div>

      <div class="progress">
        <div class="progress-meta">
          <span class="q-count">Aufgabe ${s.index+1} / ${s.items.length}</span>
          <span class="score">✓ ${s.correct} richtig</span>
        </div>
        <div class="progress-bar"><i style="width:${(s.index/s.items.length)*100}%"></i></div>
      </div>

      <div class="q-card">
        <div class="exam-instr">${esc(exam.instructions)}</div>
        ${passageHtml}
        <div class="exam-q-num">Aufgabe ${s.index+1}</div>
        <div class="exam-q-text">${esc(q.q)}</div>
        <div class="options" id="opts"></div>
        <div id="fbArea"></div>
      </div>
    </div>
  `;

  const optsEl = $('#opts');
  q.opts.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-letter">${LETTERS[i]}</span><span class="opt-text">${esc(opt)}</span>`;
    btn.addEventListener('click', ()=>answerExam(i));
    optsEl.appendChild(btn);
  });

  $('#backBtn').addEventListener('click', confirmExit);
}

function answerExam(idx){
  const s = state.session;
  if (s.answered) return;
  s.answered = true;

  const q = s.items[s.index];
  const isCorrect = idx === q.a;
  if (isCorrect) s.correct++;

  const LETTERS = ['a','b','c'];
  const opts = $$('#opts .opt');
  opts.forEach((b,i)=>{
    b.disabled = true;
    if (i===q.a) b.classList.add('correct');
    else if (i===idx) b.classList.add('wrong');
    else b.classList.add('dimmed');
  });

  const fb = $('#fbArea');
  if (isCorrect) {
    fb.innerHTML = `<div class="fb correct">✅ Richtig!<small>${esc(q.explain||'')}</small></div>`;
  } else {
    fb.innerHTML = `<div class="fb wrong">❌ Falsch! Richtige Antwort: <b>${LETTERS[q.a]})</b> <b>${esc(q.opts[q.a])}</b><small>${esc(q.explain||'')}</small></div>`;
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn-next';
  nextBtn.textContent = s.index === s.items.length-1 ? 'Ergebnis ansehen →' : 'Weiter →';
  nextBtn.addEventListener('click', ()=>{
    s.index++;
    if (s.index >= s.items.length) renderSummary();
    else renderExamQuestion();
  });
  fb.appendChild(nextBtn);

  $('.progress-meta .score').textContent = `✓ ${s.correct} richtig`;
}

/* ══════════════════════════════════════════════════════════
   SUMMARY
══════════════════════════════════════════════════════════ */
function renderSummary(){
  const s = state.session;
  const total = s.items.length;
  const correct = s.correct;
  const pct = total>0 ? Math.round(correct/total*100) : 0;
  const isExam = s.isExam;

  let emoji='🎉', title='Hoàn thành!', sub='Bạn đã hoàn thành phiên học';
  if (pct===100) {emoji='🏆'; title='Tuyệt vời!'; sub='Bạn trả lời đúng tất cả!';}
  else if (pct>=80) {emoji='🌟'; title='Rất tốt!'; sub='Bạn nắm bài rất chắc';}
  else if (pct>=50) {emoji='👍'; title='Khá tốt!'; sub='Tiếp tục luyện tập nhé';}
  else {emoji='💪'; title='Cố gắng lên!'; sub='Ôn lại và thử lần nữa';}

  let statsHtml = '';
  if (isExam) {
    statsHtml = `
      <div class="sum-stat green"><div class="lbl">Đúng</div><div class="val">${correct}/${total}</div></div>
      <div class="sum-stat gold"><div class="lbl">Tỉ lệ</div><div class="val">${pct}%</div></div>
      <div class="sum-stat amber"><div class="lbl">Cấp</div><div class="val">${s.examLevel}</div></div>
    `;
  } else {
    let masteredCount = 0, learningCount = 0;
    for (const it of s.items) {
      const st = getStatus(it.id);
      if (st==='mastered') masteredCount++;
      else if (st==='learning') learningCount++;
    }
    statsHtml = `
      <div class="sum-stat green"><div class="lbl">Đúng</div><div class="val">${correct}/${total}</div></div>
      <div class="sum-stat amber"><div class="lbl">Chưa thuộc</div><div class="val">${learningCount}</div></div>
      <div class="sum-stat gold"><div class="lbl">Đã thuộc</div><div class="val">${masteredCount}</div></div>
    `;
  }

  document.title = 'Kết quả · Học Tiếng Đức';

  app.innerHTML = `
    <div class="session">
      <div class="session-top"><button class="back-btn" id="homeBtn">← Trang chủ</button></div>
      <div class="summary">
        <div class="sum-emoji">${emoji}</div>
        <h2 class="sum-title">${title}</h2>
        <p class="sum-sub">${isExam ? EXAMS[s.examLevel].name + ' · ' : ''}${sub}</p>
        <div class="sum-stats">${statsHtml}</div>
        <div class="sum-actions">
          <button class="home-btn" id="backHomeBtn">🏠 Trang chủ</button>
          <button class="again-btn" id="againBtn">🔄 ${isExam?'Làm lại':'Ôn tiếp'}</button>
        </div>
      </div>
    </div>
  `;

  $('#homeBtn').addEventListener('click', renderHome);
  $('#backHomeBtn').addEventListener('click', renderHome);
  $('#againBtn').addEventListener('click', ()=>{
    if (isExam) startExam(s.examLevel);
    else if (s.cat==='__review') startReviewAll();
    else {
      state.setup = {cat:s.cat, filter:s.filter, mode:s.mode, onlyUnlearned:true};
      startSession();
    }
  });
}

function confirmExit(){
  if (state.session.index>0 && state.session.index<state.session.items.length) {
    if (!confirm('Thoát phiên học? Tiến độ đã đánh dấu vẫn được lưu.')) return;
  }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  renderHome();
}

/* ══════════════════════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e=>{
  if (state.view!=='session') return;
  const tag = (e.target.tagName||'').toLowerCase();
  if (tag==='input' || tag==='textarea') return;

  const s = state.session;
  if (s.index >= s.items.length) return;

  if (s.isExam) {
    if (!s.answered) {
      const idx = {'Digit1':0,'Digit2':1,'Digit3':2,'Numpad1':0,'Numpad2':1,'Numpad3':2}[e.code];
      if (idx !== undefined) { e.preventDefault(); $$('#opts .opt')[idx]?.click(); }
    } else if (e.code==='Enter' || e.code==='Space') {
      e.preventDefault();
      $('#fbArea button')?.click();
    }
    return;
  }

  if (s.mode==='flash') {
    if (e.code==='Space' && !s.flipped) { e.preventDefault(); $('#flipBtn')?.click(); }
  } else if (s.mode==='quiz') {
    if (!s.answered) {
      const idx = {'Digit1':0,'Digit2':1,'Digit3':2,'Digit4':3,'Numpad1':0,'Numpad2':1,'Numpad3':2,'Numpad4':3}[e.code];
      if (idx !== undefined) { e.preventDefault(); $$('#opts .opt')[idx]?.click(); }
    }
  }

  if (s.answered || s.flipped) {
    if (e.code==='Enter') { e.preventDefault(); $('#markLearn')?.click(); }
    if (e.code==='Backspace') { e.preventDefault(); $('#markUnlearn')?.click(); }
  }
});

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
renderHome();
</script>
</body>
