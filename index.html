function formatChatTime(ts){
  if (!ts) return '';
  const d = new Date(ts);
  const now2 = new Date();
  const isToday = d.toDateString() === now2.toDateString();
  if (isToday) return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  const yest = new Date(now2.getTime() - 86400000);
  if (d.toDateString() === yest.toDateString()) return 'Hôm qua';
  return d.getDate() + '/' + (d.getMonth()+1);
}
function openChat(username){
  if (!isLoggedIn()) return requireAuth('chat');
  state.chatWith = username;
  markMessagesRead(STORE.current, username);
  state.view = 'chatRoom';
  Sound.play('click');
  render();
}
function renderChatRoom(){
  if (!isLoggedIn()) { requireAuth('chat'); return; }
  const u = STORE.current;
  const f = STORE.users[state.chatWith];
  if (!f) { state.view = 'chat'; render(); return; }
  document.title = `${f.display || f.username} · Chat`;
  const msgs = getMessages(u, f.username);
  const isOnline = f.lastLoginDate === todayStr();
  const mutual = getMutualStreak(u, f.username);

  const msgHtml = msgs.length === 0
    ? `<div class="empty-state" style="padding:32px 20px">
        <div class="e-icon">👋</div>
        <div class="e-title">Bắt đầu trò chuyện</div>
        <div class="e-text">Gửi tin nhắn đầu tiên cho ${esc(f.display || f.username)}!</div>
      </div>`
    : msgs.map(m => {
        const isMine = m.from === u;
        const time = new Date(m.ts).toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
        return `<div class="msg ${isMine ? 'from-me' : 'from-them'}">
          ${esc(m.text)}
          <span class="msg-time">${time}</span>
        </div>`;
      }).join('');

  app.innerHTML = `
    <div class="chat-room">
      <div class="chat-room-header">
        <button class="back-btn" onclick="state.view='chat';render()">←</button>
        ${avatarSmall(f, 40, true)}
        <div style="flex:1">
          <div class="friend-name">${esc(f.display || f.username)}</div>
          <div class="online-info">
            ${isOnline ? '🟢 Đang online' : '⚪ ' + (f.lastLoginDate ? 'Hoạt động ' + formatChatTime(new Date(f.lastLoginDate).getTime()) : 'Chưa hoạt động')}
            ${mutual.streak > 0 ? ` · 🔥 ${mutual.streak} ngày` : ''}
          </div>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">${msgHtml}</div>
      <div class="chat-input-bar">
        <input type="text" id="chatInput" placeholder="Nhập tin nhắn…" autocomplete="off">
        <button class="chat-send" id="chatSend">➤</button>
      </div>
    </div>
  `;
  setTimeout(() => { const el = $('#chatMessages'); if (el) el.scrollTop = el.scrollHeight; }, 50);
  const input = $('#chatInput');
  const send = () => {
    const text = input.value.trim();
    if (!text) return;
    sendMessage(u, f.username, text);
    input.value = '';
    Sound.play('msg');
    renderChatRoom();
  };
  $('#chatSend').addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
  setTimeout(() => input.focus(), 100);
  markMessagesRead(u, f.username);
  updateNavBadges();
}

function renderProfile(){
  document.title = 'Tôi · Học Tiếng Đức';
  const u = getCurrentUser();
  const isGuest = !!u.isGuest;
  const friends = isGuest ? [] : getFriends(u.username);
  const totalMastered = Object.keys(CATS).reduce((sum, k) => sum + catStats(k).mastered, 0);

  const today = new Date();
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - today.getDay() + 1);
  const dowLabels = ['T2','T3','T4','T5','T6','T7','CN'];
  let calHtml = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    const dStr = d.toISOString().split('T')[0];
    const isToday = dStr === todayStr();
    const isPast = d < today && !isToday;
    const checked = isPast || isToday ? (i < (u.streak || 0)) : false;
    calHtml += `<div class="cal-day ${isToday?'today':''} ${checked?'checked':''}">
      <span class="dow">${dowLabels[i]}</span>
      <span class="num">${d.getDate()}</span>
    </div>`;
  }

  const joinDate = new Date(u.createdAt).toLocaleDateString('vi-VN', {year:'numeric', month:'long', day:'numeric'});

  const guestBanner = isGuest ? `
    <div style="padding:20px 18px;background:linear-gradient(135deg,var(--red-soft),var(--amber-soft));border:1px solid rgba(200,30,30,.25);border-radius:20px;text-align:center">
      <div style="font-size:42px;margin-bottom:10px">🔐</div>
      <div style="font-size:15px;font-weight:900;color:var(--ink);margin-bottom:6px">Chế độ khách</div>
      <div style="font-size:12.5px;color:var(--ink-soft);font-weight:700;margin-bottom:16px;line-height:1.55">
        Đăng nhập để <b>kết bạn</b>, <b>nhắn tin</b>, giữ <b>chuỗi hàng ngày</b> cùng bạn bè<br>và lưu tiến độ vĩnh viễn
      </div>
      <button onclick="state.view='auth';state.authIntent='profile';render()" style="padding:13px 28px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;font-family:inherit;font-size:13px;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 6px 20px -8px rgba(200,30,30,.6)">
        Đăng nhập / Đăng ký
      </button>
    </div>
  ` : '';

  app.innerHTML = `
    ${guestBanner}
    <div class="profile-hero">
      <div class="profile-avatar" style="background:${avatarColor(u.username)}">
        ${isGuest ? '👤' : esc((u.display||u.username).charAt(0).toUpperCase())}
      </div>
      <div class="profile-name">${esc(u.display || u.username)}</div>
      ${isGuest ? `<div class="profile-username">Chế độ khách</div>` : `<div class="profile-username">@${esc(u.username)}</div>`}
      <div class="profile-joined">Thành viên từ ${joinDate}</div>
      <div class="profile-stats">
        <div class="profile-stat fire"><div class="v">🔥 ${u.streak || 0}</div><div class="l">Chuỗi</div></div>
        <div class="profile-stat level"><div class="v">${u.level || 1}</div><div class="l">Level</div></div>
        <div class="profile-stat"><div class="v">${u.totalXP || 0}</div><div class="l">XP</div></div>
      </div>
    </div>

    <div class="streak-calendar">
      <div class="streak-cal-header">
        <div class="streak-cal-title">Chuỗi tuần này</div>
        <div class="streak-cal-count">🔥 ${u.streak || 0} ngày</div>
      </div>
      <div class="cal-grid">${calHtml}</div>
    </div>

    <div class="section-head"><span class="section-label">Thống kê học tập</span></div>
    <div class="profile-stats" style="margin-top:0">
      <div class="profile-stat"><div class="v">${totalMastered}</div><div class="l">Đã thuộc</div></div>
      <div class="profile-stat"><div class="v">${friends.length}</div><div class="l">Bạn bè</div></div>
      <div class="profile-stat"><div class="v">${u.totalCorrect || 0}</div><div class="l">Câu đúng</div></div>
    </div>

    <div class="section-head"><span class="section-label">Cài đặt</span></div>
    <div class="settings-list">
      <button class="settings-item" onclick="openDrawer()">
        <span class="s-icon">⚙️</span>
        <span class="s-label">Cài đặt giao diện</span>
        <span class="s-value">${state.settings.theme === 'light' ? 'Sáng' : state.settings.theme === 'dark' ? 'Tối' : state.settings.theme === 'german' ? 'Đức' : 'Neon'}</span>
      </button>
      ${!isGuest ? `
        <button class="settings-item danger" onclick="logout()">
          <span class="s-icon">🚪</span>
          <span class="s-label">Đăng xuất</span>
        </button>
      ` : ''}
    </div>
  `;
}

$$('.nav-btn').forEach(b => b.addEventListener('click', () => goTo(b.dataset.view)));

/* ══════════════════════════════════════════════════════════
   SETTINGS DRAWER
══════════════════════════════════════════════════════════ */
function renderDrawer(){
  $('#drawer').innerHTML = `
    <div class="drawer-head">
      <div class="drawer-title">⚙️ Cài đặt</div>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="setting-group">
      <div class="setting-label">Giao diện</div>
      <div class="theme-grid">
        <button class="theme-btn ${state.settings.theme==='light'?'active':''}" data-theme="light" data-label="Sáng">
          <div class="theme-preview"><span style="background:#faf8f4"></span><span style="background:#fff"></span><span style="background:#c81e1e"></span></div>
        </button>
        <button class="theme-btn ${state.settings.theme==='dark'?'active':''}" data-theme="dark" data-label="Tối">
          <div class="theme-preview"><span style="background:#0a0a14"></span><span style="background:#1a1a26"></span><span style="background:#ff4040"></span></div>
        </button>
        <button class="theme-btn ${state.settings.theme==='german'?'active':''}" data-theme="german" data-label="Đức">
          <div class="theme-preview"><span style="background:#000"></span><span style="background:#141414"></span><span style="background:#dd0000"></span></div>
        </button>
        <button class="theme-btn ${state.settings.theme==='neon'?'active':''}" data-theme="neon" data-label="Neon">
          <div class="theme-preview"><span style="background:#0a0014"></span><span style="background:#1a0a2a"></span><span style="background:#ff2a9a"></span></div>
        </button>
      </div>
    </div>
    <div class="setting-group">
      <div class="setting-label">Âm thanh & Hiệu ứng</div>
      <div class="setting-toggle ${state.settings.sound?'on':''}" data-toggle="sound">
        <div><div class="t-name">🔊 Âm thanh</div><div class="t-desc">Click, đúng/sai, level up</div></div>
        <div class="t-switch"></div>
      </div>
      <div class="setting-toggle ${state.settings.confetti?'on':''}" data-toggle="confetti">
        <div><div class="t-name">🎉 Pháo giấy</div><div class="t-desc">Hiệu ứng ăn mừng</div></div>
        <div class="t-switch"></div>
      </div>
    </div>
    <div class="setting-group">
      <div class="setting-label">Phát âm</div>
      <div class="setting-toggle ${TTS.useGoogle?'on':''}" data-toggle-tts>
        <div><div class="t-name">🌍 Giọng native</div><div class="t-desc">Google Translate TTS</div></div>
        <div class="t-switch"></div>
      </div>
    </div>
  `;
  $('#drawerClose').addEventListener('click', closeDrawer);
  $$('.theme-btn').forEach(b => b.addEventListener('click', () => {
    state.settings.theme = b.dataset.theme;
    document.body.dataset.theme = b.dataset.theme;
    $$('.theme-btn').forEach(x => x.classList.toggle('active', x.dataset.theme === b.dataset.theme));
    Sound.play('click');
  }));
  $$('.setting-toggle[data-toggle]').forEach(t => t.addEventListener('click', () => {
    const k = t.dataset.toggle;
    state.settings[k] = !state.settings[k];
    t.classList.toggle('on', state.settings[k]);
    if (k === 'sound') Sound.enabled = state.settings.sound;
    if (k === 'confetti') Confetti.enabled = state.settings.confetti;
    if (state.settings.sound) Sound.play('click');
  }));
  const ttsT = $('.setting-toggle[data-toggle-tts]');
  if (ttsT) ttsT.addEventListener('click', () => {
    TTS.useGoogle = !TTS.useGoogle;
    ttsT.classList.toggle('on', TTS.useGoogle);
    showToast(TTS.useGoogle ? '🌍 Giọng native' : '🎤 Giọng trình duyệt');
    Sound.play('click');
  });
}
function openDrawer(){ renderDrawer(); $('#drawer').classList.add('show'); $('#drawerBackdrop').classList.add('show'); }
function closeDrawer(){ $('#drawer').classList.remove('show'); $('#drawerBackdrop').classList.remove('show'); }
$('#drawerBackdrop').addEventListener('click', closeDrawer);

/* ══════════════════════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (state.view !== 'session') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  const s = state.session;
  if (s.index >= s.items.length) return;
  if (s.mode === 'flash') {
    if (e.code === 'Space' && !s.flipped) { e.preventDefault(); $('#flipBtn')?.click(); }
  } else if (s.mode === 'quiz') {
    if (!s.answered) {
      const idx = {'Digit1':0,'Digit2':1,'Digit3':2,'Digit4':3,'Numpad1':0,'Numpad2':1,'Numpad3':2,'Numpad4':3}[e.code];
      if (idx !== undefined) { e.preventDefault(); $$('#opts .opt')[idx]?.click(); }
    }
  }
  if (s.answered || s.flipped) {
    if (e.code === 'Enter') { e.preventDefault(); $('#markLearn')?.click(); }
    if (e.code === 'Backspace') { e.preventDefault(); $('#markUnlearn')?.click(); }
  }
});

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
loadStore();
ensureGuest();

if (STORE.settings.theme) state.settings.theme = STORE.settings.theme;
if (typeof STORE.settings.sound === 'boolean') state.settings.sound = STORE.settings.sound;
if (typeof STORE.settings.confetti === 'boolean') state.settings.confetti = STORE.settings.confetti;

document.body.dataset.theme = state.settings.theme;
Sound.enabled = state.settings.sound;
Confetti.enabled = state.settings.confetti;

const _origSaveStore = saveStore;
saveStore = function(){
  STORE.settings = state.settings;
  _origSaveStore();
};

const curU = getCurrentUser();
const info = updateDailyStreak(curU);
saveStore();

state.view = 'home';
render();

if (info.changed && info.streak >= 2) {
  setTimeout(() => showStreakModal(info.streak), 600);
}
</script>
