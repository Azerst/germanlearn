<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Tiếng Đức · VANBAC</title>
<style>
  @font-face{font-family:"GFF";src:url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");font-weight:400 900;font-display:swap}
  :root{--shadow-sm:0 1px 3px rgba(10,10,20,.06);--shadow-md:0 12px 32px -16px rgba(10,10,20,.15);--shadow-lg:0 20px 48px -20px rgba(10,10,20,.22);--serif:'Times New Roman',Georgia,serif;--gff:"GFF","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  body[data-theme="light"]{--bg:#faf8f4;--bg-2:#f5f2ec;--surface:#fff;--line:#e8e3d9;--line-2:#d0c9ba;--ink:#0a0a14;--ink-soft:#3a3a4a;--muted:#8a8a95;--red:#c81e1e;--red-deep:#8b0000;--red-soft:#fce8e8;--green:#0a7a4a;--green-soft:#ddf5ea;--amber:#92500a;--amber-soft:#fdf0d5;--indigo:#3d3dc9;--indigo-soft:#e5e5ff;--gold:#c9a227;--gold-soft:#faf0d0;--blue:#1d4ed8;--blue-soft:#e0e8ff}
  body[data-theme="dark"]{--bg:#0a0a14;--bg-2:#14141f;--surface:#1a1a26;--line:#2a2a3a;--line-2:#3a3a4a;--ink:#faf8f4;--ink-soft:#d0d0dc;--muted:#7a7a8a;--red:#ff4040;--red-deep:#cc2020;--red-soft:#2a1010;--green:#3fd68f;--green-soft:#0a2a1f;--amber:#ffb84d;--amber-soft:#2a1e0a;--indigo:#7a7aff;--indigo-soft:#1a1a3a;--gold:#ffce00;--gold-soft:#2a2000;--blue:#4d9aff;--blue-soft:#0a1a3a}
  body[data-theme="german"]{--bg:#000;--bg-2:#0a0a0a;--surface:#141414;--line:#2a2a2a;--line-2:#3a3a3a;--ink:#fff;--ink-soft:#e0e0e0;--muted:#888;--red:#dd0000;--red-deep:#aa0000;--red-soft:#2a0000;--green:#ffce00;--green-soft:#2a2000;--amber:#ffce00;--amber-soft:#2a2000;--indigo:#dd0000;--indigo-soft:#2a0000;--gold:#ffce00;--gold-soft:#2a2000;--blue:#dd0000;--blue-soft:#2a0000}
  body[data-theme="neon"]{--bg:#0a0014;--bg-2:#140020;--surface:#1a0a2a;--line:#3a1a5a;--line-2:#5a2a8a;--ink:#f0e0ff;--ink-soft:#d0b0ff;--muted:#8a6aa8;--red:#ff2a9a;--red-deep:#cc0077;--red-soft:#2a0020;--green:#00e0a0;--green-soft:#002a1f;--amber:#ffaa00;--amber-soft:#2a1a00;--indigo:#9966ff;--indigo-soft:#1a0a3a;--gold:#ff2a9a;--gold-soft:#2a0020;--blue:#00b0ff;--blue-soft:#001a2a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;min-height:100vh;font-family:var(--gff);font-weight:700;color:var(--ink);background:var(--bg);background-image:radial-gradient(900px 500px at 100% -10%,rgba(200,30,30,.06),transparent 60%),radial-gradient(800px 500px at 0% 100%,rgba(61,61,201,.05),transparent 55%);background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:.02em;transition:background-color .3s,color .3s}
  .app{max-width:600px;margin:0 auto;padding:32px 18px 100px;display:flex;flex-direction:column;gap:20px;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 12px}
  .hero-flag{display:inline-flex;flex-direction:column;width:38px;height:26px;border-radius:5px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.08);margin-bottom:20px}
  .hero-flag span{flex:1}
  .hero-flag span:nth-child(1){background:#0a0a14}
  .hero-flag span:nth-child(2){background:#dd0000}
  .hero-flag span:nth-child(3){background:#ffce00}
  .hero-title{margin:0;font-size:clamp(34px,9vw,56px);font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;background:linear-gradient(90deg,#fff 0%,#fbb 15%,#f66 30%,#e01e1e 45%,#a01010 55%,#e01e1e 65%,#f66 80%,#fbb 90%,#fff 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:flow 6s linear infinite;filter:drop-shadow(0 3px 12px rgba(200,30,30,.35));display:inline-block;padding:0 4px}
  @keyframes flow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  .hero-divider{width:44px;height:3px;background:linear-gradient(90deg,transparent,var(--red),transparent);border-radius:2px;margin:16px 0 14px}
  .hero-credit{margin:0;font-size:11px;letter-spacing:4px;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .hero-credit strong{color:var(--ink);font-weight:900;letter-spacing:4px}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px;margin-top:8px}
  .section-label{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cat-card{display:flex;flex-direction:column;gap:10px;padding:20px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;text-align:left;cursor:pointer;font-family:inherit;transition:all .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-sm);color:var(--ink);position:relative;overflow:hidden}
  .cat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--cat-color,transparent);opacity:.9}
  .cat-card:hover{border-color:var(--ink);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .cat-card:active{transform:translateY(0) scale(.99)}
  .cat-card.wide{grid-column:span 2}
  .cat-head{display:flex;justify-content:space-between;align-items:flex-start}
  .cat-icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;transition:transform .25s}
  .cat-card:hover .cat-icon{transform:scale(1.08) rotate(-4deg)}
  .cat-count{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .cat-name{font-size:16px;font-weight:900;color:var(--ink);margin-top:2px}
  .cat-sub{font-size:11px;font-weight:700;color:var(--muted);margin-top:-4px}
  .cat-bar{height:4px;background:var(--bg-2);border-radius:99px;overflow:hidden;margin-top:4px}
  .cat-bar>i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .cat-badge{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-size:9.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin-left:6px;vertical-align:middle}
  .exam-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .exam-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px 6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-family:inherit;cursor:pointer;transition:all .22s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;box-shadow:var(--shadow-sm);color:var(--ink)}
  .exam-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
  .exam-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .exam-level{font-size:22px;font-weight:900;color:var(--accent);line-height:1;margin-top:2px}
  .exam-name{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin-top:2px}
  .foot{text-align:center;font-size:11px;color:var(--muted);font-weight:700;line-height:1.9;padding-top:12px}
  .foot kbd{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1.5px 7px;font-size:10.5px;font-family:inherit;color:var(--ink-soft);font-weight:700}
  .settings-fab{position:fixed;right:20px;bottom:20px;z-index:50;width:52px;height:52px;border-radius:50%;border:none;background:var(--ink);color:var(--bg);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);transition:all .22s cubic-bezier(.2,.8,.2,1)}
  .settings-fab:hover{transform:scale(1.08) rotate(45deg)}
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:98;opacity:0;pointer-events:none;transition:opacity .3s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .drawer-backdrop.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(340px,90vw);background:var(--bg);border-left:1px solid var(--line);z-index:99;padding:24px 20px;overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:-12px 0 40px -10px rgba(0,0,0,.3)}
  .drawer.show{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .drawer-title{font-size:20px;font-weight:900;color:var(--ink)}
  .drawer-close{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .setting-group{padding:14px 0;border-bottom:1px solid var(--line)}
  .setting-group:last-child{border-bottom:none}
  .setting-label{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px}
  .theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .theme-btn{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .theme-btn.active{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,30,30,.2)}
  .theme-btn::after{content:attr(data-label);position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);color:#fff;font-size:8px;font-weight:900;text-transform:uppercase;padding:2px 0;text-align:center}
  .theme-preview{display:flex;flex-direction:column;flex:1}
  .theme-preview>span{flex:1}
  .setting-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;cursor:pointer}
  .setting-toggle .t-name{font-size:13px;font-weight:800;color:var(--ink)}
  .setting-toggle .t-desc{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
  .t-switch{width:42px;height:24px;border-radius:12px;background:var(--line-2);position:relative;transition:all .25s;flex-shrink:0}
  .t-switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:all .25s cubic-bezier(.2,.8,.2,1)}
  .setting-toggle.on .t-switch{background:var(--green)}
  .setting-toggle.on .t-switch::after{left:21px}
  .back-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm)}
  .back-btn:hover{border-color:var(--ink);color:var(--ink)}
  .setup-top{display:flex;align-items:center;margin-bottom:6px}
  .setup-hero{display:flex;align-items:center;gap:14px;padding:4px 0 8px}
  .setup-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .setup-titles{display:flex;flex-direction:column;gap:3px;min-width:0}
  .setup-title{font-size:22px;font-weight:900;color:var(--ink);margin:0;line-height:1.1}
  .setup-sub{font-size:12px;font-weight:700;color:var(--muted);margin:0}
  .setup-sub b{color:var(--ink);font-weight:900}
  .setup-label{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:22px 0 10px;padding-left:2px}
  .setup-label:first-of-type{margin-top:0}
  .setup-label .count{font-size:9.5px;padding:2px 8px;border-radius:99px;background:var(--bg-2);color:var(--ink-soft);text-transform:none;font-weight:700}
  .mode-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mode-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font-family:inherit;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
  .mode-card:hover:not(.active){border-color:var(--line-2);transform:translateY(-1px)}
  .mode-card .icon{font-size:22px;line-height:1}
  .mode-card .name{font-size:12px;font-weight:900}
  .mode-card .desc{font-size:9.5px;color:var(--muted);font-weight:700}
  .mode-card.active[data-mode="flash"]{background:var(--indigo-soft);border-color:var(--indigo)}
  .mode-card.active[data-mode="quiz"]{background:var(--green-soft);border-color:var(--green)}
  .mode-card.active[data-mode="type"]{background:var(--red-soft);border-color:var(--red)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:8px 15px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;box-shadow:var(--shadow-sm)}
  .chip:hover:not(.active){border-color:var(--ink);color:var(--ink)}
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .topic-select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm)}
  .topic-select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(200,30,30,.1)}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:16px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
  .toggle-row .label{font-size:13px;font-weight:900;color:var(--ink)}
  .toggle-row .desc{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
  .toggle-row .switch{width:42px;height:24px;border-radius:12px;background:var(--line-2);position:relative;transition:all .25s;flex-shrink:0}
  .toggle-row .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:all .25s cubic-bezier(.2,.8,.2,1)}
  .toggle-row.on .switch{background:var(--green)}
  .toggle-row.on .switch::after{left:21px}
  .start-btn{width:100%;margin-top:22px;padding:17px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;transition:all .22s;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 10px 28px -12px rgba(200,30,30,.55);display:flex;align-items:center;justify-content:center;gap:8px}
  .start-btn:hover{transform:translateY(-2px)}
  .session{display:flex;flex-direction:column;gap:14px;animation:fadeUp .35s cubic-bezier(.2,.8,.2,1)}
  .session-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .session-tag{padding:6px 12px;border-radius:99px;font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .session-tag.flash{background:var(--indigo-soft);color:var(--indigo)}
  .session-tag.quiz{background:var(--green-soft);color:var(--green)}
  .session-tag.type{background:var(--red-soft);color:var(--red)}
  .session-tag.exam{background:var(--red-soft);color:var(--red)}
  .progress{display:flex;flex-direction:column;gap:7px}
  .progress-meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;color:var(--muted)}
  .progress-bar{height:5px;background:var(--bg-2);border-radius:99px;overflow:hidden}
  .progress-bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--red-deep));transition:width .4s}
  .progress-meta .score{color:var(--green);font-weight:900}
  .q-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow-sm),0 8px 32px -16px rgba(0,0,0,.1);position:relative}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .card-badges{display:flex;gap:6px;flex-wrap:wrap}
  .card-actions{margin-left:auto;display:flex;gap:6px}
  .level-badge{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
  .level-badge.A1{background:var(--green-soft);color:var(--green)}
  .level-badge.A2{background:var(--blue-soft);color:var(--blue)}
  .level-badge.B1{background:var(--amber-soft);color:var(--amber)}
  .level-badge.B2{background:var(--red-soft);color:var(--red)}
  .status-badge{padding:3px 10px;border-radius:6px;font-size:9.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
  .status-badge.new{background:var(--indigo-soft);color:var(--indigo)}
  .status-badge.learning{background:var(--amber-soft);color:var(--amber)}
  .status-badge.mastered{background:var(--green-soft);color:var(--green)}
  .topic-badge{padding:3px 10px;border-radius:6px;font-size:9.5px;font-weight:900;letter-spacing:.06em;background:var(--gold-soft);color:var(--gold)}
  .speak-btn,.hint-btn{width:38px;height:38px;border-radius:50%;padding:0;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:var(--shadow-sm)}
  .hint-btn{font-family:var(--serif);font-weight:900;font-size:15px}
  .speak-btn:hover{border-color:var(--red);color:var(--red);transform:scale(1.08)}
  .speak-btn.speaking{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite}
  .hint-btn:hover,.hint-btn.active{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,30,30,.4)}70%{box-shadow:0 0 0 12px rgba(200,30,30,0)}100%{box-shadow:0 0 0 0 rgba(200,30,30,0)}}
  .speak-mini{width:26px;height:26px;border-radius:50%;padding:0;flex-shrink:0;background:var(--bg-2);border:1px solid var(--line);color:var(--muted);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;opacity:.7}
  .speak-mini:hover{background:var(--red-soft);border-color:var(--red);color:var(--red);transform:scale(1.1);opacity:1}
  .speak-mini.speaking{background:var(--red);border-color:var(--red);color:#fff;opacity:1;animation:miniPulse 1s infinite}
  @keyframes miniPulse{0%,100%{box-shadow:0 0 0 0 rgba(200,30,30,.4)}50%{box-shadow:0 0 0 6px rgba(200,30,30,0)}}
  .speak-flash{position:absolute;top:12px;left:14px;z-index:5;width:36px;height:36px;border-radius:50%;padding:0;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .speak-flash:hover{background:rgba(200,30,30,.7);border-color:var(--red);transform:scale(1.1)}
  .speak-flash.speaking{background:var(--red);border-color:var(--red);animation:pulse 1s infinite}
  .flash-front .speak-flash{background:var(--surface);border-color:var(--line);color:var(--ink-soft)}
  .flash-front .speak-flash:hover{background:var(--red-soft);border-color:var(--red);color:var(--red)}
  .flash-scene{perspective:1600px;margin:4px 0 12px}
  .flashcard{position:relative;width:100%;height:250px;cursor:pointer;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,.2,.2,1)}
  .flashcard.flipped{transform:rotateY(180deg)}
  .flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm)}

const $=(s,r=document)=>r.querySelector(s);

/* ═══ TTS ENGINE ═══ */
const TTS={currentAudio:null,useGoogle:true,rate:.9,_timeoutId:null,
cleanText(t){return String(t).replace(/[„""«»]/g,'').replace(/[''`]/g,'').replace(/\s+/g,' ').trim()},
stop(){if(this._timeoutId){clearTimeout(this._timeoutId);this._timeoutId=null}if(this.currentAudio){try{this.currentAudio.onended=null;this.currentAudio.onerror=null;this.currentAudio.pause();this.currentAudio.currentTime=0}catch(e){}this.currentAudio=null}if('speechSynthesis'in window){try{speechSynthesis.cancel()}catch(e){}}$$('.speak-btn,.speak-mini,.speak-flash,.fb-speak').forEach(b=>b.classList.remove('speaking'))},
speak(text,btn){if(!text)return;this.stop();const clean=this.cleanText(text);if(btn)btn.classList.add('speaking');const useWeb=()=>this.speakWebSpeech(text,btn);if(this.useGoogle)this.tryGoogle(clean,useWeb);else useWeb()},
tryGoogle(clean,fallback){let audio;try{const url='https://translate.google.com/translate_tts?ie=UTF-8&q='+encodeURIComponent(clean)+'&tl=de&client=tw-ob';audio=new Audio();audio.preload='auto';audio.src=url;audio.playbackRate=this.rate;this.currentAudio=audio}catch(e){fallback();return}let done=false,started=false;const doFallback=()=>{if(done)return;done=true;if(this._timeoutId){clearTimeout(this._timeoutId);this._timeoutId=null}try{audio.pause();audio.src=''}catch(e){}if(this.currentAudio===audio)this.currentAudio=null;fallback()};this._timeoutId=setTimeout(()=>{if(!started)doFallback()},1200);audio.addEventListener('playing',()=>{started=true;if(done){try{audio.pause()}catch(e){}return}if(this._timeoutId){clearTimeout(this._timeoutId);this._timeoutId=null}},{once:true});audio.onended=()=>{if(this._timeoutId){clearTimeout(this._timeoutId);this._timeoutId=null}if(this.currentAudio===audio)this.currentAudio=null;$$('.speak-btn,.speak-mini,.speak-flash,.fb-speak').forEach(b=>b.classList.remove('speaking'))};audio.onerror=doFallback;const p=audio.play();if(p&&p.catch)p.catch(doFallback)},
speakWebSpeech(text,btn){if(!('speechSynthesis'in window)){showToast('⚠️ Trình duyệt không hỗ trợ phát âm');if(btn)btn.classList.remove('speaking');return}if(!deVoice)loadVoices();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.85;u.pitch=1;if(deVoice)u.voice=deVoice;if(btn)btn.classList.add('speaking');u.onend=()=>{if(btn)btn.classList.remove('speaking')};u.onerror=()=>{if(btn)btn.classList.remove('speaking')};try{speechSynthesis.speak(u)}catch(e){if(btn)btn.classList.remove('speaking');showToast('⚠️ Không thể phát âm')}}};
let deVoice=null;
function loadVoices(retries=10){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices();if(!vs||vs.length===0){if(retries>0)setTimeout(()=>loadVoices(retries-1),200);return}deVoice=vs.find(v=>/^de(-|_)/i.test(v.lang))||vs.find(v=>/deutsch|german/i.test(v.name))||null}

const Sound={ctx:null,enabled:true,
init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){this.enabled=false}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},

tone(freq,dur,type='sine',vol=.12){if(!this.ctx)return;const ctx=this.ctx,osc=ctx.createOscillator(),g=ctx.createGain();osc.type=type;osc.frequency.value=freq;g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);osc.connect(g);g.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+dur)}};

const Confetti={canvas:null,ctx:null,particles:[],raf:null,enabled:true,
init(){if(this.canvas)return;this.canvas=document.getElementById('confettiCanvas');this.ctx=this.canvas.getContext('2d');this.resize();window.addEventListener('resize',()=>this.resize())},

animate(){if(!this.ctx)return;const ctx=this.ctx;ctx.clearRect(0,0,this.canvas.width,this.canvas.height);for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.vy+=p.gravity;p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;p.rot+=p.rotSpeed;if(p.life<=0){this.particles.splice(i,1);continue}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore()}if(this.particles.length>0)this.raf=requestAnimationFrame(()=>this.animate());else this.raf=null},

function numToGerman(n){if(n===0)return 'null';let r='';if(n>=1000){const th=Math.floor(n/1000);r+=(th===1?'ein':ONES[th])+'tausend';n%=1000;if(!n)return r}if(n>=100){const h=Math.floor(n/100);r+=(h===1?'ein':ONES[h])+'hundert';n%=100;if(!n)return r}if(n>=20){const t=Math.floor(n/10),u=n%10;if(!u)r+=TENS[t];else r+=ONES[u]+'und'+TENS[t]}else if(n===1)r+='eins';else if(n>=2&&n<=9)r+=ONES[n];else if(n>=10&&n<=19)r+=TEENS[n-10];return r}
