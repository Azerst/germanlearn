<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGỪNG HOẠT ĐỘNG</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center;
         justify-content:center; background:#111; }
  h1 { font:900 clamp(2rem,10vw,6rem) Arial,sans-serif; text-align:center;
       background:linear-gradient(120deg,#ff0000,#fff,#b30000,#fff,#ff0000);
       background-size:300% 300%;
       -webkit-background-clip:text; background-clip:text;
       -webkit-text-fill-color:transparent; color:transparent;
       animation:loang 5s ease-in-out infinite;
       filter:drop-shadow(0 0 12px rgba(255,0,0,.5)); }
  @keyframes loang {
    0%,100% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
  }
</style>
</head>
<body>
  <h1>NGỪNG<br>HOẠT ĐỘNG</h1>
</body>
</html>
