<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch lernen — Lernportal</title>
<style>
  :root{
    --bg:#080b14;
    --surface:rgba(255,255,255,0.045);
    --surface-2:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.08);
    --border-2:rgba(255,255,255,0.18);
    --text:#eef2fb;
    --dim:#b8c4dd;
    --muted:#6b7ba3;
    --gold:#ffce00;
    --gold-2:#f4b400;
    --gold-glow:rgba(255,206,0,0.35);
    --green:#10b981;
    --green-2:#059669;
    --green-soft:rgba(16,185,129,0.15);
    --red:#ef4444;
    --red-soft:rgba(239,68,68,0.15);
    --indigo:#6366f1;
    --indigo-2:#4f46e5;
    --indigo-soft:rgba(99,102,241,0.2);
    --purple:#a855f7;
    --purple-soft:rgba(168,85,247,0.18);
    --amber:#f59e0b;
    --amber-soft:rgba(245,158,11,0.16);
    --blue:#3b82f6;
    --blue-soft:rgba(59,130,246,0.16);
    --serif:'Times New Roman','Georgia','Cambria',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:var(--text);background:var(--bg);
    background-image:
      radial-gradient(900px 500px at 10% -10%, rgba(99,102,241,0.16), transparent 60%),
      radial-gradient(800px 500px at 90% 5%, rgba(255,206,0,0.08), transparent 55%),
      radial-gradient(900px 600px at 50% 115%, rgba(16,185,129,0.08), transparent 60%),
      linear-gradient(180deg,#080b14,#0d1220);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  .app{max-width:640px;margin:0 auto;padding:26px 16px 60px;
    display:flex;flex-direction:column;gap:18px;
    animation:fadeUp .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* HERO */
  .hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:4px 0 2px}
  .flag{width:42px;height:28px;border-radius:6px;overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08);
    display:flex;flex-direction:column;margin-bottom:2px}
  .flag span{flex:1}
  .flag span:nth-child(1){background:#111}
  .flag span:nth-child(2){background:#dd0000}
  .flag span:nth-child(3){background:#ffce00}
  .hero h1{margin:0;font-size:clamp(21px,5.5vw,28px);font-weight:800;
    letter-spacing:-.5px;line-height:1.15}
  .hero h1 em{font-style:normal;
    background:linear-gradient(100deg,#fff 0%,var(--gold) 60%,var(--gold-2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin:0;color:var(--muted);font-size:13px;font-weight:600;
    letter-spacing:.2px;line-height:1.5}

  .sec-head{display:flex;align-items:baseline;justify-content:space-between;
    padding:0 2px;margin-bottom:-4px}
  .sec-title{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);font-weight:800}
  .sec-note{font-size:11px;color:var(--muted);font-weight:600}

  /* CATEGORY CARDS */
  .cats{display:flex;flex-direction:column;gap:10px}
  .cat{position:relative;display:flex;align-items:center;gap:14px;
    padding:16px 18px;
    background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border:1px solid var(--border);border-radius:18px;
    color:var(--text);font-family:inherit;text-align:left;cursor:pointer;
    overflow:hidden;transition:all .25s cubic-bezier(.2,.8,.2,1);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .cat::after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(280px 180px at 100% 0%, var(--c,transparent), transparent 70%);
    opacity:.10;pointer-events:none;transition:opacity .3s}
  .cat:hover{background:var(--surface-2);border-color:var(--border-2);
    transform:translateY(-2px);box-shadow:0 12px 28px -12px rgba(0,0,0,.6)}
  .cat:hover::after{opacity:.22}
  .cat:active{transform:translateY(0) scale(.99)}
  .cat-icon{width:46px;height:46px;border-radius:13px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;background:var(--bg-soft,var(--surface));
    border:1px solid var(--border)}
  .cat-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .cat-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .cat-name{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
  .cat-stat{font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .cat-stat b{color:var(--text);font-size:12px}
  .cat-bar{height:5px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
  .cat-bar > i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--green),var(--green-2));
    transition:width .4s cubic-bezier(.2,.8,.2,1)}
  .cat[data-cat="vocab"]{--c:var(--indigo);--bg-soft:var(--indigo-soft)}
  .cat[data-cat="numbers"]{--c:var(--gold);--bg-soft:rgba(255,206,0,.15)}
  .cat[data-cat="alphabet"]{--c:var(--purple);--bg-soft:var(--purple-soft)}
  .cat[data-cat="grammar"]{--c:var(--green);--bg-soft:var(--green-soft)}

  /* QUICK BUTTON */
  .quick{display:flex;align-items:center;gap:12px;
    padding:14px 18px;
    background:linear-gradient(135deg,rgba(255,206,0,.14),rgba(255,206,0,.05));
    border:1px solid rgba(255,206,0,.35);border-radius:16px;
    color:var(--gold);font-family:inherit;font-size:14px;font-weight:800;
    cursor:pointer;transition:all .22s cubic-bezier(.2,.8,.2,1);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);letter-spacing:.1px}
  .quick:hover{background:rgba(255,206,0,.2);transform:translateY(-1px);
    box-shadow:0 8px 22px -8px rgba(255,206,0,.4)}
  .quick:active{transform:translateY(0) scale(.99)}
  .quick-icon{font-size:20px}
  .quick-sub{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}

  /* EXAM SECTION */
  .exam-section{
    padding:18px 16px;
    background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
    border:1px solid var(--border);border-radius:20px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .exam-title{display:flex;align-items:center;gap:8px;margin:0 0 4px;
    font-size:15px;font-weight:800;letter-spacing:-.2px}
  .exam-title span{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;
    background:rgba(255,206,0,.15);color:var(--gold);letter-spacing:.5px;
    text-transform:uppercase}
  .exam-sub{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 14px;line-height:1.5}
  .levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .level{display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:14px 6px;background:var(--surface);
    border:1.5px solid var(--border);border-radius:13px;
    color:var(--text);font-family:inherit;cursor:pointer;
    transition:all .2s cubic-bezier(.2,.8,.2,1)}
  .level:hover{transform:translateY(-2px);border-color:var(--border-2);
    box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
  .level:active{transform:translateY(0) scale(.97)}
  .level-code{font-size:17px;font-weight:900;letter-spacing:-.4px;
    font-family:inherit;line-height:1}
  .level-sub{font-size:9.5px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--muted)}
  .level[data-level="A1"] .level-code{color:#10b981}
  .level[data-level="A2"] .level-code{color:#3b82f6}
  .level[data-level="B1"] .level-code{color:#f59e0b}
  .level[data-level="B2"] .level-code{color:#ef4444}
  .level[data-level="A1"]:hover{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.4)}
  .level[data-level="A2"]:hover{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.4)}
  .level[data-level="B1"]:hover{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.4)}
  .level[data-level="B2"]:hover{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}

  /* FOOT */
  .foot{text-align:center;font-size:11px;color:#4d5d80;font-weight:600;
    padding-top:6px;line-height:1.75}
  .foot kbd{background:rgba(255,255,255,.06);border:1px solid var(--border);
    border-radius:4px;padding:1px 6px;font-size:10px;font-family:inherit;
    color:var(--dim);font-weight:700}

  /* SETUP */
  .setup-top{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .back{padding:8px 13px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--dim);font-family:inherit;font-size:12px;
    font-weight:700;cursor:pointer;transition:all .18s;
    display:flex;align-items:center;gap:5px}
  .back:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-2)}
  .back:active{transform:scale(.97)}
  .setup-title{font-size:19px;font-weight:800;letter-spacing:-.3px;margin:0 0 2px}
  .setup-title em{font-style:normal;
    background:linear-gradient(100deg,#fff,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .setup-sub{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 16px;line-height:1.5}

  .setup-label{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);font-weight:800;margin:18px 0 8px;padding-left:2px;
    display:flex;align-items:center;gap:8px}
  .setup-label:first-of-type{margin-top:0}
  .setup-label .count{font-size:9.5px;letter-spacing:.5px;padding:2px 7px;
    border-radius:99px;background:rgba(255,255,255,.06);color:var(--dim);
    text-transform:none;font-weight:700}

  .mode-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mode-card{display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:15px 6px;background:var(--surface);border:1.5px solid var(--border);
    border-radius:14px;color:var(--text);font-family:inherit;cursor:pointer;
    transition:all .22s cubic-bezier(.2,.8,.2,1)}
  .mode-card:hover:not(.active){background:var(--surface-2);border-color:var(--border-2);
    transform:translateY(-1px)}
  .mode-card:active{transform:translateY(0) scale(.98)}
  .mode-card .icon{font-size:22px;line-height:1}
  .mode-card .name{font-size:12px;font-weight:800;letter-spacing:.1px}
  .mode-card .desc{font-size:9.5px;color:var(--muted);font-weight:600;margin-top:-1px}
  .mode-card.active[data-mode="flash"]{
    background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(99,102,241,.06));
    border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  .mode-card.active[data-mode="quiz"]{
    background:linear-gradient(135deg,rgba(16,185,129,.22),rgba(16,185,129,.06));
    border-color:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
  .mode-card.active[data-mode="type"]{
    background:linear-gradient(135deg,rgba(255,206,0,.22),rgba(255,206,0,.06));
    border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:8px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);font-family:inherit;
    font-size:12.5px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
  .chip:hover:not(.active){background:var(--surface-2);color:var(--dim);border-color:var(--border-2)}
  .chip.active{
    background:linear-gradient(135deg,rgba(255,206,0,.22),rgba(255,206,0,.08));
    color:var(--gold);border-color:rgba(255,206,0,.5);
    box-shadow:0 3px 12px rgba(255,206,0,.15)}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 15px;background:var(--surface);border:1px solid var(--border);
    border-radius:13px;margin-top:14px;cursor:pointer;transition:all .2s}
  .toggle-row:hover{background:var(--surface-2)}
  .toggle-row .label{font-size:13px;font-weight:700;color:var(--text)}
  .toggle-row .desc{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
  .toggle-row .switch{width:42px;height:24px;border-radius:12px;
    background:rgba(255,255,255,.1);position:relative;transition:all .25s;flex-shrink:0}
  .toggle-row .switch::after{content:"";position:absolute;top:3px;left:3px;
    width:18px;height:18px;border-radius:50%;background:#fff;
    transition:all .25s cubic-bezier(.2,.8,.2,1)}
  .toggle-row.on .switch{background:var(--green)}
  .toggle-row.on .switch::after{left:21px}

  .start-btn{width:100%;margin-top:18px;padding:16px;border-radius:14px;border:0;
    background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1a1200;
    font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;
    box-shadow:0 8px 24px var(--gold-glow);transition:all .2s;
    letter-spacing:.2px;display:flex;align-items:center;justify-content:center;gap:8px}
  .start-btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px var(--gold-glow)}
  .start-btn:active{transform:translateY(0) scale(.99)}

  /* SESSION */
  .session{display:flex;flex-direction:column;gap:14px;
    animation:fadeUp .35s cubic-bezier(.2,.8,.2,1)}
  .session-top{display:flex;align-items:center;gap:10px}
  .session-tag{margin-left:auto;padding:5px 12px;border-radius:99px;
    font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    white-space:nowrap}
  .session-tag.flash{background:var(--indigo-soft);color:#a5b4fc}
  .session-tag.quiz{background:var(--green-soft);color:#6ee7b7}
  .session-tag.type{background:rgba(255,206,0,.15);color:var(--gold)}
  .session-tag.exam{background:rgba(255,206,0,.15);color:var(--gold)}

  .progress-wrap{display:flex;flex-direction:column;gap:5px}
  .progress-meta{display:flex;justify-content:space-between;align-items:center;
    font-size:11.5px;font-weight:700;color:var(--muted)}
  .progress-meta .q-count{font-variant-numeric:tabular-nums}
  .progress-meta .score{color:var(--green)}
  .progress-bar{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
  .progress-bar > i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--gold),var(--gold-2));
    transition:width .4s cubic-bezier(.2,.8,.2,1)}

  /* CARD */
  .study-card{
    background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border:1px solid var(--border);border-radius:22px;padding:22px 20px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    position:relative;overflow:hidden}
  .study-card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:linear-gradient(135deg,rgba(255,206,0,.14),transparent 45%,transparent 55%,rgba(99,102,241,.10));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .level-badge{padding:3px 9px;border-radius:6px;font-size:10px;font-weight:900;
    letter-spacing:.5px;background:rgba(255,255,255,.06);color:var(--dim)}
  .level-badge.A1{background:rgba(16,185,129,.15);color:#6ee7b7}
  .level-badge.A2{background:rgba(59,130,246,.15);color:#93c5fd}
  .level-badge.B1{background:rgba(245,158,11,.15);color:#fcd34d}
  .level-badge.B2{background:rgba(239,68,68,.15);color:#fca5a5}
  .status-badge{padding:3px 9px;border-radius:6px;font-size:9.5px;font-weight:800;
    letter-spacing:.5px;text-transform:uppercase}
  .status-badge.new{background:rgba(99,102,241,.15);color:#a5b4fc}
  .status-badge.learning{background:rgba(245,158,11,.15);color:#fcd34d}
  .status-badge.mastered{background:rgba(16,185,129,.15);color:#6ee7b7}

  .speak-btn,.hint-btn{width:36px;height:36px;border-radius:50%;padding:0;
    border:1px solid var(--border);background:var(--surface);
    color:var(--text);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .2s}
  .speak-btn{margin-left:auto}
  .hint-btn{font-family:Georgia,serif;font-weight:900;font-size:15px;
    color:var(--muted);margin-left:6px}
  .speak-btn:hover{background:var(--surface-2);border-color:var(--border-2);transform:scale(1.08)}
  .speak-btn:active{transform:scale(.92)}
  .speak-btn.speaking{background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#1a1200;border-color:transparent;animation:pulse 1s infinite}
  .hint-btn:hover{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
  .hint-btn.active{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--gold-glow)}
    70%{box-shadow:0 0 0 14px rgba(255,206,0,0)}
    100%{box-shadow:0 0 0 0 rgba(255,206,0,0)}}

  /* FLASHCARD */
  .flash-scene{perspective:1600px;margin:4px 0 10px}
  .flashcard{position:relative;width:100%;height:230px;cursor:pointer;
    transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.4,.2,.2,1)}
  .flashcard.flipped{transform:rotateY(180deg)}
  .flash-face{position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:16px;padding:26px 20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    text-align:center;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
  .flash-front{background:linear-gradient(160deg,#1d2f52,#141f34)}
  .flash-back{background:linear-gradient(160deg,#3d2b0e,#1d1508);transform:rotateY(180deg)}
  .flash-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);font-weight:800}
  .flash-back .flash-label{color:#d8a93a}
  .flash-main{font-size:clamp(24px,7vw,38px);font-weight:800;line-height:1.2;
    word-break:break-word;max-width:100%}
  .flash-main.letter{font-size:clamp(72px,22vw,110px);letter-spacing:2px}
  .flash-sub{font-size:13.5px;color:var(--muted);font-weight:600;line-height:1.5;max-width:100%}
  .flash-back .flash-sub{color:#e0c68a}

  .flip-hint{font-size:11.5px;color:var(--muted);text-align:center;
    font-weight:600;margin-bottom:10px}
  .flip-btn{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);
    font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s}
  .flip-btn:hover{background:var(--surface-2);border-color:var(--border-2)}
  .flip-btn:active{transform:scale(.98)}

  /* OPTIONS */
  .options{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;align-items:center;gap:12px;padding:13px 15px;
    background:var(--surface);border:1.5px solid var(--border);border-radius:13px;
    color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;
    text-align:left;cursor:pointer;
    transition:all .18s cubic-bezier(.2,.8,.2,1);
    animation:optIn .32s cubic-bezier(.2,.8,.2,1) backwards}
  .opt:nth-child(1){animation-delay:.03s}.opt:nth-child(2){animation-delay:.07s}
  .opt:nth-child(3){animation-delay:.11s}.opt:nth-child(4){animation-delay:.15s}
  @keyframes optIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  .opt:hover:not(:disabled){background:var(--surface-2);border-color:var(--border-2);
    transform:translateX(2px)}
  .opt:disabled{cursor:default}
  .opt-letter{width:30px;height:30px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,206,0,.13);color:var(--gold);
    font-weight:800;font-size:13px}
  .opt-text{flex:1;word-break:break-word;line-height:1.35}
  .opt.correct{background:var(--green-soft);border-color:var(--green);
    animation:pop .35s cubic-bezier(.2,.8,.2,1)}

/* ══════════════════════════════════════════════════════════

══════════════════════════════════════════════════════════ */
const ONES  = ['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
const TEENS = ['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS  = ['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];

function numToGerman(n){
  if (n === 0) return 'null';
  let r = '';
  if (n >= 1000) {
    const th = Math.floor(n/1000);
    r += (th === 1 ? 'ein' : ONES[th]) + 'tausend';
    n %= 1000;
    if (n === 0) return r;
  }
  if (n >= 100) {
    const h = Math.floor(n/100);
    r += (h === 1 ? 'ein' : ONES[h]) + 'hundert';
    n %= 100;
    if (n === 0) return r;
  }
  if (n >= 20) {
    const t = Math.floor(n/10), u = n%10;
    if (u === 0) r += TENS[t];
    else         r += ONES[u] + 'und' + TENS[t];
  } else if (n === 1) r += 'eins';
  else if (n >= 2 && n <= 9) r += ONES[n];
  else if (n >= 10 && n <= 19) r += TEENS[n-10];
  return r;
}

const VN_ONES = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function numToVietnamese(n){
  if (n === 1000) return 'một nghìn';
  if (n === 0) return 'không';
  if (n < 10) return VN_ONES[n];
  if (n < 20) { if (n===10) return 'mười'; if (n===15) return 'mười lăm'; return 'mười ' + VN_ONES[n-10]; }
  if (n < 100) {
    const t = Math.floor(n/10), u = n%10;
    if (u === 0) return VN_ONES[t] + ' mươi';
    if (u === 1) return VN_ONES[t] + ' mươi mốt';
    if (u === 5) return VN_ONES[t] + ' mươi lăm';
    return VN_ONES[t] + ' mươi ' + VN_ONES[u];
  }
  const h = Math.floor(n/100), rest = n%100;
  let out = VN_ONES[h] + ' trăm';
  if (rest === 0) return out;
  if (rest < 10) return out + ' lẻ ' + VN_ONES[rest];
  if (rest < 20) { if (rest===10) return out + ' mười'; if (rest===15) return out + ' mười lăm'; return out + ' mười ' + VN_ONES[rest-10]; }
  const t = Math.floor(rest/10), u = rest%10;
  if (u === 0) return out + ' ' + VN_ONES[t] + ' mươi';
  if (u === 1) return out + ' ' + VN_ONES[t] + ' mươi mốt';
  if (u === 5) return out + ' ' + VN_ONES[t] + ' mươi lăm';
  return out + ' ' + VN_ONES[t] + ' mươi ' + VN_ONES[u];
}

    name:'Grammatik', icon:'📚',
    filters:[{key:'A1',label:'A1'},{key:'A2',label:'A2'},{key:'B1',label:'B1'},{key:'B2',label:'B2'}],
    items: GRAMMAR_RAW.map((g,i)=>({
      id:'g-'+i, type:'grammar',
      sentence:g.q, opts:g.opts, correct:g.a,
      hint:g.hint, explain:g.ex, level:g.lv,
      front:g.q.replace('___','______'),
      back:g.opts[g.a],
      speak:g.q.replace('___',g.opts[g.a]).replace(/[.,!?]/g,''),
    })),
  },
};

/* ══════════════════════════════════════════════════════════
   PROGRESS
══════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'deutsch-lern-progress-v3';
let PROGRESS = {};
try { PROGRESS = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ PROGRESS = {}; }
function saveProgress(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS)); } catch(e){} }
function getStatus(id){ return PROGRESS[id] || 'new'; }
function setStatus(id, s){ PROGRESS[id] = s; saveProgress(); }
function catStats(k){
  const items = CATS[k].items;
  const m = items.filter(it=>getStatus(it.id)==='mastered').length;
  const l = items.filter(it=>getStatus(it.id)==='learning').length;
  return {mastered:m, learning:l, total:items.length};
}

/* ══════════════════════════════════════════════════════════
   TTS
══════════════════════════════════════════════════════════ */
let deVoice = null;
function loadVoices(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  deVoice = vs.find(v=>/^de(-|_)/i.test(v.lang)) || vs.find(v=>/deutsch|german/i.test(v.name)) || null;
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, btn){
  if (!text) return;
  if (!('speechSynthesis' in window)) { alert('Trình duyệt không hỗ trợ phát âm.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='de-DE'; u.rate=0.85; u.pitch=1;
  if (deVoice) u.voice = deVoice;
  $$('.speak-btn').forEach(b=>b.classList.remove('speaking'));
  if (btn) btn.classList.add('speaking');
  u.onend = ()=>{ if(btn) btn.classList.remove('speaking'); };
  u.onerror = ()=>{ if(btn) btn.classList.remove('speaking'); };
  speechSynthesis.speak(u);
}

/* ══════════════════════════════════════════════════════════
   SESSION START
══════════════════════════════════════════════════════════ */
const SESSION_SIZE = 20;

function pickSessionItems(items, onlyUnlearned){
  let pool = items;
  if (onlyUnlearned) {
    pool = items.filter(it=>getStatus(it.id)!=='mastered');
    if (pool.length===0) pool = items;
  }
  const unlearned = pool.filter(it=>getStatus(it.id)!=='mastered');
  const mastered  = pool.filter(it=>getStatus(it.id)==='mastered');
  shuffle(unlearned); shuffle(mastered);
  const n = Math.min(SESSION_SIZE, pool.length);
  const out = [];
  for (const it of unlearned) { if (out.length>=n) break; out.push(it); }
  for (const it of mastered)  { if (out.length>=n) break; out.push(it); }
  return shuffle(out);
}

function startSession(){
  const {cat, filter, mode} = state.setup;
  const pool = getFilteredItems(cat, filter);
  const items = pickSessionItems(pool, state.setup.onlyUnlearned);
  if (items.length===0) { alert('Không có mục nào. Thử bỏ "Chỉ ôn chưa thuộc".'); return; }

  state.session = {
    cat, filter, mode, items,
    index:0, correct:0, marked:0,
    answered:false, flipped:false, currentOpts:null, currentCorrect:null,
    typeMode:null, isExam:false, examData:null,
  };
  state.view='session';
  renderQuestion();
}

function startReviewAll(){
  const all = [];
  for (const k of Object.keys(CATS)) {
    for (const it of CATS[k].items) {
      if (getStatus(it.id)!=='mastered') all.push({...it});
    }
  }
  if (all.length===0) { alert('Tuyệt vời! Bạn đã thuộc hết tất cả các mục.'); return; }
  shuffle(all);
  const items = all.slice(0, SESSION_SIZE);
  state.session = {
    cat:'__review', filter:null, mode:'flash', items,
    index:0, correct:0, marked:0,
    answered:false, flipped:false, currentOpts:null, currentCorrect:null,
    typeMode:null, isExam:false, examData:null,
  };
  state.view='session';
  renderQuestion();
}

function renderQuestion(){

  if (s.index >= s.items.length) return renderSummary();

  else if (s.mode==='quiz') {
    const q = buildQuiz(item);
    s.currentOpts = q.options;
    s.currentCorrect = q.correctIndex;
    bodyHtml = renderQuizBody(item, q);
  } else bodyHtml = renderTypeBody(item);

          <span class="status-badge ${status}">${statusLabel}</span>
          ${item.type==='grammar'?`<button class="hint-btn" id="hintBtn" title="Cách làm">?</button>`:''}
          <button class="speak-btn" id="speakBtn" title="Nghe tiếng Đức">🔊</button>
        </div>
        <div id="hintArea"></div>
        ${bodyHtml}
        <div id="fbArea"></div>
        <div class="mark-row" id="markRow">
          <button class="mark-btn unlearn" id="markUnlearn">😕 Chưa thuộc</button>
          <button class="mark-btn learn" id="markLearn">✅ Thuộc rồi</button>
        </div>

    hintBtnEl.addEventListener('click', e=>{

      else {
        area.innerHTML = `<div class="hint-box"><span class="label">💡 Cách làm</span>${esc(item.hint)}</div>`;
        hintBtnEl.classList.add('active');
      }
    });

  if (s.mode==='flash') wireFlash(item);
  else if (s.mode==='quiz') wireQuiz(item);

function wireFlash(item){
  const s = state.session;
  const card = $('#flashcard');
  const flip = ()=>{
    if (s.flipped) return;
    s.flipped = true;
    card.classList.add('flipped');

function buildQuiz(item){
  let questionText, correctAnswer, pool, speakText;
  if (item.type==='vocab') {
    if (Math.random()<0.5) {
      questionText = `Từ <b>"${esc(item.front)}"</b> có nghĩa là gì?`;
      correctAnswer = item.back;
      pool = CATS.vocab.items.filter(x=>x.id!==item.id).map(x=>x.back);
      speakText = item.front;
    } else {
      questionText = `<b>"${esc(item.back)}"</b> trong tiếng Đức là?`;
      correctAnswer = item.front;
      pool = CATS.vocab.items.filter(x=>x.id!==item.id).map(x=>x.front);
      speakText = item.front;
    }
  } else if (item.type==='number') {
    if (Math.random()<0.5) {
      questionText = `Số <b>${item.num}</b> trong tiếng Đức là?`;
      correctAnswer = item.back;
      pool = buildNumberDistractors(item.num);
      speakText = item.back;
    } else {
      questionText = `Từ <b>"${esc(item.back)}"</b> là số nào?`;
      correctAnswer = String(item.num);
      pool = buildNumberDistractorsNum(item.num);
      speakText = item.back;
    }
  } else if (item.type==='alphabet') {
    const others = CATS.alphabet.items.filter(x=>x.id!==item.id);
    if (Math.random()<0.5) {
      questionText = `Chữ <b style="font-size:1.2em">${esc(item.letter)}</b> đọc là gì?`;
      correctAnswer = item.back;
      pool = others.map(x=>x.back);
      speakText = item.letter;
    } else {
      questionText = `Cách đọc <b>"${esc(item.back)}"</b> là chữ cái nào?`;
      correctAnswer = item.letter;
      pool = others.map(x=>x.letter);
      speakText = item.letter;
    }
  } else {
    questionText = item.sentence.replace('___','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    correctAnswer = item.opts[item.correct];
    pool = item.opts.filter((_,i)=>i!==item.correct);
    speakText = item.speak;
  }
  const opts = makeOpts(correctAnswer, pool, 4);
  return {questionText, options:opts, correctIndex:opts.indexOf(String(correctAnswer)), speakText};
}

function buildNumberDistractors(n){
  const set = new Set([numToGerman(n)]);
  const cands = [];
  for (const o of [-1,1,-2,2,-10,10,-20,20]) { const c=n+o; if (c>=0&&c<=1000) cands.push(numToGerman(c)); }
  for (let i=0;i<25;i++) cands.push(numToGerman(rand(0,1000)));
  shuffle(cands);
  for (const c of cands) { if (set.size>=4) break; set.add(c); }
  return [...set];
}
function buildNumberDistractorsNum(n){
  const set = new Set([String(n)]);
  const cands = [];
  for (const o of [-1,1,-2,2,-10,10,-20,20]) { const c=n+o; if (c>=0&&c<=1000) cands.push(String(c)); }
  for (let i=0;i<25;i++) cands.push(String(rand(0,1000)));
  shuffle(cands);
  for (const c of cands) { if (set.size>=4) break; set.add(c); }
  return [...set];
}
function makeOpts(correct, pool, n=4){
  const set = new Set([String(correct)]);
  for (const p of shuffle([...pool])) { if (set.size>=n) break; set.add(String(p)); }
  return shuffle([...set]);
}

function renderQuizBody(item, q){
  const LETTERS = ['A','B','C','D'];
  const optsHtml = q.options.map((o,i)=>`
    <button class="opt" data-idx="${i}">
      <span class="opt-letter">${LETTERS[i]}</span>
      <span class="opt-text">${esc(o)}</span>
    </button>
  `).join('');
  return `<div class="q-text">${q.questionText}</div><div class="options" id="opts">${optsHtml}</div>`;
}

function wireQuiz(item){
  const s = state.session;
  $$('#opts .opt').forEach((btn,i)=>{
    btn.addEventListener('click', ()=>{
      if (s.answered) return;
      s.answered = true;
      const correctIdx = s.currentCorrect;
      const isCorrect = i===correctIdx;
      if (isCorrect) s.correct++;
      $$('#opts .opt').forEach((b,j)=>{
        b.disabled = true;
        if (j===correctIdx) b.classList.add('correct');
        else if (j===i) b.classList.add('wrong');
        else b.classList.add('dimmed');
      });
      const fb = $('#fbArea');
      const LETTERS = ['A','B','C','D'];
      let extra = '';
      if (item.type==='grammar' && item.explain) extra = `<small>${esc(item.explain)}</small>`;
      else if (item.type==='alphabet') extra = `<small>${esc(item.extra||'')}</small>`;
      else if (item.type==='number') extra = `<small>${item.num} = ${esc(item.back)} · ${esc(item.extra||'')}</small>`;
      else if (item.type==='vocab') extra = `<small>${esc(item.front)} = ${esc(item.back)}</small>`;
      if (isCorrect) fb.innerHTML = `<div class="fb correct">✅ Chính xác!${extra}</div>`;
      else fb.innerHTML = `<div class="fb wrong">❌ Sai! Đáp án: <b>${LETTERS[correctIdx]}</b> — <b>${esc(s.currentOpts[correctIdx])}</b>${extra}</div>`;
      $('#markRow').classList.add('show');
      if (isCorrect) $('#markLearn').classList.add('suggested');
      else $('#markUnlearn').classList.add('suggested');
      $('.progress-meta .score').textContent = `✓ ${s.correct}`;
      if (state.autoSpeak) speak(item.speak, $('#speakBtn'));
    });
  });
}

function renderTypeBody(item){
  let questionText, placeholder, inputMode;
  if (item.type==='vocab') {
    if (Math.random()<0.5) {
      questionText = `Viết từ tiếng Đức cho: <b>"${esc(item.back)}"</b>`;
      placeholder = 'VD: der Apfel…'; inputMode='de';
    } else {
      questionText = `Nghĩa tiếng Việt của: <b>"${esc(item.front)}"</b>`;
      placeholder = 'Nhập nghĩa tiếng Việt…'; inputMode='vi';
    }
  } else if (item.type==='number') {
    if (Math.random()<0.5) {
      questionText = `Viết số <b>${item.num}</b> bằng tiếng Đức`;
      placeholder = 'VD: eins, zwei…'; inputMode='de';
    } else {
      questionText = `Số <b>"${esc(item.back)}"</b> là số nào?`;
      placeholder = 'Nhập số…'; inputMode='number';
    }
  } else if (item.type==='alphabet') {
    questionText = `Chữ <b style="font-size:1.2em">${esc(item.letter)}</b> đọc là gì?`;
    placeholder = 'VD: ah, beh, tseh…'; inputMode='de';
  } else {
    questionText = item.sentence.replace('___','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    placeholder = 'Điền từ còn thiếu…'; inputMode='de';
  }
  state.session.typeMode = inputMode;
  return `
    <div class="q-text">${questionText}</div>
    <input type="text" id="typeInput" class="type-input" placeholder="${placeholder}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="check-btn" id="checkBtn">✓ Kiểm tra</button>
  `;
}

function normalize(s){
  return String(s).toLowerCase().trim()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[.,!?;]/g,'').replace(/\s+/g,' ');
}

function wireType(item){
  const s = state.session;
  const input = $('#typeInput');
  const check = ()=>{
    if (s.answered) return;
    const val = input.value.trim();
    if (!val) { input.focus(); return; }
    s.answered = true; input.disabled = true;
    let correctAnswer, isCorrect;
    const mode = s.typeMode;
    if (item.type==='vocab') {
      correctAnswer = mode==='de' ? item.front : item.back;
      if (mode==='de') {
        const norm = normalize(val), full = normalize(correctAnswer);
        const noArt = full.replace(/^(der|die|das)\s+/,'');
        isCorrect = norm===full || norm===noArt;
      } else isCorrect = normalize(val)===normalize(correctAnswer);
    } else if (item.type==='number') {
      if (mode==='de') {
        correctAnswer = item.back;
        isCorrect = normalize(val)===normalize(correctAnswer);
      } else {
        correctAnswer = String(item.num);
        isCorrect = val.replace(/\D/g,'')===correctAnswer;
      }
    } else if (item.type==='alphabet') {
      correctAnswer = item.back;
      isCorrect = normalize(val)===normalize(correctAnswer);
    } else {
      correctAnswer = item.opts[item.correct];
      isCorrect = normalize(val)===normalize(correctAnswer);
    }
    if (isCorrect) s.correct++;
    input.classList.add(isCorrect?'correct':'wrong');
    const fb = $('#fbArea');
    let extra = '';
    if (item.type==='grammar' && item.explain) extra = `<small>${esc(item.explain)}</small>`;
    else if (item.type==='alphabet') extra = `<small>${esc(item.extra||'')}</small>`;
    else if (item.type==='number') extra = `<small>${item.num} = ${esc(item.back)} · ${esc(item.extra||'')}</small>`;
    else if (item.type==='vocab') extra = `<small>${esc(item.front)} = ${esc(item.back)}</small>`;
    if (isCorrect) fb.innerHTML = `<div class="fb correct">✅ Chính xác!${extra}</div>`;
    else fb.innerHTML = `<div class="fb wrong">❌ Chưa đúng! Đáp án: <b>${esc(correctAnswer)}</b>${extra}</div>`;
    $('#checkBtn').style.display = 'none';
    $('#markRow').classList.add('show');
    if (isCorrect) $('#markLearn').classList.add('suggested');
    else $('#markUnlearn').classList.add('suggested');
    $('.progress-meta .score').textContent = `✓ ${s.correct}`;
    if (state.autoSpeak) speak(item.speak, $('#speakBtn'));
  };
  input.addEventListener('keydown', e=>{ if (e.key==='Enter') { e.preventDefault(); check(); } });
  $('#checkBtn').addEventListener('click', check);
}

function markItem(item, learned){
  setStatus(item.id, learned?'mastered':'learning');
  state.session.marked++;
  state.session.index++;
  if (state.session.index >= state.session.items.length) renderSummary();
  else renderQuestion();
}

/* ══════════════════════════════════════════════════════════
   RENDER EXAM QUESTION
══════════════════════════════════════════════════════════ */
function renderExamQuestion(){
  const s = state.session;
  if (s.index >= s.items.length) return renderSummary();

  const q = s.items[s.index];
  const exam = s.examData;
  s.answered = false;

  const LETTERS = ['a','b','c'];
  let passageHtml = '';
  if (exam.sharedText) {
    let text = exam.sharedText;
    const curBlank = q.blankNum;
    text = text.replace(/\((\d+)\)/g, (m,num)=>{
      const isHL = parseInt(num) === curBlank;
      return `<span class="blank-num${isHL?' hl':''}">(${num})</span>`;
    });
    passageHtml = `<div class="exam-passage">${text}</div>`;
  } else if (q.passage) {
    passageHtml = `<div class="exam-passage">${esc(q.passage)}</div>`;
  }

  document.title = `${exam.name} · ${s.index+1}/${s.items.length}`;

  app.innerHTML = `
    <div class="session">
      <div class="session-top">
        <button class="back" id="backBtn">← Thoát</button>
        <span class="session-tag exam">${exam.name}</span>
      </div>

      <div class="exam-banner">
        <div class="exam-banner-title">${exam.subtitle}</div>
        <div class="exam-banner-sub">📖 ${exam.section} · ⏱ ${exam.duration} · ${s.items.length} Aufgaben</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-meta">
          <span class="q-count">Aufgabe ${s.index+1} / ${s.items.length}</span>
          <span class="score">✓ ${s.correct} richtig</span>
        </div>
        <div class="progress-bar"><i style="width:${(s.index/s.items.length)*100}%"></i></div>
      </div>

      <div class="study-card">
        <div class="exam-instr">${esc(exam.instructions)}</div>
        ${passageHtml}
        <div class="exam-q-num">Aufgabe ${s.index+1}</div>
        <div class="exam-q-text">${esc(q.q)}</div>
        <div class="options" id="opts"></div>
        <div id="fbArea"></div>
      </div>
    </div>
  `;

  const optsEl = $('#opts');
  q.opts.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-letter">${LETTERS[i]}</span><span class="opt-text">${esc(opt)}</span>`;
    btn.addEventListener('click', ()=>answerExam(i));
    optsEl.appendChild(btn);
  });

  $('#backBtn').addEventListener('click', confirmExit);
}

function answerExam(idx){
  const s = state.session;
  if (s.answered) return;
  s.answered = true;

  const q = s.items[s.index];
  const isCorrect = idx === q.a;
  if (isCorrect) s.correct++;

  const LETTERS = ['a','b','c'];
  const opts = $$('#opts .opt');
  opts.forEach((b,i)=>{
    b.disabled = true;
    if (i===q.a) b.classList.add('correct');
    else if (i===idx) b.classList.add('wrong');
    else b.classList.add('dimmed');
  });

  const fb = $('#fbArea');
  if (isCorrect) {
    fb.innerHTML = `<div class="fb correct">✅ Richtig!<small>${esc(q.explain||'')}</small></div>`;
  } else {
    fb.innerHTML = `<div class="fb wrong">❌ Falsch! Richtige Antwort: <b>${LETTERS[q.a]})</b> <b>${esc(q.opts[q.a])}</b><small>${esc(q.explain||'')}</small></div>`;
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = 'check-btn';
  nextBtn.style.marginTop = '12px';
  nextBtn.textContent = s.index === s.items.length-1 ? 'Ergebnis ansehen →' : 'Weiter →';
  nextBtn.addEventListener('click', ()=>{
    s.index++;
    if (s.index >= s.items.length) renderSummary();
    else renderExamQuestion();
  });
  fb.appendChild(nextBtn);

  $('.progress-meta .score').textContent = `✓ ${s.correct} richtig`;
}

/* ══════════════════════════════════════════════════════════
   SUMMARY
══════════════════════════════════════════════════════════ */
function renderSummary(){
  const s = state.session;
  const total = s.items.length;
  const correct = s.correct;
  const pct = total>0 ? Math.round(correct/total*100) : 0;
  const isExam = s.isExam;

  let emoji='🎉', title='Hoàn thành!', sub='Bạn đã hoàn thành phiên học';
  if (pct===100) {emoji='🏆'; title='Tuyệt vời!'; sub='Bạn trả lời đúng tất cả!';}
  else if (pct>=80) {emoji='🌟'; title='Rất tốt!'; sub='Bạn nắm bài rất chắc';}
  else if (pct>=50) {emoji='👍'; title='Khá tốt!'; sub='Tiếp tục luyện tập nhé';}
  else {emoji='💪'; title='Cố gắng lên!'; sub='Ôn lại và thử lần nữa';}

  let statsHtml = '';
  if (isExam) {
    statsHtml = `
      <div class="sum-stat green"><div class="lbl">Đúng</div><div class="val">${correct}/${total}</div></div>
      <div class="sum-stat gold"><div class="lbl">Tỉ lệ</div><div class="val">${pct}%</div></div>
      <div class="sum-stat amber"><div class="lbl">Cấp độ</div><div class="val">${s.examLevel}</div></div>
    `;
  } else {
    let masteredCount = 0, learningCount = 0;
    for (const it of s.items) {
      const st = getStatus(it.id);
      if (st==='mastered') masteredCount++;
      else if (st==='learning') learningCount++;
    }
    statsHtml = `
      <div class="sum-stat green"><div class="lbl">Đúng</div><div class="val">${correct}/${total}</div></div>
      <div class="sum-stat amber"><div class="lbl">Chưa thuộc</div><div class="val">${learningCount}</div></div>
      <div class="sum-stat gold"><div class="lbl">Đã thuộc</div><div class="val">${masteredCount}</div></div>
    `;
  }

  document.title = 'Kết quả · Deutsch lernen';

  app.innerHTML = `
    <div class="session">
      <div class="session-top"><button class="back" id="homeBtn">← Trang chủ</button></div>
      <div class="summary">
        <div class="sum-emoji">${emoji}</div>
        <h2 class="sum-title">${title}</h2>
        <p class="sum-sub">${isExam ? EXAMS[s.examLevel].name + ' · ' : ''}${sub}</p>
        <div class="sum-stats">${statsHtml}</div>
        <div class="sum-actions">
          <button class="home-btn" id="backHomeBtn">🏠 Trang chủ</button>
          <button class="again-btn" id="againBtn">🔄 ${isExam?'Làm lại':'Ôn lại chưa thuộc'}</button>
        </div>
      </div>
    </div>
  `;

  $('#homeBtn').addEventListener('click', renderHome);
  $('#backHomeBtn').addEventListener('click', renderHome);
  $('#againBtn').addEventListener('click', ()=>{
    if (isExam) startExam(s.examLevel);
    else if (s.cat==='__review') startReviewAll();
    else {
      state.setup = {cat:s.cat, filter:s.filter, mode:s.mode, onlyUnlearned:true};
      startSession();
    }
  });
}

function confirmExit(){
  if (state.session.index>0 && state.session.index<state.session.items.length) {
    if (!confirm('Thoát phiên học? Tiến độ đã đánh dấu vẫn được lưu.')) return;
  }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  renderHome();
}

/* ══════════════════════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e=>{
  if (state.view!=='session') return;
  const tag = (e.target.tagName||'').toLowerCase();
  if (tag==='input' || tag==='textarea') return;

  const s = state.session;
  if (s.index >= s.items.length) return;

  if (s.isExam) {
    if (!s.answered) {
      const idx = {'Digit1':0,'Digit2':1,'Digit3':2,
                   'Numpad1':0,'Numpad2':1,'Numpad3':2}[e.code];
      if (idx !== undefined) {
        e.preventDefault();
        $$('#opts .opt')[idx]?.click();
      }
    } else if (e.code==='Enter' || e.code==='Space') {
      e.preventDefault();
      $('#fbArea button')?.click();
    }
    return;
  }

  if (s.mode==='flash') {
    if (e.code==='Space' && !s.flipped) { e.preventDefault(); $('#flipBtn')?.click(); }
  } else if (s.mode==='quiz') {
    if (!s.answered) {
      const idx = {'Digit1':0,'Digit2':1,'Digit3':2,'Digit4':3,
                   'Numpad1':0,'Numpad2':1,'Numpad3':2,'Numpad4':3}[e.code];
      if (idx !== undefined) { e.preventDefault(); $$('#opts .opt')[idx]?.click(); }
    }
  }

  if (s.answered || s.flipped) {
    if (e.code==='Enter') { e.preventDefault(); $('#markLearn')?.click(); }
    if (e.code==='Backspace') { e.preventDefault(); $('#markUnlearn')?.click(); }
  }
});

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
renderHome();
</script>
