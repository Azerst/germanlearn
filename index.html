<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Tiếng Đức · VANBAC</title>
<style>
  @font-face {
    font-family: "GFF";
    src: url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
         url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
    font-weight: 400 900; font-style: normal; font-display: swap;
  }
  :root{
    --shadow-sm:0 1px 3px rgba(10,10,20,.06);
    --shadow-md:0 12px 32px -16px rgba(10,10,20,.15);
    --serif:'Times New Roman',Georgia,serif;
    --gff:"GFF","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  body[data-theme="light"]{
    --bg:#faf8f4;--bg-2:#f5f2ec;--surface:#ffffff;
    --line:#e8e3d9;--line-2:#d0c9ba;
    --ink:#0a0a14;--ink-soft:#3a3a4a;--muted:#8a8a95;
    --red:#c81e1e;--red-deep:#8b0000;--red-soft:#fce8e8;
    --green:#0a7a4a;--green-soft:#ddf5ea;
    --amber:#92500a;--amber-soft:#fdf0d5;
    --indigo:#3d3dc9;--indigo-soft:#e5e5ff;
    --gold:#c9a227;--gold-soft:#faf0d0;
    --blue:#1d4ed8;--blue-soft:#e0e8ff;
  }
  body[data-theme="dark"]{
    --bg:#0a0a14;--bg-2:#14141f;--surface:#1a1a26;
    --line:#2a2a3a;--line-2:#3a3a4a;
    --ink:#faf8f4;--ink-soft:#d0d0dc;--muted:#7a7a8a;
    --red:#ff4040;--red-deep:#cc2020;--red-soft:#2a1010;
    --green:#3fd68f;--green-soft:#0a2a1f;
    --amber:#ffb84d;--amber-soft:#2a1e0a;
    --indigo:#7a7aff;--indigo-soft:#1a1a3a;
    --gold:#ffce00;--gold-soft:#2a2000;
    --blue:#4d9aff;--blue-soft:#0a1a3a;
  }
  body[data-theme="german"]{
    --bg:#000000;--bg-2:#0a0a0a;--surface:#141414;
    --line:#2a2a2a;--line-2:#3a3a3a;
    --ink:#ffffff;--ink-soft:#e0e0e0;--muted:#888888;
    --red:#dd0000;--red-deep:#aa0000;--red-soft:#2a0000;
    --green:#ffce00;--green-soft:#2a2000;
    --amber:#ffce00;--amber-soft:#2a2000;
    --indigo:#dd0000;--indigo-soft:#2a0000;
    --gold:#ffce00;--gold-soft:#2a2000;
    --blue:#dd0000;--blue-soft:#2a0000;
  }
  body[data-theme="neon"]{
    --bg:#0a0014;--bg-2:#140020;--surface:#1a0a2a;
    --line:#3a1a5a;--line-2:#5a2a8a;
    --ink:#f0e0ff;--ink-soft:#d0b0ff;--muted:#8a6aa8;
    --red:#ff2a9a;--red-deep:#cc0077;--red-soft:#2a0020;
    --green:#00e0a0;--green-soft:#002a1f;
    --amber:#ffaa00;--amber-soft:#2a1a00;
    --indigo:#9966ff;--indigo-soft:#1a0a3a;
    --gold:#ff2a9a;--gold-soft:#2a0020;
    --blue:#00b0ff;--blue-soft:#001a2a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;
    font-family:var(--gff);font-weight:700;
    color:var(--ink);background:var(--bg);
    background-image:
      radial-gradient(900px 500px at 100% -10%, rgba(200,30,30,.06), transparent 60%),
      radial-gradient(800px 500px at 0% 100%, rgba(61,61,201,.05), transparent 55%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;
    overflow-x:hidden;letter-spacing:.02em;
    transition:background-color .3s, color .3s;
  }
  .app{max-width:600px;margin:0 auto;padding:32px 18px 100px;
    display:flex;flex-direction:column;gap:20px;
    animation:fadeUp .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .hero{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;padding:8px 0 12px}
  .hero-flag{display:inline-flex;flex-direction:column;width:38px;height:26px;border-radius:5px;overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.08);margin-bottom:20px}
  .hero-flag span{flex:1}
  .hero-flag span:nth-child(1){background:#0a0a14}
  .hero-flag span:nth-child(2){background:#dd0000}
  .hero-flag span:nth-child(3){background:#ffce00}
  .hero-title{margin:0;font-family:var(--gff);font-size:clamp(34px,9vw,56px);font-weight:900;
    text-transform:uppercase;letter-spacing:.02em;line-height:1.05;
    background:linear-gradient(90deg,#ffffff 0%,#ffbbbb 15%,#ff6666 30%,#e01e1e 45%,#a01010 55%,
      #e01e1e 65%,#ff6666 80%,#ffbbbb 90%,#ffffff 100%);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;animation:flow 6s linear infinite;
    filter:drop-shadow(0 3px 12px rgba(200,30,30,.35));position:relative;display:inline-block;padding:0 4px}
  @keyframes flow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  .hero-divider{width:44px;height:3px;
    background:linear-gradient(90deg,transparent,var(--red),transparent);border-radius:2px;margin:16px 0 14px}
  .hero-credit{margin:0;font-size:11px;letter-spacing:4px;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .hero-credit strong{color:var(--ink);font-weight:900;letter-spacing:4px}

  .xp-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
  .xp-level{display:flex;flex-direction:column;align-items:center;
    padding:0 10px 0 0;border-right:1px solid var(--line);min-width:54px}
  .xp-level-label{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
  .xp-level-num{font-size:22px;font-weight:900;
    background:linear-gradient(135deg,var(--red),var(--red-deep));-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;line-height:1}
  .xp-body{flex:1;display:flex;flex-direction:column;gap:5px}
  .xp-meta{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--muted)}
  .xp-meta b{color:var(--ink);font-weight:900}
  .xp-track{height:6px;background:var(--bg-2);border-radius:99px;overflow:hidden}
  .xp-fill{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--red),var(--red-deep));
    transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(200,30,30,.4)}
  .xp-combo{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;
    background:var(--amber-soft);font-size:11px;font-weight:900;color:var(--amber);min-width:48px;justify-content:center}
  .xp-combo.hot{background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;animation:comboPulse .6s infinite}
  @keyframes comboPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px;margin-top:8px}
  .section-label{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:700}

  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cat-card{display:flex;flex-direction:column;gap:10px;padding:18px 16px 16px;background:var(--surface);
    border:1px solid var(--line);border-radius:20px;text-align:left;cursor:pointer;font-family:inherit;
    transition:all .22s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-sm);color:var(--ink)}
  .cat-card:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .cat-card:active{transform:translateY(0) scale(.99)}
  .cat-head{display:flex;justify-content:space-between;align-items:flex-start}
  .cat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .cat-count{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .cat-name{font-size:16px;font-weight:900;color:var(--ink);margin-top:2px}
  .cat-sub{font-size:11px;font-weight:700;color:var(--muted);margin-top:-4px}
  .cat-bar{height:4px;background:var(--bg-2);border-radius:99px;overflow:hidden;margin-top:4px}
  .cat-bar>i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

  .quick-btn{display:flex;align-items:center;gap:14px;padding:17px 20px;background:var(--ink);color:var(--bg);
    border:none;border-radius:18px;font-family:inherit;font-size:14px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
    cursor:pointer;transition:all .22s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-md)}
  .quick-btn:hover{transform:translateY(-2px)}
  .quick-btn:active{transform:translateY(0) scale(.99)}
  .quick-icon{font-size:18px;line-height:1}
  .quick-label{flex:1;text-align:left}
  .quick-arrow{font-size:16px;font-weight:900;opacity:.85;transition:transform .2s}
  .quick-btn:hover .quick-arrow{transform:translateX(4px)}

  .exam-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .exam-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px 6px 14px;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;font-family:inherit;cursor:pointer;
    transition:all .22s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;box-shadow:var(--shadow-sm);color:var(--ink)}
  .exam-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
  .exam-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .exam-card:active{transform:translateY(0) scale(.98)}
  .exam-level{font-size:22px;font-weight:900;color:var(--accent);line-height:1;margin-top:2px}
  .exam-name{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin-top:2px}

  .foot{text-align:center;font-size:11px;color:var(--muted);font-weight:700;line-height:1.9;padding-top:12px}
  .foot kbd{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1.5px 7px;font-size:10.5px;
    font-family:inherit;color:var(--ink-soft);font-weight:700}

  .settings-fab{position:fixed;right:20px;bottom:20px;z-index:50;width:52px;height:52px;border-radius:50%;border:none;
    background:var(--ink);color:var(--bg);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.5);transition:all .22s cubic-bezier(.2,.8,.2,1)}
  .settings-fab:hover{transform:scale(1.08) rotate(45deg)}
  .settings-fab:active{transform:scale(.95)}

  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:98;opacity:0;pointer-events:none;
    transition:opacity .3s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .drawer-backdrop.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(340px,90vw);background:var(--bg);border-left:1px solid var(--line);
    z-index:99;padding:24px 20px;overflow-y:auto;transform:translateX(100%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:-12px 0 40px -10px rgba(0,0,0,.3)}
  .drawer.show{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .drawer-title{font-size:20px;font-weight:900;color:var(--ink)}
  .drawer-close{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
    color:var(--ink-soft);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .drawer-close:hover{background:var(--bg-2);color:var(--ink)}
  .setting-group{padding:14px 0;border-bottom:1px solid var(--line)}
  .setting-group:last-child{border-bottom:none}
  .setting-label{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px}
  .theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .theme-btn{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);cursor:pointer;transition:all .2s;
    position:relative;overflow:hidden;display:flex;flex-direction:column}
  .theme-btn:hover{transform:scale(1.05)}
  .theme-btn.active{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,30,30,.2)}
  .theme-btn::after{content:attr(data-label);position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);
    color:#fff;font-size:8px;font-weight:900;text-transform:uppercase;padding:2px 0;text-align:center;
    letter-spacing:.5px;font-family:var(--gff)}
  .theme-preview{display:flex;flex-direction:column;flex:1}
  .theme-preview>span{flex:1}
  .setting-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;cursor:pointer}
  .setting-toggle .t-name{font-size:13px;font-weight:800;color:var(--ink)}
  .setting-toggle .t-desc{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
  .t-switch{width:42px;height:24px;border-radius:12px;background:var(--line-2);position:relative;transition:all .25s;flex-shrink:0}
  .t-switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2);transition:all .25s cubic-bezier(.2,.8,.2,1)}
  .setting-toggle.on .t-switch{background:var(--green)}
  .setting-toggle.on .t-switch::after{left:21px}

  .back-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:var(--surface);color:var(--ink-soft);
    border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:700;
    cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm)}
  .back-btn:hover{border-color:var(--ink);color:var(--ink)}
  .back-btn:active{transform:scale(.97)}

  .setup-top{display:flex;align-items:center;margin-bottom:6px}
  .setup-hero{display:flex;align-items:center;gap:14px;padding:4px 0 8px}
  .setup-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .setup-titles{display:flex;flex-direction:column;gap:3px;min-width:0}
  .setup-title{font-size:22px;font-weight:900;color:var(--ink);margin:0;line-height:1.1}
  .setup-sub{font-size:12px;font-weight:700;color:var(--muted);margin:0}
  .setup-sub b{color:var(--ink);font-weight:900}

  .setup-label{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--muted);font-weight:800;margin:22px 0 10px;padding-left:2px}
  .setup-label:first-of-type{margin-top:0}
  .setup-label .count{font-size:9.5px;padding:2px 8px;border-radius:99px;background:var(--bg-2);color:var(--ink-soft);
    text-transform:none;font-weight:700}

  .mode-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mode-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px;background:var(--surface);
    border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font-family:inherit;cursor:pointer;
    transition:all .2s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-sm)}
  .mode-card:hover:not(.active){border-color:var(--line-2);transform:translateY(-1px)}
  .mode-card:active{transform:translateY(0) scale(.98)}
  .mode-card .icon{font-size:22px;line-height:1}
  .mode-card .name{font-size:12px;font-weight:900}
  .mode-card .desc{font-size:9.5px;color:var(--muted);font-weight:700}
  .mode-card.active[data-mode="flash"]{background:var(--indigo-soft);border-color:var(--indigo)}
  .mode-card.active[data-mode="quiz"]{background:var(--green-soft);border-color:var(--green)}
  .mode-card.active[data-mode="type"]{background:var(--red-soft);border-color:var(--red)}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:8px 15px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted);
    font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;
    box-shadow:var(--shadow-sm)}
  .chip:hover:not(.active){border-color:var(--ink);color:var(--ink)}
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;margin-top:16px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
  .toggle-row:hover{border-color:var(--line-2)}
  .toggle-row .label{font-size:13px;font-weight:900;color:var(--ink)}
  .toggle-row .desc{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
  .toggle-row .switch{width:42px;height:24px;border-radius:12px;background:var(--line-2);position:relative;transition:all .25s;flex-shrink:0}
  .toggle-row .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2);transition:all .25s cubic-bezier(.2,.8,.2,1)}
  .toggle-row.on .switch{background:var(--green)}
  .toggle-row.on .switch::after{left:21px}

  .start-btn{width:100%;margin-top:22px;padding:17px;border-radius:16px;border:0;
    background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;font-family:inherit;font-size:15px;font-weight:900;
    cursor:pointer;transition:all .22s cubic-bezier(.2,.8,.2,1);letter-spacing:.05em;text-transform:uppercase;
    box-shadow:0 10px 28px -12px rgba(200,30,30,.55);display:flex;align-items:center;justify-content:center;gap:8px}
  .start-btn:hover{transform:translateY(-2px)}
  .start-btn:active{transform:translateY(0) scale(.99)}

  .session{display:flex;flex-direction:column;gap:14px;animation:fadeUp .35s cubic-bezier(.2,.8,.2,1)}
  .session-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .session-tag{padding:6px 12px;border-radius:99px;font-size:10.5px;font-weight:900;letter-spacing:.08em;
    text-transform:uppercase;white-space:nowrap}
  .session-tag.flash{background:var(--indigo-soft);color:var(--indigo)}
  .session-tag.quiz{background:var(--green-soft);color:var(--green)}
  .session-tag.type{background:var(--red-soft);color:var(--red)}
  .session-tag.exam{background:var(--red-soft);color:var(--red)}

  .progress{display:flex;flex-direction:column;gap:7px}
  .progress-meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;color:var(--muted)}
  .progress-meta .q-count{font-variant-numeric:tabular-nums}
  .progress-meta .score{color:var(--green);font-weight:900}
  .progress-bar{height:5px;background:var(--bg-2);border-radius:99px;overflow:hidden}
  .progress-bar>i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--red),var(--red-deep));transition:width .4s cubic-bezier(.2,.8,.2,1)}

  .q-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;
    box-shadow:var(--shadow-sm),0 8px 32px -16px rgba(0,0,0,.1);position:relative}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .card-badges{display:flex;gap:6px;flex-wrap:wrap}
  .card-actions{margin-left:auto;display:flex;gap:6px}
  .level-badge{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
  .level-badge.A1{background:var(--green-soft);color:var(--green)}
  .level-badge.A2{background:var(--blue-soft);color:var(--blue)}
  .level-badge.B1{background:var(--amber-soft);color:var(--amber)}
  .level-badge.B2{background:var(--red-soft);color:var(--red)}
  .status-badge{padding:3px 10px;border-radius:6px;font-size:9.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
  .status-badge.new{background:var(--indigo-soft);color:var(--indigo)}
  .status-badge.learning{background:var(--amber-soft);color:var(--amber)}
  .status-badge.mastered{background:var(--green-soft);color:var(--green)}

  .speak-btn,.hint-btn{width:38px;height:38px;border-radius:50%;padding:0;background:var(--surface);border:1px solid var(--line);
    color:var(--ink-soft);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .2s;box-shadow:var(--shadow-sm)}

<body data-theme="light">
<div class="app" id="app"></div>
<canvas id="confettiCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:9999"></canvas>
<button class="settings-fab" id="settingsFab" title="Cài đặt">⚙️</button>
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ══════════════════════════════════════════════════════════
   TTS ENGINE - Phát âm chuẩn tiếng Đức
══════════════════════════════════════════════════════════ */
const TTS = {
  currentAudio: null, useGoogle: true, rate: 0.9, _timeoutId: null,

  cleanText(text) {
    return String(text).replace(/[„""«»]/g,'').replace(/[''`]/g,'').replace(/\s+/g,' ').trim();
  },

  stop() {
    if (this._timeoutId) { clearTimeout(this._timeoutId); this._timeoutId = null; }
    if (this.currentAudio) {
      try { this.currentAudio.onended = null; this.currentAudio.onerror = null;
            this.currentAudio.pause(); this.currentAudio.currentTime = 0; } catch(e){}
      this.currentAudio = null;
    }
    if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch(e){} }
    $$('.speak-btn, .speak-mini, .speak-flash, .fb-speak').forEach(b => b.classList.remove('speaking'));
  },

  speak(text, btn) {
    if (!text) return;
    this.stop();
    const cleanText = this.cleanText(text);
    if (btn) btn.classList.add('speaking');
    const useWebSpeech = () => this.speakWebSpeech(text, btn);
    if (this.useGoogle) this.tryGoogle(cleanText, useWebSpeech);
    else useWebSpeech();
  },

  tryGoogle(cleanText, fallback) {
    let audio;
    try {
      const url = 'https://translate.google.com/translate_tts?ie=UTF-8&q=' +
                  encodeURIComponent(cleanText) + '&tl=de&client=tw-ob';
      audio = new Audio();
      audio.preload = 'auto';
      audio.src = url;
      audio.playbackRate = this.rate;
      this.currentAudio = audio;
    } catch(e) { fallback(); return; }

    let done = false, started = false;
    const doFallback = () => {
      if (done) return;
      done = true;
      if (this._timeoutId) { clearTimeout(this._timeoutId); this._timeoutId = null; }
      try { audio.pause(); audio.src = ''; } catch(e){}
      if (this.currentAudio === audio) this.currentAudio = null;
      fallback();
    };
    this._timeoutId = setTimeout(() => { if (!started) doFallback(); }, 1200);
    audio.addEventListener('playing', () => {
      started = true;
      if (done) { try { audio.pause(); } catch(e){} return; }
      if (this._timeoutId) { clearTimeout(this._timeoutId); this._timeoutId = null; }
    }, { once: true });
    audio.onended = () => {
      if (this._timeoutId) { clearTimeout(this._timeoutId); this._timeoutId = null; }
      if (this.currentAudio === audio) this.currentAudio = null;
      $$('.speak-btn, .speak-mini, .speak-flash, .fb-speak').forEach(b => b.classList.remove('speaking'));
    };
    audio.onerror = doFallback;
    const p = audio.play();
    if (p && typeof p.catch === 'function') p.catch(doFallback);
  },

  speakWebSpeech(text, btn) {
    if (!('speechSynthesis' in window)) {
      showToast('⚠️ Trình duyệt không hỗ trợ phát âm');
      if (btn) btn.classList.remove('speaking');
      return;
    }
    if (!deVoice) loadVoices();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.rate = 0.85; u.pitch = 1;
    if (deVoice) u.voice = deVoice;
    if (btn) btn.classList.add('speaking');
    u.onend = () => { if (btn) btn.classList.remove('speaking'); };
    u.onerror = () => { if (btn) btn.classList.remove('speaking'); };
    try { speechSynthesis.speak(u); }
    catch(e) { if (btn) btn.classList.remove('speaking'); showToast('⚠️ Không thể phát âm'); }
  }
};

let deVoice = null;
function loadVoices(retries = 10) {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  if (!vs || vs.length === 0) { if (retries > 0) setTimeout(() => loadVoices(retries - 1), 200); return; }
  deVoice = vs.find(v => /^de(-|_)/i.test(v.lang)) || vs.find(v => /deutsch|german/i.test(v.name)) || null;
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = () => loadVoices();
  setTimeout(() => loadVoices(), 500);
  setTimeout(() => loadVoices(), 1500);
}
function speak(text, btn) { TTS.speak(text, btn); }

/* ══════════════════════════════════════════════════════════
   SOUND
══════════════════════════════════════════════════════════ */
const Sound = {
  ctx:null, enabled:true,
  init(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.enabled=false; } } if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  play(type){
    if(!this.enabled) return;
    this.init(); if(!this.ctx) return;
    if(type==='correct'){ this.tone(880,.1); setTimeout(()=>this.tone(1320,.15),70); }
    else if(type==='wrong'){ this.tone(220,.15,'sawtooth'); setTimeout(()=>this.tone(160,.25,'sawtooth'),90); }
    else if(type==='levelup'){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,.22),i*90)); }
    else if(type==='click'){ this.tone(500,.04,'sine',.06); }
    else if(type==='victory'){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>this.tone(f,.25),i*100)); }
  },
  tone(freq,dur,type='sine',vol=.12){
    if(!this.ctx) return;
    const ctx=this.ctx, osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type; osc.frequency.value=freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+dur);
  }
};

const Confetti = {
  canvas:null, ctx:null, particles:[], raf:null, enabled:true,
  init(){ if(this.canvas) return; this.canvas=document.getElementById('confettiCanvas'); this.ctx=this.canvas.getContext('2d'); this.resize(); window.addEventListener('resize',()=>this.resize()); },
  resize(){ if(!this.canvas) return; this.canvas.width=window.innerWidth; this.canvas.height=window.innerHeight; },
  burst(x,y,count=25){
    if(!this.enabled) return;
    this.init();
    const colors=['#c81e1e','#f4c542','#0a0a14','#ffffff','#ff6b6b','#0a7a4a','#3d3dc9'];
    for(let i=0;i<count;i++){
      this.particles.push({x,y, vx:(Math.random()-.5)*10, vy:Math.random()*-9-3,
        gravity:.35, life:1, decay:.012+Math.random()*.008, size:4+Math.random()*5,
        color:colors[Math.floor(Math.random()*colors.length)],
        rot:Math.random()*360, rotSpeed:(Math.random()-.5)*22});
    }
    if(!this.raf) this.animate();
  },
  animate(){
    if(!this.ctx) return;
    const ctx=this.ctx;
    ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];
      p.vy+=p.gravity; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay; p.rot+=p.rotSpeed;
      if(p.life<=0){ this.particles.splice(i,1); continue; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore();
    }
    if(this.particles.length>0) this.raf=requestAnimationFrame(()=>this.animate());
    else this.raf=null;
  },
  big(){ const cx=window.innerWidth/2, cy=window.innerHeight/3; this.burst(cx,cy,60); setTimeout(()=>this.burst(cx-150,cy+50,40),150); setTimeout(()=>this.burst(cx+150,cy+50,40),300); }
};

  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>t.classList.remove('show'),dur);
}

const ONES=['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
const TEENS=['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
function numToGerman(n){
  if(n===0)return 'null'; let r='';
  if(n>=1000){const th=Math.floor(n/1000); r+=(th===1?'ein':ONES[th])+'tausend'; n%=1000; if(!n)return r;}
  if(n>=100){const h=Math.floor(n/100); r+=(h===1?'ein':ONES[h])+'hundert'; n%=100; if(!n)return r;}
  if(n>=20){const t=Math.floor(n/10),u=n%10; if(!u)r+=TENS[t]; else r+=ONES[u]+'und'+TENS[t];}
  else if(n===1)r+='eins';
  else if(n>=2&&n<=9)r+=ONES[n];
  else if(n>=10&&n<=19)r+=TEENS[n-10];
  return r;
}
const VN_ONES=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function numToVietnamese(n){
  if(n===1000)return 'một nghìn'; if(n===0)return 'không';
  if(n<10)return VN_ONES[n];
  if(n<20){if(n===10)return 'mười';if(n===15)return 'mười lăm';return 'mười '+VN_ONES[n-10];}
  if(n<100){const t=Math.floor(n/10),u=n%10;
    if(!u)return VN_ONES[t]+' mươi';if(u===1)return VN_ONES[t]+' mươi mốt';
    if(u===5)return VN_ONES[t]+' mươi lăm';return VN_ONES[t]+' mươi '+VN_ONES[u];}
  const h=Math.floor(n/100),rest=n%100; let out=VN_ONES[h]+' trăm';
  if(!rest)return out; if(rest<10)return out+' lẻ '+VN_ONES[rest];
  if(rest<20){if(rest===10)return out+' mười';if(rest===15)return out+' mười lăm';return out+' mười '+VN_ONES[rest-10];}
  const t=Math.floor(rest/10),u=rest%10;
  if(!u)return out+' '+VN_ONES[t]+' mươi';if(u===1)return out+' '+VN_ONES[t]+' mươi mốt';
  if(u===5)return out+' '+VN_ONES[t]+' mươi lăm';return out+' '+VN_ONES[t]+' mươi '+VN_ONES[u];
}

    filters:[{key:'A1',label:'A1'},{key:'A2',label:'A2'},{key:'B1',label:'B1'},{key:'B2',label:'B2'}],
    hasDirection:false,
    items:GRAMMAR_RAW.map((g,i)=>({
      id:'g-'+i,type:'grammar',sentence:g.q,opts:g.opts,correct:g.a,
      hint:g.hint,explain:g.ex,level:g.lv,
      front:g.q.replace('___','______'),back:g.opts[g.a],
      speak:g.q.replace('___',g.opts[g.a]).replace(/[.,!?]/g,''),
    }))},
};

let PROGRESS={};
function getStatus(id){return PROGRESS[id]||'new';}
function setStatus(id,s){PROGRESS[id]=s;}
function catStats(k){
  const items=CATS[k].items;
  const m=items.filter(it=>getStatus(it.id)==='mastered').length;
  return {mastered:m,total:items.length};
}

  if(item.type === 'number'){

      return {

        frontLabel: 'Số', backLabel: 'Deutsch',
        frontSpeak: item.back, backSpeak: item.back,
        backSub: item.extra
      };
    }
    return {
      front: item.back, back: 'Số ' + item.num + ' (' + item.extra + ')',
      frontLabel: 'Deutsch', backLabel: 'Số',
      frontSpeak: item.back, backSpeak: item.back,
      backSub: ''
    };
  }
  if(item.type === 'alphabet'){
    if(direction === 'vi-de'){
      return {
        front: item.back, back: item.letter,
        frontLabel: 'Cách đọc', backLabel: 'Buchstabe',
        frontSpeak: item.letter, backSpeak: item.letter,
        backSub: item.extra
      };

    return {
      front: item.letter, back: item.back,
      frontLabel: 'Buchstabe', backLabel: 'Cách đọc',
      frontSpeak: item.letter, backSpeak: item.letter,
      backSub: item.extra
    };

  // grammar
  return {
    front: item.front, back: item.back,
    frontLabel: 'Aufgabe', backLabel: 'Đáp án',
    frontSpeak: item.speak, backSpeak: item.back,
    backSub: item.explain || ''
  };
}

function getFilteredItems(catKey,filter){

  return items;
}

/* ══════════════════════════════════════════════════════════
   SESSION
══════════════════════════════════════════════════════════ */
const SESSION_SIZE=20;

function pickSessionItems(items,onlyUnlearned){
  let pool=items;
  if(onlyUnlearned){
    pool=items.filter(it=>getStatus(it.id)!=='mastered');
    if(!pool.length)pool=items;
  }
  const unlearned=pool.filter(it=>getStatus(it.id)!=='mastered');
  const mastered=pool.filter(it=>getStatus(it.id)==='mastered');
  shuffle(unlearned); shuffle(mastered);
  const n=Math.min(SESSION_SIZE,pool.length);
  const out=[];
  for(const it of unlearned){if(out.length>=n)break;out.push(it);}
  for(const it of mastered){if(out.length>=n)break;out.push(it);}
  return shuffle(out);
}

function startSession(){
  const {cat,filter,mode,direction}=state.setup;
  const pool=getFilteredItems(cat,filter);
  const items=pickSessionItems(pool,state.setup.onlyUnlearned);
  if(!items.length){alert('Không có mục nào. Thử bỏ "Chỉ ôn chưa thuộc".');return;}

  state.session={cat,filter,mode,direction,items,index:0,correct:0,
    answered:false,flipped:false,currentOpts:null,currentCorrect:null,
    typeMode:null,isExam:false,examData:null,examLevel:null};
  state.view='session';
  renderQuestion();
}

function startReviewAll(){
  const all=[];
  for(const k of Object.keys(CATS)){
    for(const it of CATS[k].items){
      if(getStatus(it.id)!=='mastered')all.push({...it});
    }
  }
  if(!all.length){alert('Không có mục nào để ôn.');return;}
  shuffle(all);
  const items=all.slice(0,SESSION_SIZE);
  state.session={cat:'__review',filter:null,mode:'flash',direction:'de-vi',items,index:0,correct:0,
    answered:false,flipped:false,currentOpts:null,currentCorrect:null,
    typeMode:null,isExam:false,examData:null,examLevel:null};
  state.view='session';
  renderQuestion();
}

function startExam(level){
  const exam=EXAMS[level];
  const questions=shuffle([...exam.questions]);
  state.session={cat:'__exam',filter:level,mode:'exam',direction:'de-vi',items:questions,index:0,correct:0,
    answered:false,flipped:false,currentOpts:null,currentCorrect:null,
    typeMode:null,isExam:true,examData:exam,examLevel:level};
  state.view='session';
  renderExamQuestion();
}

function renderQuestion(){
  const s=state.session;
  if(s.index>=s.items.length)return renderSummary();

  s.answered=false; s.flipped=false; s.currentOpts=null; s.currentCorrect=null;
  const item=s.items[s.index];
  const status=getStatus(item.id);
  const statusLabel=status==='mastered'?'Đã thuộc':status==='learning'?'Đang học':'Mới';
  const level=item.level||'';
  const modeLabel=s.mode==='flash'?'Thẻ nhớ':s.mode==='quiz'?'Trắc nghiệm':'Gõ đáp án';
  const catName=s.cat==='__review'?'Ôn tập':CATS[s.cat].name;
  document.title=`${modeLabel} · ${s.index+1}/${s.items.length}`;

  let bodyHtml='';
  if(s.mode==='flash')bodyHtml=renderFlashBody(item,s.direction);
  else if(s.mode==='quiz'){
    const q=buildQuiz(item,s.direction);
    s.currentOpts=q.options;
    s.currentCorrect=q.correctIndex;
    bodyHtml=renderQuizBody(item,q);
  } else bodyHtml=renderTypeBody(item,s.direction);

  app.innerHTML=`
    <div class="session">
      <div class="session-top">
        <button class="back-btn" id="backBtn">← Thoát</button>
        <span class="session-tag ${s.mode}">${catName} · ${modeLabel}</span>
      </div>
      <div class="progress">
        <div class="progress-meta">
          <span class="q-count">Câu ${s.index+1} / ${s.items.length}</span>
          <span class="score">✓ ${s.correct}</span>
        </div>
        <div class="progress-bar"><i style="width:${(s.index/s.items.length)*100}%"></i></div>
      </div>
      <div class="q-card">
        <div class="card-head">
          <div class="card-badges">
            ${level?`<span class="level-badge ${level}">${level}</span>`:''}
            <span class="status-badge ${status}">${statusLabel}</span>
          </div>
          <div class="card-actions">
            ${item.type==='grammar'?`<button class="hint-btn" id="hintBtn" title="Cách làm">?</button>`:''}
            <button class="speak-btn" id="speakBtn" title="Nghe phát âm chuẩn">🔊</button>
          </div>
        </div>
        <div id="hintArea"></div>
        ${bodyHtml}
        <div id="fbArea"></div>
        <div class="mark-row" id="markRow">
          <button class="mark-btn unlearn" id="markUnlearn">😕 Chưa thuộc</button>
          <button class="mark-btn learn" id="markLearn">✅ Thuộc rồi</button>
        </div>
      </div>
    </div>
  `;

  $('#backBtn').addEventListener('click', confirmExit);

  // Speaker chính: luôn phát âm tiếng Đức chuẩn
  const mainSpeak = item.type==='vocab' ? item.front
                   : item.type==='number' ? item.back
                   : item.type==='alphabet' ? item.letter
                   : item.speak;
  $('#speakBtn').addEventListener('click', e=>{ e.stopPropagation(); speak(mainSpeak, e.currentTarget); });

  const hintBtnEl=$('#hintBtn');
  if(hintBtnEl&&item.hint){
    hintBtnEl.addEventListener('click', e=>{
      e.stopPropagation();
      const area=$('#hintArea');
      if(area.innerHTML.trim()){area.innerHTML='';hintBtnEl.classList.remove('active');}
      else{
        area.innerHTML=`<div class="hint-box"><span class="label">💡 Cách làm</span>${esc(item.hint)}</div>`;
        hintBtnEl.classList.add('active');
      }
    });
  }

  if(s.mode==='flash')wireFlash(item);
  else if(s.mode==='quiz')wireQuiz(item);
  else wireType(item);

  $('#markUnlearn').addEventListener('click',()=>markItem(item,false));
  $('#markLearn').addEventListener('click',()=>markItem(item,true));

  if(s.mode==='type')setTimeout(()=>$('#typeInput')?.focus(),80);
}

  const isBackLetter = item.type === 'alphabet' && c.back === item.letter;

          <button class="speak-flash" data-speak="${esc(c.frontSpeak)}" title="Nghe phát âm" onclick="event.stopPropagation(); speak(this.dataset.speak, this)">🔊</button>
          <span class="flash-label">${c.frontLabel}</span>
          <div class="${isFrontLetter ? 'flash-main letter' : 'flash-main'}">${esc(c.front)}</div>
          <div class="flash-sub">Nhấn thẻ để xem đáp án</div>
        </div>
        <div class="flash-face flash-back">
          <button class="speak-flash" data-speak="${esc(c.backSpeak)}" title="Nghe phát âm" onclick="event.stopPropagation(); speak(this.dataset.speak, this)">🔊</button>
          <span class="flash-label">${c.backLabel}</span>
          <div class="${isBackLetter ? 'flash-main letter' : 'flash-main'}">${esc(c.back)}</div>
          <div class="flash-sub">${esc(c.backSub)}</div>
        </div>
      </div>

function wireFlash(item){
  const s=state.session;
  const card=$('#flashcard');
  const flip=()=>{
    if(s.flipped)return;
    s.flipped=true;
    card.classList.add('flipped');
    $('#flipHint').textContent='Đánh dấu để chuyển thẻ tiếp theo';
    $('#markRow').classList.add('show');
  };
  card.addEventListener('click',flip);
  $('#flipBtn').addEventListener('click',e=>{e.stopPropagation();flip();});
}

function buildQuiz(item, direction){
  let questionText, correctAnswer, pool, speakText, optionsAreGerman;
  if(item.type==='vocab'){
    if(direction === 'vi-de'){
      questionText=`Từ <b>"${esc(item.back)}"</b> trong tiếng Đức là?`;
      correctAnswer=item.front;
      pool=CATS.vocab.items.filter(x=>x.id!==item.id).map(x=>x.front);
      speakText=item.front; optionsAreGerman=true;
    } else {
      questionText=`Từ <b>"${esc(item.front)}"</b> có nghĩa là gì?`;
      correctAnswer=item.back;
      pool=CATS.vocab.items.filter(x=>x.id!==item.id).map(x=>x.back);
      speakText=item.front; optionsAreGerman=false;
    }
  } else if(item.type==='number'){
    if(direction === 'vi-de'){
      questionText=`Số <b>${item.num}</b> trong tiếng Đức là?`;
      correctAnswer=item.back;
      pool=buildNumberDistractors(item.num);
      speakText=item.back; optionsAreGerman=true;
    } else {
      questionText=`Từ <b>"${esc(item.back)}"</b> là số nào?`;
      correctAnswer=String(item.num);
      pool=buildNumberDistractorsNum(item.num);
      speakText=item.back; optionsAreGerman=false;
    }
  } else if(item.type==='alphabet'){
    const others=CATS.alphabet.items.filter(x=>x.id!==item.id);
    if(direction === 'vi-de'){
      questionText=`Cách đọc <b>"${esc(item.back)}"</b> là chữ cái nào?`;
      correctAnswer=item.letter;
      pool=others.map(x=>x.letter);
      speakText=item.letter; optionsAreGerman=true;
    } else {
      questionText=`Chữ <b style="font-size:1.2em">${esc(item.letter)}</b> đọc là gì?`;
      correctAnswer=item.back;
      pool=others.map(x=>x.back);
      speakText=item.letter; optionsAreGerman=true;
    }
  } else {
    questionText=item.sentence.replace('___','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    correctAnswer=item.opts[item.correct];
    pool=item.opts.filter((_,i)=>i!==item.correct);
    speakText=item.speak; optionsAreGerman=true;
  }
  const opts=makeOpts(correctAnswer,pool,4);
  return {questionText,options:opts,correctIndex:opts.indexOf(String(correctAnswer)),speakText,optionsAreGerman};
}

function buildNumberDistractors(n){
  const set=new Set([numToGerman(n)]);
  const cands=[];
  for(const o of [-1,1,-2,2,-10,10,-20,20]){const c=n+o; if(c>=0&&c<=1000)cands.push(numToGerman(c));}
  for(let i=0;i<25;i++)cands.push(numToGerman(rand(0,1000)));
  shuffle(cands);
  for(const c of cands){if(set.size>=4)break;set.add(c);}
  return [...set];
}
function buildNumberDistractorsNum(n){
  const set=new Set([String(n)]);
  const cands=[];
  for(const o of [-1,1,-2,2,-10,10,-20,20]){const c=n+o; if(c>=0&&c<=1000)cands.push(String(c));}
  for(let i=0;i<25;i++)cands.push(String(rand(0,1000)));
  shuffle(cands);
  for(const c of cands){if(set.size>=4)break;set.add(c);}
  return [...set];
}
function makeOpts(correct,pool,n=4){
  const set=new Set([String(correct)]);
  for(const p of shuffle([...pool])){if(set.size>=n)break;set.add(String(p));}
  return shuffle([...set]);
}

function renderQuizBody(item,q){
  const LETTERS=['A','B','C','D'];
  const optsHtml=q.options.map((o,i)=>{
    const isGerman = q.optionsAreGerman && TTS.cleanText && /^[\p{L}\s\-.,;:!?'"()]+$/u.test(o) && !/^(der|die|das|ein|eine)\s/i.test('') ;
    // Cứ hiển thị loa cho option tiếng Đức (không phải số thuần)
    const showSpeak = q.optionsAreGerman && !/^\d+$/.test(String(o).trim());
    return `
      <button class="opt" data-idx="${i}">
        <span class="opt-letter">${LETTERS[i]}</span>
        <span class="opt-text">${esc(o)}</span>
        ${showSpeak?`<span class="speak-mini" data-speak="${esc(o)}" title="Nghe" onclick="event.stopPropagation(); speak(this.dataset.speak, this)">🔊</span>`:''}
      </button>

  }).join('');

function wireQuiz(item){
  const s=state.session;
  $$('#opts .opt').forEach((btn,i)=>{
    btn.addEventListener('click',(e)=>{
      if(e.target.classList.contains('speak-mini'))return;
      if(s.answered)return;
      s.answered=true;
      const correctIdx=s.currentCorrect;
      const isCorrect=i===correctIdx;
      if(isCorrect){s.correct++;s.combo++;addXP(10);}
      else{s.combo=0;}
      if(state.settings.sound)Sound.play(isCorrect?'correct':'wrong');
      if(isCorrect&&s.combo>=3&&state.settings.confetti){
        const rect=btn.getBoundingClientRect();
        Confetti.burst(rect.left+rect.width/2, rect.top+rect.height/2, 15);
      }
      $$('#opts .opt').forEach((b,j)=>{
        b.disabled=true;
        if(j===correctIdx)b.classList.add('correct');
        else if(j===i)b.classList.add('wrong');
        else b.classList.add('dimmed');
      });
      const fb=$('#fbArea');
      const LETTERS=['A','B','C','D'];
      let extra='';
      const correctAnswer=s.currentOpts[correctIdx];
      const speakAnswer = s.direction==='vi-de'
        ? (item.type==='vocab'?item.front:item.type==='number'?item.back:item.type==='alphabet'?item.letter:correctAnswer)
        : (item.type==='number'?item.back:item.type==='alphabet'?item.letter:item.type==='vocab'?item.front:correctAnswer);
      if(item.type==='grammar'&&item.explain)extra=`<small>${esc(item.explain)}</small>`;
      else if(item.type==='alphabet')extra=`<small>${esc(item.extra||'')}</small>`;
      else if(item.type==='number')extra=`<small>${item.num} = ${esc(item.back)} · ${esc(item.extra||'')}</small>`;
      else if(item.type==='vocab')extra=`<small>${esc(item.front)} = ${esc(item.back)}</small>`;
      const speakBtn = `<button class="fb-speak" data-speak="${esc(speakAnswer)}" onclick="event.stopPropagation(); speak(this.dataset.speak, this)">🔊</button>`;
      if(isCorrect)fb.innerHTML=`<div class="fb correct">✅ Chính xác! <b>+10 XP</b>${speakBtn}${extra}</div>`;
      else fb.innerHTML=`<div class="fb wrong">❌ Sai! Đáp án: <b>${LETTERS[correctIdx]}</b> — <b>${esc(correctAnswer)}</b>${speakBtn}${extra}</div>`;
      $('#markRow').classList.add('show');
      if(isCorrect)$('#markLearn').classList.add('suggested');
      else $('#markUnlearn').classList.add('suggested');
      $('.progress-meta .score').textContent=`✓ ${s.correct}`;
    });
  });
}

function renderTypeBody(item, direction){
  let questionText,placeholder,inputMode;
  if(item.type==='vocab'){
    if(direction==='vi-de'){
      questionText=`Viết từ tiếng Đức cho: <b>"${esc(item.back)}"</b>`;
      placeholder='VD: der Apfel…'; inputMode='de';
    } else {
      questionText=`Nghĩa tiếng Việt của: <b>"${esc(item.front)}"</b>`;
      placeholder='Nhập nghĩa…'; inputMode='vi';
    }
  } else if(item.type==='number'){
    if(direction==='vi-de'){
      questionText=`Viết số <b>${item.num}</b> bằng tiếng Đức`;
      placeholder='VD: eins…'; inputMode='de';
    } else {
      questionText=`Số <b>"${esc(item.back)}"</b> là số nào?`;
      placeholder='Nhập số…'; inputMode='number';
    }
  } else if(item.type==='alphabet'){
    if(direction==='vi-de'){
      questionText=`Cách đọc <b>"${esc(item.back)}"</b> là chữ cái nào?`;
      placeholder='VD: A…'; inputMode='de';
    } else {
      questionText=`Chữ <b style="font-size:1.2em">${esc(item.letter)}</b> đọc là gì?`;
      placeholder='VD: ah…'; inputMode='de';
    }
  } else {
    questionText=item.sentence.replace('___','<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    placeholder='Điền từ còn thiếu…'; inputMode='de';
  }
  state.session.typeMode=inputMode;
  return `
    <div class="q-text">${questionText}</div>
    <input type="text" id="typeInput" class="type-input" placeholder="${placeholder}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="check-btn" id="checkBtn">✓ Kiểm tra</button>
  `;
}

function normalize(s){
  return String(s).toLowerCase().trim()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[.,!?;]/g,'').replace(/\s+/g,' ');
}

function wireType(item){
  const s=state.session;
  const input=$('#typeInput');
  const check=()=>{
    if(s.answered)return;
    const val=input.value.trim();
    if(!val){input.focus();return;}
    s.answered=true; input.disabled=true;
    let correctAnswer,isCorrect;
    const mode=s.typeMode;
    const direction=s.direction;

    if(item.type==='vocab'){
      correctAnswer = mode==='de' ? item.front : item.back;
      if(mode==='de'){
        const norm=normalize(val),full=normalize(correctAnswer);
        const noArt=full.replace(/^(der|die|das)\s+/,'');
        isCorrect = norm===full || norm===noArt;
      } else {
        isCorrect = normalize(val)===normalize(correctAnswer);
      }
    } else if(item.type==='number'){
      if(mode==='de'){
        correctAnswer=item.back;
        isCorrect = normalize(val)===normalize(correctAnswer);
      } else {
        correctAnswer=String(item.num);
        isCorrect = val.replace(/\D/g,'')===correctAnswer;
      }
    } else if(item.type==='alphabet'){
      // Chấp nhận cả chữ cái hoặc phiên âm
      const nv = normalize(val);
      const letterNorm = normalize(item.letter);
      const pNorm = normalize(item.back);
      isCorrect = (nv===letterNorm || nv===pNorm);
      correctAnswer = direction==='vi-de' ? item.letter : item.back;
    } else {
      correctAnswer=item.opts[item.correct];
      isCorrect = normalize(val)===normalize(correctAnswer);
    }

    if(isCorrect){s.correct++;s.combo++;addXP(15);} else {s.combo=0;}
    if(state.settings.sound)Sound.play(isCorrect?'correct':'wrong');
    input.classList.add(isCorrect?'correct':'wrong');
    const fb=$('#fbArea');
    let extra='';
    if(item.type==='grammar'&&item.explain)extra=`<small>${esc(item.explain)}</small>`;
    else if(item.type==='alphabet')extra=`<small>${esc(item.extra||'')}</small>`;
    else if(item.type==='number')extra=`<small>${item.num} = ${esc(item.back)} · ${esc(item.extra||'')}</small>`;
    else if(item.type==='vocab')extra=`<small>${esc(item.front)} = ${esc(item.back)}</small>`;
    const speakAnswer = item.type==='vocab'?item.front
                       : item.type==='number'?item.back
                       : item.type==='alphabet'?item.letter
                       : correctAnswer;
    const speakBtn = `<button class="fb-speak" data-speak="${esc(speakAnswer)}" onclick="event.stopPropagation(); speak(this.dataset.speak, this)">🔊</button>`;
    if(isCorrect)fb.innerHTML=`<div class="fb correct">✅ Chính xác! <b>+15 XP</b>${speakBtn}${extra}</div>`;
    else fb.innerHTML=`<div class="fb wrong">❌ Chưa đúng! Đáp án: <b>${esc(correctAnswer)}</b>${speakBtn}${extra}</div>`;
    $('#checkBtn').style.display='none';
    $('#markRow').classList.add('show');
    if(isCorrect)$('#markLearn').classList.add('suggested');
    else $('#markUnlearn').classList.add('suggested');
    $('.progress-meta .score').textContent=`✓ ${s.correct}`;
  };
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
  $('#checkBtn').addEventListener('click',check);
}

function markItem(item,learned){
  setStatus(item.id,learned?'mastered':'learning');
  state.session.index++;
  if(state.session.index>=state.session.items.length)renderSummary();
  else renderQuestion();
}

function renderExamQuestion(){
  const s=state.session;
  if(s.index>=s.items.length)return renderSummary();
  const q=s.items[s.index];
  const exam=s.examData;
  s.answered=false;
  const LETTERS=['a','b','c'];
  let passageHtml='';
  if(exam.sharedText){
    let text=exam.sharedText;
    const curBlank=q.blankNum;
    text=text.replace(/\((\d+)\)/g,(m,num)=>{
      const isHL=parseInt(num)===curBlank;
      return `<span class="blank-num${isHL?' hl':''}">(${num})</span>`;
    });
    passageHtml=`<div class="exam-passage">${text}</div>`;
  } else if(q.passage){
    passageHtml=`<div class="exam-passage">${esc(q.passage)}</div>`;
  }
  document.title=`${exam.name} · ${s.index+1}/${s.items.length}`;
  app.innerHTML=`
    <div class="session">
      <div class="session-top">
        <button class="back-btn" id="backBtn">← Thoát</button>
        <span class="session-tag exam">${exam.name}</span>
      </div>
      <div class="exam-banner">
        <div class="exam-banner-title">${exam.subtitle}</div>
        <div class="exam-banner-sub">📖 ${exam.section} · ⏱ ${exam.duration} · ${s.items.length} Aufgaben</div>
      </div>
      <div class="progress">
        <div class="progress-meta">
          <span class="q-count">Aufgabe ${s.index+1} / ${s.items.length}</span>
          <span class="score">✓ ${s.correct} richtig</span>
        </div>
        <div class="progress-bar"><i style="width:${(s.index/s.items.length)*100}%"></i></div>
      </div>
      <div class="q-card">
        <div class="exam-instr">${esc(exam.instructions)}</div>
        ${passageHtml}
        <div class="exam-q-num">Aufgabe ${s.index+1}</div>
        <div class="exam-q-text">${esc(q.q)}</div>
        <div class="options" id="opts"></div>
        <div id="fbArea"></div>
      </div>
    </div>
  `;
  const optsEl=$('#opts');
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.innerHTML=`<span class="opt-letter">${LETTERS[i]}</span><span class="opt-text">${esc(opt)}</span>`;
    btn.addEventListener('click',()=>answerExam(i));
    optsEl.appendChild(btn);
  });
  $('#backBtn').addEventListener('click',confirmExit);
}

function answerExam(idx){
  const s=state.session;
  if(s.answered)return;
  s.answered=true;
  const q=s.items[s.index];
  const isCorrect=idx===q.a;
  if(isCorrect){s.correct++;addXP(10);}
  if(state.settings.sound)Sound.play(isCorrect?'correct':'wrong');
  const LETTERS=['a','b','c'];
  const opts=$$('#opts .opt');
  opts.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a)b.classList.add('correct');
    else if(i===idx)b.classList.add('wrong');
    else b.classList.add('dimmed');
  });
  const fb=$('#fbArea');
  const correctAns=q.opts[q.a];
  const speakBtn = `<button class="fb-speak" data-speak="${esc(correctAns)}" onclick="event.stopPropagation(); speak(this.dataset.speak, this)">🔊</button>`;
  if(isCorrect)fb.innerHTML=`<div class="fb correct">✅ Richtig!${speakBtn}<small>${esc(q.explain||'')}</small></div>`;
  else fb.innerHTML=`<div class="fb wrong">❌ Falsch! Richtige Antwort: <b>${LETTERS[q.a]})</b> <b>${esc(correctAns)}</b>${speakBtn}<small>${esc(q.explain||'')}</small></div>`;
  const nextBtn=document.createElement('button');
  nextBtn.className='btn-next';
  nextBtn.textContent=s.index===s.items.length-1?'Ergebnis ansehen →':'Weiter →';
  nextBtn.addEventListener('click',()=>{
    s.index++;
    if(s.index>=s.items.length)renderSummary();
    else renderExamQuestion();
  });
  fb.appendChild(nextBtn);
  $('.progress-meta .score').textContent=`✓ ${s.correct} richtig`;
}

/* ══════════════════════════════════════════════════════════
   SUMMARY
══════════════════════════════════════════════════════════ */
function renderSummary(){
  const s=state.session;
  const total=s.items.length;
  const correct=s.correct;
  const pct=total>0?Math.round(correct/total*100):0;
  const isExam=s.isExam;
  let emoji='🎉',title='Hoàn thành!',sub='Bạn đã hoàn thành phiên học';
  if(pct===100){emoji='🏆';title='Tuyệt vời!';sub='Bạn trả lời đúng tất cả!';}
  else if(pct>=80){emoji='🌟';title='Rất tốt!';sub='Bạn nắm bài rất chắc';}
  else if(pct>=50){emoji='👍';title='Khá tốt!';sub='Tiếp tục luyện tập nhé';}
  else {emoji='💪';title='Cố gắng lên!';sub='Ôn lại và thử lần nữa';}
  if(pct>=80&&state.settings.sound)Sound.play('victory');
  if(pct>=80&&state.settings.confetti)Confetti.big();
  let statsHtml='';
  if(isExam){
    statsHtml=`
      <div class="sum-stat green"><div class="lbl">Đúng</div><div class="val">${correct}/${total}</div></div>
      <div class="sum-stat red"><div class="lbl">Tỉ lệ</div><div class="val">${pct}%</div></div>
      <div class="sum-stat amber"><div class="lbl">Cấp</div><div class="val">${s.examLevel}</div></div>
    `;
  } else {
    let masteredCount=0,learningCount=0;
    for(const it of s.items){
      const st=getStatus(it.id);
      if(st==='mastered')masteredCount++;
      else if(st==='learning')learningCount++;
    }
    statsHtml=`
      <div class="sum-stat green"><div class="lbl">Đúng</div><div class="val">${correct}/${total}</div></div>
      <div class="sum-stat amber"><div class="lbl">Chưa thuộc</div><div class="val">${learningCount}</div></div>
      <div class="sum-stat red"><div class="lbl">Đã thuộc</div><div class="val">${masteredCount}</div></div>
    `;
  }
  document.title='Kết quả · Học Tiếng Đức';
  app.innerHTML=`
    <div class="session">
      <div class="session-top"><button class="back-btn" id="homeBtn">← Trang chủ</button></div>
      <div class="summary">
        <div class="sum-emoji">${emoji}</div>
        <h2 class="sum-title">${title}</h2>
        <p class="sum-sub">${isExam?EXAMS[s.examLevel].name+' · ':''}${sub}</p>
        <div class="sum-stats">${statsHtml}</div>
        <div class="sum-actions">
          <button class="home-btn" id="backHomeBtn">🏠 Trang chủ</button>
          <button class="again-btn" id="againBtn">🔄 ${isExam?'Làm lại':'Ôn tiếp'}</button>
        </div>
      </div>
    </div>
  `;
  $('#homeBtn').addEventListener('click',renderHome);
  $('#backHomeBtn').addEventListener('click',renderHome);
  $('#againBtn').addEventListener('click',()=>{
    if(isExam)startExam(s.examLevel);
    else if(s.cat==='__review')startReviewAll();
    else{
      state.setup={cat:s.cat,filter:s.filter,mode:s.mode,onlyUnlearned:true,direction:s.direction};
      startSession();
    }
  });
}

function confirmExit(){
  if(state.session.index>0&&state.session.index<state.session.items.length){
    if(!confirm('Thoát phiên học? Tiến độ sẽ không được lưu.'))return;
  }
  TTS.stop();
  renderHome();
}

document.addEventListener('keydown',e=>{
  if(state.view!=='session')return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea')return;
  const s=state.session;
  if(s.index>=s.items.length)return;
  if(s.isExam){
    if(!s.answered){
      const idx={'Digit1':0,'Digit2':1,'Digit3':2,'Numpad1':0,'Numpad2':1,'Numpad3':2}[e.code];
      if(idx!==undefined){e.preventDefault();$$('#opts .opt')[idx]?.click();}
    } else if(e.code==='Enter'||e.code==='Space'){
      e.preventDefault();
      $('#fbArea button.btn-next')?.click();
    }
    return;
  }
  if(s.mode==='flash'){
    if(e.code==='Space'&&!s.flipped){e.preventDefault();$('#flipBtn')?.click();}
  } else if(s.mode==='quiz'){
    if(!s.answered){
      const idx={'Digit1':0,'Digit2':1,'Digit3':2,'Digit4':3,'Numpad1':0,'Numpad2':1,'Numpad3':2,'Numpad4':3}[e.code];
      if(idx!==undefined){e.preventDefault();$$('#opts .opt')[idx]?.click();}
    }
  }
  if(s.answered||s.flipped){
    if(e.code==='Enter'){e.preventDefault();$('#markLearn')?.click();}
    if(e.code==='Backspace'){e.preventDefault();$('#markUnlearn')?.click();}
  }
});

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
document.body.dataset.theme=state.settings.theme;
renderHome();
</script>
