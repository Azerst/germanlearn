<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Tiếng Đức · VANBAC</title>
<style>
  @font-face{font-family:"GFF";src:url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");font-weight:400 900;font-style:normal;font-display:swap}

  :root{
    --shadow-sm:0 1px 3px rgba(10,10,20,.06);
    --shadow-md:0 12px 32px -16px rgba(10,10,20,.15);
    --serif:'Times New Roman',Georgia,serif;
    --gff:"GFF","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  body[data-theme="light"]{
    --bg:#faf8f4;--bg-2:#f5f2ec;--surface:#ffffff;
    --line:#e8e3d9;--line-2:#d0c9ba;
    --ink:#0a0a14;--ink-soft:#3a3a4a;--muted:#8a8a95;
    --red:#c81e1e;--red-deep:#8b0000;--red-soft:#fce8e8;
    --green:#0a7a4a;--green-soft:#ddf5ea;
    --amber:#92500a;--amber-soft:#fdf0d5;
    --indigo:#3d3dc9;--indigo-soft:#e5e5ff;
    --gold:#c9a227;--gold-soft:#faf0d0;
    --blue:#1d4ed8;--blue-soft:#e0e8ff;
    --purple:#7c3aed;--purple-soft:#f3e8ff;
  }
  body[data-theme="dark"]{
    --bg:#0a0a14;--bg-2:#14141f;--surface:#1a1a26;
    --line:#2a2a3a;--line-2:#3a3a4a;
    --ink:#faf8f4;--ink-soft:#d0d0dc;--muted:#7a7a8a;
    --red:#ff4040;--red-deep:#cc2020;--red-soft:#2a1010;
    --green:#3fd68f;--green-soft:#0a2a1f;
    --amber:#ffb84d;--amber-soft:#2a1e0a;
    --indigo:#7a7aff;--indigo-soft:#1a1a3a;
    --gold:#ffce00;--gold-soft:#2a2000;
    --blue:#4d9aff;--blue-soft:#0a1a3a;
    --purple:#c084fc;--purple-soft:#1a0a2a;
  }
  body[data-theme="german"]{
    --bg:#000;--bg-2:#0a0a0a;--surface:#141414;
    --line:#2a2a2a;--line-2:#3a3a3a;
    --ink:#fff;--ink-soft:#e0e0e0;--muted:#888;
    --red:#dd0000;--red-deep:#aa0000;--red-soft:#2a0000;
    --green:#ffce00;--green-soft:#2a2000;
    --amber:#ffce00;--amber-soft:#2a2000;
    --indigo:#dd0000;--indigo-soft:#2a0000;
    --gold:#ffce00;--gold-soft:#2a2000;
    --blue:#dd0000;--blue-soft:#2a0000;
    --purple:#dd0000;--purple-soft:#2a0000;
  }
  body[data-theme="neon"]{
    --bg:#0a0014;--bg-2:#140020;--surface:#1a0a2a;
    --line:#3a1a5a;--line-2:#5a2a8a;
    --ink:#f0e0ff;--ink-soft:#d0b0ff;--muted:#8a6aa8;
    --red:#ff2a9a;--red-deep:#cc0077;--red-soft:#2a0020;
    --green:#00e0a0;--green-soft:#002a1f;
    --amber:#ffaa00;--amber-soft:#2a1a00;
    --indigo:#9966ff;--indigo-soft:#1a0a3a;
    --gold:#ff2a9a;--gold-soft:#2a0020;
    --blue:#00b0ff;--blue-soft:#001a2a;
    --purple:#c084fc;--purple-soft:#1a002a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;min-height:100vh;font-family:var(--gff);font-weight:700;
    color:var(--ink);background:var(--bg);
    background-image:
      radial-gradient(900px 500px at 100% -10%, rgba(200,30,30,.06), transparent 60%),
      radial-gradient(800px 500px at 0% 100%, rgba(61,61,201,.05), transparent 55%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;
    overflow-x:hidden;letter-spacing:.02em;transition:background-color .3s, color .3s}
  .app{max-width:640px;margin:0 auto;padding:20px 16px 100px;
    display:flex;flex-direction:column;gap:16px;animation:fadeUp .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ═══ HERO (HOME + AUTH) ═══ */
  .hero{display:flex;flex-direction:column;align-items:center;gap:0;
    text-align:center;padding:4px 0 4px}
  .hero-flag{display:inline-flex;flex-direction:column;width:42px;height:28px;border-radius:5px;
    overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.08);
    margin-bottom:18px}
  .hero-flag span{flex:1}
  .hero-flag span:nth-child(1){background:#0a0a14}
  .hero-flag span:nth-child(2){background:#dd0000}
  .hero-flag span:nth-child(3){background:#ffce00}
  .hero-title{margin:0;font-family:var(--gff);font-size:clamp(30px,7.5vw,46px);
    font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;
    background:linear-gradient(90deg,#fff 0%,#ffbbbb 15%,#ff6666 30%,#e01e1e 45%,#a01010 55%,#e01e1e 65%,#ff6666 80%,#ffbbbb 90%,#fff 100%);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:flow 6s linear infinite;
    filter:drop-shadow(0 3px 12px rgba(200,30,30,.35))}
  @keyframes flow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  .hero-divider{width:44px;height:3px;
    background:linear-gradient(90deg,transparent,var(--red),transparent);
    border-radius:2px;margin:14px 0 12px}
  .hero-credit{margin:0;font-size:10.5px;letter-spacing:4px;
    text-transform:uppercase;font-weight:700;color:var(--muted)}
  .hero-credit strong{color:var(--ink);font-weight:900}

  /* Auth */
  .auth-wrap{max-width:420px;margin:0 auto;width:100%}
  .auth-card{background:var(--surface);border:1px solid var(--line);
    border-radius:22px;padding:24px 22px;
    box-shadow:var(--shadow-sm),var(--shadow-md);margin-top:6px}
  .auth-tabs{display:flex;gap:5px;background:var(--bg-2);padding:5px;
    border-radius:12px;margin-bottom:20px}
  .auth-tabs button{flex:1;padding:11px;border:none;background:transparent;
    color:var(--muted);font-family:inherit;font-size:13px;font-weight:800;
    border-radius:8px;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.5px}
  .auth-tabs button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
  .auth-field{margin-bottom:13px}
  .auth-field label{display:block;font-size:10.5px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:6px}
  .auth-input{width:100%;padding:14px 16px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--bg-2);color:var(--ink);
    font-family:inherit;font-size:15px;font-weight:700;transition:all .2s}
  .auth-input::placeholder{color:var(--muted);font-weight:600}
  .auth-input:focus{outline:none;border-color:var(--red);background:var(--surface);
    box-shadow:0 0 0 4px rgba(200,30,30,.08)}
  .auth-btn{width:100%;margin-top:8px;padding:15px;border-radius:14px;border:none;
    background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;
    font-family:inherit;font-size:14px;font-weight:900;cursor:pointer;
    letter-spacing:.06em;text-transform:uppercase;transition:all .2s;
    box-shadow:0 8px 24px -10px rgba(200,30,30,.5)}
  .auth-btn:hover{transform:translateY(-1px)}
  .auth-err{padding:11px 14px;border-radius:10px;margin-bottom:12px;
    background:var(--red-soft);color:var(--red);border:1px solid var(--red);
    font-size:12.5px;font-weight:700;display:none}
  .auth-err.show{display:block}
  .demo-hint{margin-top:14px;padding:11px 14px;border-radius:10px;
    background:var(--bg-2);border:1px dashed var(--line-2);
    font-size:11.5px;color:var(--muted);line-height:1.6;font-weight:600;text-align:center}
  .demo-hint b{color:var(--ink);font-weight:900}

  /* Header (for friends/chat/profile) */
  .app-header{display:flex;align-items:center;gap:12px;padding:2px 0}
  .user-avatar{width:44px;height:44px;border-radius:50%;display:flex;
    align-items:center;justify-content:center;color:#fff;font-weight:900;
    font-size:17px;flex-shrink:0;cursor:pointer;transition:all .2s;
    box-shadow:0 3px 10px rgba(0,0,0,.15)}
  .user-avatar:hover{transform:scale(1.05)}
  .user-info{flex:1;min-width:0}
  .user-hello{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--muted);font-weight:800;margin-bottom:2px}
  .user-name{font-size:15px;font-weight:900;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .streak-pill{display:flex;align-items:center;gap:5px;
    padding:7px 12px;border-radius:99px;
    background:linear-gradient(135deg,var(--amber-soft),var(--red-soft));
    border:1px solid rgba(245,158,11,.4);
    font-size:12px;font-weight:900;color:var(--amber);
    cursor:pointer;transition:all .2s}
  .streak-pill:hover{transform:scale(1.05)}
  .streak-pill .fire{font-size:14px}

  /* Bottom nav */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:var(--surface);border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;
    box-shadow:0 -8px 24px -8px rgba(0,0,0,.1);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
  .nav-inner{display:flex;gap:2px;max-width:640px;width:100%;justify-content:space-around}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 4px;border:none;background:transparent;color:var(--muted);
    font-family:inherit;font-size:9.5px;font-weight:800;cursor:pointer;
    border-radius:10px;transition:all .2s;text-transform:uppercase;
    letter-spacing:.4px;position:relative}
  .nav-btn .nav-icon{font-size:20px;line-height:1;transition:transform .2s}
  .nav-btn:hover{color:var(--ink)}
  .nav-btn.active{color:var(--red)}
  .nav-btn.active .nav-icon{transform:scale(1.15)}
  .nav-btn .badge{position:absolute;top:3px;right:calc(50% - 18px);
    min-width:16px;height:16px;padding:0 4px;border-radius:8px;
    background:var(--red);color:#fff;font-size:9px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--surface)}

  /* Common */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;
    padding:0 4px;margin-top:6px}
  .section-label{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--muted);font-weight:800}
  .back-btn{display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;background:var(--surface);color:var(--ink-soft);
    border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:12.5px;font-weight:700;
    cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm)}
  .back-btn:hover{border-color:var(--ink);color:var(--ink)}

  /* Home */
  .xp-bar{display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
  .xp-level{display:flex;flex-direction:column;align-items:center;
    padding:0 10px 0 0;border-right:1px solid var(--line);min-width:54px}
  .xp-level-label{font-size:8.5px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
  .xp-level-num{font-size:22px;font-weight:900;
    background:linear-gradient(135deg,var(--red),var(--red-deep));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;line-height:1}
  .xp-body{flex:1;display:flex;flex-direction:column;gap:5px}
  .xp-meta{display:flex;justify-content:space-between;
    font-size:10.5px;font-weight:700;color:var(--muted)}
  .xp-meta b{color:var(--ink);font-weight:900}
  .xp-track{height:6px;background:var(--bg-2);border-radius:99px;overflow:hidden}
  .xp-fill{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--red),var(--red-deep));
    transition:width .5s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 0 12px rgba(200,30,30,.4)}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cat-card{display:flex;flex-direction:column;gap:10px;
    padding:18px 16px 16px;background:var(--surface);
    border:1px solid var(--line);border-radius:20px;
    text-align:left;cursor:pointer;font-family:inherit;
    transition:all .22s;box-shadow:var(--shadow-sm);color:var(--ink)}
  .cat-card:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .cat-head{display:flex;justify-content:space-between;align-items:flex-start}
  .cat-icon{width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .cat-count{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .cat-name{font-size:16px;font-weight:900;color:var(--ink);margin-top:2px}
  .cat-sub{font-size:11px;font-weight:700;color:var(--muted);margin-top:-4px}
  .cat-bar{height:4px;background:var(--bg-2);border-radius:99px;overflow:hidden;margin-top:4px}
  .cat-bar>i{display:block;height:100%;border-radius:99px;transition:width .5s}
  .quick-btn{display:flex;align-items:center;gap:14px;
    padding:17px 20px;background:var(--ink);color:var(--bg);
    border:none;border-radius:18px;font-family:inherit;
    font-size:14px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
    cursor:pointer;transition:all .22s;box-shadow:var(--shadow-md)}
  .quick-btn:hover{transform:translateY(-2px)}
  .quick-icon{font-size:18px}
  .quick-label{flex:1;text-align:left}
  .quick-arrow{font-size:16px;opacity:.85;transition:transform .2s}

  /* Friends */
  .tabs-mini{display:flex;gap:5px;background:var(--bg-2);padding:5px;border-radius:12px}
  .tabs-mini button{flex:1;padding:10px;border:none;background:transparent;
    color:var(--muted);font-family:inherit;font-size:11.5px;font-weight:800;
    border-radius:8px;cursor:pointer;transition:all .2s;text-transform:uppercase;
    letter-spacing:.4px;position:relative}
  .tabs-mini button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
  .tabs-mini button .t-badge{display:inline-block;margin-left:4px;
    padding:1px 6px;border-radius:99px;background:var(--red);color:#fff;
    font-size:9px;font-weight:900}
  .search-bar{display:flex;align-items:center;gap:8px;
    padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .search-bar .search-icon{font-size:14px;color:var(--muted)}
  .search-bar input{flex:1;border:none;background:transparent;color:var(--ink);
    font-family:inherit;font-size:13.5px;font-weight:700;outline:none}
  .search-bar input::placeholder{color:var(--muted);font-weight:600}
  .friend-list{display:flex;flex-direction:column;gap:8px}
  .friend-card{display:flex;align-items:center;gap:12px;
    padding:13px 14px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;transition:all .2s;cursor:pointer}
  .friend-card:hover{border-color:var(--ink);transform:translateX(2px)}
  .friend-avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-weight:900;font-size:16px;position:relative}
  .online-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;
    border-radius:50%;background:var(--green);border:2px solid var(--surface)}
  .friend-body{flex:1;min-width:0}
  .friend-name{font-size:14px;font-weight:900;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .friend-sub{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;
    display:flex;align-items:center;gap:5px}
  .friend-actions{display:flex;gap:6px;flex-shrink:0}
  .friend-btn{padding:7px 11px;border-radius:9px;border:none;
    font-family:inherit;font-size:11px;font-weight:900;cursor:pointer;
    transition:all .2s;text-transform:uppercase;letter-spacing:.3px}
  .friend-btn.accept{background:var(--green);color:#fff}
  .friend-btn.decline{background:var(--bg-2);color:var(--muted);border:1px solid var(--line)}
  .friend-btn.add{background:linear-gradient(135deg,var(--red),var(--red-deep));
    color:#fff;box-shadow:0 4px 12px -4px rgba(200,30,30,.4)}
  .friend-btn.chat{background:var(--indigo-soft);color:var(--indigo);border:1px solid var(--indigo)}
  .friend-btn.pending{background:var(--amber-soft);color:var(--amber);
    border:1px solid var(--amber);cursor:default}
  .empty-state{text-align:center;padding:48px 20px;
    display:flex;flex-direction:column;align-items:center;gap:10px}
  .empty-state .e-icon{font-size:52px;line-height:1;opacity:.4}
  .empty-state .e-title{font-size:15px;font-weight:900;color:var(--ink)}
  .empty-state .e-text{font-size:12.5px;color:var(--muted);font-weight:700;
    max-width:280px;line-height:1.5}

  /* Chat */
  .chat-item{display:flex;align-items:center;gap:12px;
    padding:12px 14px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;cursor:pointer;
    transition:all .2s;position:relative}
  .chat-item:hover{border-color:var(--ink);transform:translateX(2px)}
  .chat-item.unread{background:var(--indigo-soft);border-color:var(--indigo)}
  .chat-body{flex:1;min-width:0}
  .chat-name{font-size:14px;font-weight:900;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-preview{font-size:11.5px;color:var(--muted);font-weight:700;
    margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-item.unread .chat-preview{color:var(--indigo);font-weight:800}
  .chat-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
  .chat-time{font-size:10px;color:var(--muted);font-weight:700}
  .chat-badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;
    background:var(--red);color:#fff;font-size:10px;font-weight:900;
    display:flex;align-items:center;justify-content:center}
  .chat-room{display:flex;flex-direction:column;gap:12px;animation:fadeUp .35s}
  .chat-room-header{display:flex;align-items:center;gap:10px;
    padding:10px 12px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow-sm);position:sticky;top:12px;z-index:10}
  .chat-room-header .friend-name{font-size:14px;font-weight:900}
  .online-info{font-size:10.5px;color:var(--green);font-weight:800;margin-top:1px}
  .chat-messages{display:flex;flex-direction:column;gap:8px;
    padding:4px 0 6px;min-height:calc(100vh - 420px);max-height:calc(100vh - 340px);
    overflow-y:auto;flex:1}
  .chat-messages::-webkit-scrollbar{width:5px}
  .chat-messages::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
  .msg{max-width:78%;padding:10px 14px;border-radius:16px;
    font-size:13.5px;font-weight:600;line-height:1.45;word-wrap:break-word;
    position:relative;animation:msgIn .25s}
  @keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .msg.from-me{align-self:flex-end;background:linear-gradient(135deg,var(--red),var(--red-deep));
    color:#fff;border-bottom-right-radius:5px}
  .msg.from-them{align-self:flex-start;background:var(--surface);
    border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:5px}
  .msg-time{font-size:9.5px;font-weight:700;opacity:.65;margin-top:3px;display:block}
  .msg.from-them .msg-time{color:var(--muted)}
  .chat-input-bar{display:flex;gap:8px;padding:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow-sm);position:sticky;bottom:0;z-index:5}
  .chat-input-bar input{flex:1;padding:11px 14px;border-radius:10px;
    border:1.5px solid var(--line);background:var(--bg-2);color:var(--ink);
    font-family:inherit;font-size:13.5px;font-weight:600;outline:none}
  .chat-input-bar input:focus{border-color:var(--red);background:var(--surface)}
  .chat-send{width:44px;height:44px;border-radius:50%;border:none;flex-shrink:0;
    background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;
    font-size:16px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:all .2s;
    box-shadow:0 4px 14px -4px rgba(200,30,30,.5)}

  /* Profile */
  .profile-hero{display:flex;flex-direction:column;align-items:center;
    padding:24px 20px;background:var(--surface);
    border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow-sm);text-align:center;position:relative;overflow:hidden}
  .profile-hero::before{content:"";position:absolute;top:0;left:0;right:0;
    height:80px;background:linear-gradient(135deg,var(--red),var(--red-deep));opacity:.9}
  .profile-avatar{width:88px;height:88px;border-radius:50%;z-index:1;
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-weight:900;font-size:32px;margin-top:16px;
    border:4px solid var(--surface);box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .profile-name{font-size:22px;font-weight:900;color:var(--ink);margin-top:12px}
  .profile-username{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
  .profile-joined{font-size:11px;color:var(--muted);font-weight:700;margin-top:6px}
  .profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px;width:100%}
  .profile-stat{background:var(--bg-2);border:1px solid var(--line);
    border-radius:12px;padding:12px 8px;text-align:center}
  .profile-stat .v{font-size:18px;font-weight:900;color:var(--ink)}
  .profile-stat .l{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--muted);font-weight:800;margin-top:2px}
  .profile-stat.fire .v{color:var(--amber)}
  .profile-stat.level .v{color:var(--red)}
  .streak-calendar{padding:18px 16px;background:var(--surface);
    border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm)}
  .streak-cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .streak-cal-title{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--muted);font-weight:800}
  .streak-cal-count{font-size:13px;font-weight:900;color:var(--amber);
    display:flex;align-items:center;gap:4px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-day{aspect-ratio:1;border-radius:10px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:var(--bg-2);border:1px solid var(--line);
    font-size:9px;font-weight:800;color:var(--muted);position:relative}
  .cal-day .dow{font-size:8.5px;letter-spacing:.5px;text-transform:uppercase}
  .cal-day .num{font-size:12px;font-weight:900}
  .cal-day.today{border-color:var(--red);border-width:2px;background:var(--surface);color:var(--red)}
  .cal-day.checked{background:linear-gradient(135deg,var(--amber-soft),var(--red-soft));
    border-color:var(--amber);color:var(--amber)}
  .cal-day.checked::after{content:"✓";position:absolute;bottom:2px;font-size:9px;font-weight:900}
  .settings-list{display:flex;flex-direction:column;gap:8px}
  .settings-item{display:flex;align-items:center;gap:12px;
    padding:14px 16px;background:var(--surface);border:1px solid var(--line);
    border-radius:13px;cursor:pointer;transition:all .2s;
    font-family:inherit;font-size:13px;font-weight:800;color:var(--ink);
    text-align:left;width:100%}
  .settings-item:hover{border-color:var(--ink);transform:translateX(2px)}
  .settings-item .s-icon{font-size:18px;flex-shrink:0}
  .settings-item .s-label{flex:1}
  .settings-item .s-value{font-size:11.5px;color:var(--muted);font-weight:700}
  .settings-item.danger{color:var(--red);border-color:var(--red)}
  .settings-item.danger:hover{background:var(--red-soft)}

  /* Setup/Session */
  .setup-top{display:flex;align-items:center;margin-bottom:6px}
  .setup-hero{display:flex;align-items:center;gap:14px;padding:4px 0 8px}
  .setup-icon{width:52px;height:52px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .setup-title{font-size:22px;font-weight:900;color:var(--ink);margin:0}
  .setup-sub{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 0}
  .setup-sub b{color:var(--ink);font-weight:900}
  .setup-label{display:flex;align-items:center;gap:8px;
    font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--muted);font-weight:800;margin:20px 0 10px;padding-left:2px}
  .setup-label .count{font-size:9.5px;padding:2px 8px;border-radius:99px;
    background:var(--bg-2);color:var(--ink-soft);text-transform:none;font-weight:700}
  .mode-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mode-card{display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:16px 6px;background:var(--surface);
    border:1.5px solid var(--line);border-radius:14px;
    color:var(--ink);font-family:inherit;cursor:pointer;
    transition:all .2s;box-shadow:var(--shadow-sm)}
  .mode-card .icon{font-size:22px;line-height:1}
  .mode-card .name{font-size:12px;font-weight:900}
  .mode-card .desc{font-size:9.5px;color:var(--muted);font-weight:700}
  .mode-card.active[data-mode="flash"]{background:var(--indigo-soft);border-color:var(--indigo)}
  .mode-card.active[data-mode="quiz"]{background:var(--green-soft);border-color:var(--green)}
  .mode-card.active[data-mode="type"]{background:var(--red-soft);border-color:var(--red)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:8px 14px;border-radius:10px;background:var(--surface);
    border:1px solid var(--line);color:var(--muted);font-family:inherit;
    font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;margin-top:14px;cursor:pointer}
  .toggle-row .label{font-size:13px;font-weight:900;color:var(--ink)}
  .toggle-row .desc{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
  .toggle-row .switch{width:42px;height:24px;border-radius:12px;
    background:var(--line-2);position:relative;transition:all .25s;flex-shrink:0}
  .toggle-row .switch::after{content:"";position:absolute;top:3px;left:3px;
    width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2);transition:all .25s}
  .toggle-row.on .switch{background:var(--green)}
  .toggle-row.on .switch::after{left:21px}
  .start-btn{width:100%;margin-top:20px;padding:17px;border-radius:16px;border:0;
    background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;
    font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;
    letter-spacing:.05em;text-transform:uppercase;
    box-shadow:0 10px 28px -12px rgba(200,30,30,.55)}
  .session{display:flex;flex-direction:column;gap:14px;animation:fadeUp .35s}
  .session-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .session-tag{padding:6px 12px;border-radius:99px;
    font-size:10.5px;font-weight:900;letter-spacing:.08em;
    text-transform:uppercase;white-space:nowrap}
  .session-tag.flash{background:var(--indigo-soft);color:var(--indigo)}
  .session-tag.quiz{background:var(--green-soft);color:var(--green)}
  .session-tag.type{background:var(--red-soft);color:var(--red)}
  .progress{display:flex;flex-direction:column;gap:7px}
  .progress-meta{display:flex;justify-content:space-between;align-items:center;
    font-size:11.5px;font-weight:700;color:var(--muted)}
  .progress-meta .score{color:var(--green);font-weight:900}
  .progress-bar{height:5px;background:var(--bg-2);border-radius:99px;overflow:hidden}
  .progress-bar>i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--red),var(--red-deep));transition:width .4s}
  .q-card{background:var(--surface);border:1px solid var(--line);
    border-radius:22px;padding:22px 20px;
    box-shadow:var(--shadow-sm),0 8px 32px -16px rgba(0,0,0,.1)}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .card-badges{display:flex;gap:6px;flex-wrap:wrap}
  .card-actions{margin-left:auto;display:flex;gap:6px}
  .level-badge{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:900;
    letter-spacing:.06em;text-transform:uppercase}
  .level-badge.A1{background:var(--green-soft);color:var(--green)}
  .level-badge.A2{background:var(--blue-soft);color:var(--blue)}
  .level-badge.B1{background:var(--amber-soft);color:var(--amber)}
  .level-badge.B2{background:var(--red-soft);color:var(--red)}
  .status-badge{padding:3px 10px;border-radius:6px;font-size:9.5px;font-weight:900;
    letter-spacing:.06em;text-transform:uppercase}
  .status-badge.new{background:var(--indigo-soft);color:var(--indigo)}
  .status-badge.learning{background:var(--amber-soft);color:var(--amber)}
  .status-badge.mastered{background:var(--green-soft);color:var(--green)}
  .speak-btn,.hint-btn{width:38px;height:38px;border-radius:50%;padding:0;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink-soft);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .2s}
  .hint-btn{font-family:var(--serif);font-weight:900}
  .speak-btn:hover{border-color:var(--red);color:var(--red);transform:scale(1.08)}
  .speak-btn.speaking{background:var(--red);border-color:var(--red);color:#fff;
    animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,30,30,.4)}
    70%{box-shadow:0 0 0 12px rgba(200,30,30,0)}
    100%{box-shadow:0 0 0 0 rgba(200,30,30,0)}}
  .flash-scene{perspective:1600px;margin:4px 0 12px}
  .flashcard{position:relative;width:100%;height:230px;cursor:pointer;
    transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
    transition:transform .65s cubic-bezier(.4,.2,.2,1)}
  .flashcard.flipped{transform:rotateY(180deg)}
  .flash-face{position:absolute;inset:0;backface-visibility:hidden;
    -webkit-backface-visibility:hidden;border-radius:18px;padding:26px 22px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;overflow:hidden;border:1px solid var(--line)}
  .flash-front{background:linear-gradient(160deg,var(--surface),var(--bg-2))}
  .flash-back{background:linear-gradient(160deg,#2a0a0a,#0a0a14);
    transform:rotateY(180deg);border-color:rgba(255,255,255,.1);color:#faf8f4}
  .flash-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--muted);font-weight:700}
  .flash-back .flash-label{color:rgba(255,180,180,.7)}
  .flash-main{font-size:clamp(24px,6.5vw,34px);font-weight:900;line-height:1.15;
    word-break:break-word;max-width:100%}
  .flash-main.letter{font-size:clamp(72px,22vw,110px);letter-spacing:2px}
  .flash-sub{font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.5}
  .flash-back .flash-sub{color:rgba(255,180,180,.75)}
  .speak-flash{position:absolute;top:12px;left:14px;z-index:5;
    width:36px;height:36px;border-radius:50%;padding:0;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink-soft);font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .2s}
  .speak-flash:hover{background:var(--red-soft);border-color:var(--red);color:var(--red)}
  .flash-back .speak-flash{background:rgba(255,255,255,.1);
    border-color:rgba(255,255,255,.2);color:#fff}
  .flip-hint{font-size:11.5px;color:var(--muted);text-align:center;
    font-weight:700;margin-bottom:10px}
  .flip-btn{width:100%;padding:13px;border-radius:13px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink);font-family:inherit;font-size:13px;font-weight:900;
    cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.05em}
  .options{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;align-items:center;gap:11px;padding:14px 16px;
    background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
    color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;
    text-align:left;cursor:pointer;transition:all .18s;animation:optIn .3s backwards}
  .opt:nth-child(1){animation-delay:.03s}.opt:nth-child(2){animation-delay:.07s}
  .opt:nth-child(3){animation-delay:.11s}.opt:nth-child(4){animation-delay:.15s}
  @keyframes optIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  .opt:hover:not(:disabled){border-color:var(--ink);background:var(--bg-2);transform:translateX(2px)}
  .opt-letter{width:30px;height:30px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-2);color:var(--ink-soft);font-weight:900;font-size:13px}
  .opt-text{flex:1;word-break:break-word;line-height:1.35;min-width:0}
  .opt.correct{background:var(--green-soft);border-color:var(--green)}
  .opt.correct .opt-letter{background:var(--green);color:#fff}
  .opt.correct .opt-text{color:var(--green);font-weight:900}
  .opt.wrong{background:var(--red-soft);border-color:var(--red)}
  .opt.wrong .opt-letter{background:var(--red);color:#fff}
  .opt.wrong .opt-text{color:var(--red);font-weight:900}
  .opt.dimmed{opacity:.25;pointer-events:none}
  .speak-mini{width:26px;height:26px;border-radius:50%;padding:0;flex-shrink:0;
    background:var(--bg-2);border:1px solid var(--line);color:var(--muted);
    font-size:12px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:all .18s;opacity:.7}
  .speak-mini:hover{background:var(--red-soft);border-color:var(--red);color:var(--red);opacity:1}
  .q-text{font-size:clamp(15px,4.2vw,19px);font-weight:900;line-height:1.5;
    margin:0 0 18px;color:var(--ink)}
  .q-text b{color:var(--red);font-weight:900}
  .q-text .blank{display:inline-block;min-width:52px;border-bottom:2px dashed var(--red);color:var(--red)}
  .hint-box{margin:0 0 16px;padding:13px 15px;
    background:var(--amber-soft);border:1px solid var(--amber);
    border-radius:12px;font-size:12.5px;font-weight:700;line-height:1.6;color:var(--amber)}
  .hint-box .label{display:block;font-size:9.5px;letter-spacing:1.8px;
    text-transform:uppercase;color:var(--amber);font-weight:900;margin-bottom:6px}
  .type-input{width:100%;padding:16px 18px;border-radius:14px;
    border:2px solid var(--line);background:var(--bg-2);color:var(--ink);
    font-family:inherit;font-size:16px;font-weight:700;transition:all .2s;margin-bottom:11px}
  .type-input:focus{outline:none;border-color:var(--red);background:var(--surface);
    box-shadow:0 0 0 4px rgba(200,30,30,.08)}
  .type-input.correct{border-color:var(--green);background:var(--green-soft);color:var(--green)}
  .type-input.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .check-btn{width:100%;padding:15px;border-radius:14px;border:none;
    background:var(--green);color:#fff;font-family:inherit;
    font-size:13.5px;font-weight:900;cursor:pointer;
    letter-spacing:.06em;text-transform:uppercase;
    box-shadow:0 8px 20px -10px rgba(10,122,74,.5)}
  .btn-next{width:100%;margin-top:14px;padding:14px;border-radius:13px;border:none;
    background:var(--ink);color:var(--bg);font-family:inherit;
    font-size:13.5px;font-weight:900;cursor:pointer;
    letter-spacing:.06em;text-transform:uppercase}
  .fb{margin-top:14px;padding:13px 16px;border-radius:12px;
    font-size:12.5px;font-weight:700;line-height:1.55}
  .fb.correct{background:var(--green-soft);color:var(--green);border:1px solid var(--green)}
  .fb.wrong{background:var(--red-soft);color:var(--red);border:1px solid var(--red)}
  .fb small{display:block;margin-top:6px;font-size:11.5px;opacity:.92;
    font-weight:700;line-height:1.6}
  .fb small b{color:var(--ink);font-weight:900}
  .fb-speak{display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;margin-left:6px;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
    color:inherit;cursor:pointer;vertical-align:middle;font-size:12px}
  .mark-row{display:none;gap:8px;margin-top:16px}
  .mark-row.show{display:flex}
  .mark-btn{flex:1;padding:15px 10px;border-radius:14px;
    font-family:inherit;font-size:12.5px;font-weight:900;cursor:pointer;
    transition:all .2s;display:flex;align-items:center;
    justify-content:center;gap:6px;text-transform:uppercase;letter-spacing:.04em}
  .mark-btn.unlearn{background:var(--amber-soft);border:1.5px solid var(--amber);color:var(--amber)}
  .mark-btn.unlearn.suggested{box-shadow:0 0 0 3px rgba(146,80,10,.15)}
  .mark-btn.learn{background:var(--green-soft);border:1.5px solid var(--green);color:var(--green)}
  .mark-btn.learn.suggested{box-shadow:0 0 0 3px rgba(10,122,74,.15)}

  /* Summary */
  .summary{text-align:center;padding:36px 24px;background:var(--surface);
    border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-sm),var(--shadow-md)}
  .sum-emoji{font-size:54px;line-height:1;margin-bottom:14px}
  .sum-title{font-size:24px;font-weight:900;margin:0 0 6px;color:var(--ink)}
  .sum-sub{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:24px;line-height:1.5}
  .sum-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;
    margin-bottom:16px;text-align:left}
  .sum-stat{background:var(--bg-2);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
  .sum-stat .lbl{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--muted);font-weight:700;margin-bottom:4px}
  .sum-stat .val{font-size:20px;font-weight:900;color:var(--ink)}
  .sum-stat.green .val{color:var(--green)}
  .sum-stat.red .val{color:var(--red)}
  .sum-stat.amber .val{color:var(--amber)}
  .sum-actions{display:flex;gap:9px}
  .sum-actions button{flex:1;padding:14px;border-radius:13px;
    border:1px solid var(--line);font-family:inherit;
    font-size:12.5px;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
  .sum-actions .home-btn{background:var(--surface);color:var(--ink-soft)}
  .sum-actions .again-btn{background:linear-gradient(135deg,var(--red),var(--red-deep));
    color:#fff;border-color:var(--red)}

  /* Modal / Toast / Drawer */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;
    display:none;align-items:center;justify-content:center;padding:20px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface);border-radius:24px;padding:32px 24px;
    max-width:380px;width:100%;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);animation:modalScale .4s}
  @keyframes modalScale{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-emoji{font-size:64px;line-height:1;margin-bottom:12px;animation:bounce .8s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .modal-title{font-size:22px;font-weight:900;margin:0 0 8px;color:var(--ink)}
  .modal-text{font-size:13.5px;color:var(--muted);font-weight:700;line-height:1.6;margin-bottom:22px}
  .modal-streak{font-size:40px;font-weight:900;
    background:linear-gradient(135deg,var(--amber),var(--red));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;line-height:1;margin:8px 0 4px}
  .modal-btn{width:100%;padding:14px;border-radius:13px;border:none;
    background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;
    font-family:inherit;font-size:14px;font-weight:900;cursor:pointer;
    letter-spacing:.06em;text-transform:uppercase;
    box-shadow:0 8px 20px -8px rgba(200,30,30,.5)}
  .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-120%);
    padding:13px 22px;border-radius:14px;background:var(--ink);color:var(--bg);
    font-family:inherit;font-size:13px;font-weight:900;
    box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:300;
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
    display:flex;align-items:center;gap:8px;max-width:90vw}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);
    z-index:98;opacity:0;pointer-events:none;transition:opacity .3s}
  .drawer-backdrop.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(340px,90vw);

<script>
/* ══════════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════════ */
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date().toISOString().split('T')[0];
const yesterdayStr = () => new Date(Date.now()-86400000).toISOString().split('T')[0];
const now = () => Date.now();

/* ══════════════════════════════════════════════════════════
   STORE
══════════════════════════════════════════════════════════ */
const KEYS = {
  users:'deutsch_users_v2', current:'deutsch_current_v2',
  friendships:'deutsch_friendships_v2', messages:'deutsch_messages_v2',
  mutual:'deutsch_mutual_v2', learning:'deutsch_learning_v2', settings:'deutsch_settings_v2',
};
let STORE = { users:{}, current:null, friendships:{}, messages:{}, mutual:{}, learning:{}, settings:{} };

function loadStore(){
  try {
    STORE.users = JSON.parse(localStorage.getItem(KEYS.users)) || {};
    STORE.current = localStorage.getItem(KEYS.current) || null;
    STORE.friendships = JSON.parse(localStorage.getItem(KEYS.friendships)) || {};
    STORE.messages = JSON.parse(localStorage.getItem(KEYS.messages)) || {};
    STORE.mutual = JSON.parse(localStorage.getItem(KEYS.mutual)) || {};
    STORE.learning = JSON.parse(localStorage.getItem(KEYS.learning)) || {};
    STORE.settings = JSON.parse(localStorage.getItem(KEYS.settings)) || {};
  } catch(e){ console.warn(e); }
  seedDemoUsers();
}
function saveStore(){
  try {
    localStorage.setItem(KEYS.users, JSON.stringify(STORE.users));
    if (STORE.current) localStorage.setItem(KEYS.current, STORE.current);
    else localStorage.removeItem(KEYS.current);
    localStorage.setItem(KEYS.friendships, JSON.stringify(STORE.friendships));
    localStorage.setItem(KEYS.messages, JSON.stringify(STORE.messages));
    localStorage.setItem(KEYS.mutual, JSON.stringify(STORE.mutual));
    localStorage.setItem(KEYS.learning, JSON.stringify(STORE.learning));
    localStorage.setItem(KEYS.settings, JSON.stringify(STORE.settings));
  } catch(e){ console.warn(e); }
}
function hashPass(s){
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h = h & h; }
  return 'h' + Math.abs(h);
}
function seedDemoUsers(){
  const demo = [
    {username:'anna', display:'Anna', password:'1234'},
    {username:'max', display:'Max', password:'1234'},
    {username:'lisa', display:'Lisa', password:'1234'},
  ];
  let changed = false;
  demo.forEach(d => {
    if (!STORE.users[d.username]) {
      STORE.users[d.username] = {
        username:d.username, display:d.display, password:hashPass(d.password),
        createdAt:now(), streak:0, lastLoginDate:null, totalXP:0, level:1, totalCorrect:0
      };
      changed = true;
    }
  });
  if (changed) saveStore();
}
function ensureGuest(){
  if (!STORE.users['__guest__']) {
    STORE.users['__guest__'] = {
      username:'__guest__', display:'Khách', isGuest:true,
      createdAt: now(), streak:0, lastLoginDate:null, totalXP:0, level:1, totalCorrect:0
    };
    saveStore();
  }
}

/* ══════════════════════════════════════════════════════════
   CURRENT USER
══════════════════════════════════════════════════════════ */
function isLoggedIn(){ return !!(STORE.current && STORE.users[STORE.current]); }
function currentId(){ return STORE.current || '__guest__'; }
function getCurrentUser(){
  const id = currentId();
  if (!STORE.users[id]) ensureGuest();
  return STORE.users[id];
}

/* ══════════════════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════════════════ */
function registerUser(username, display, password){
  username = username.trim().toLowerCase();
  if (!username || username.length < 3) return {ok:false, err:'Tên đăng nhập phải có ít nhất 3 ký tự'};
  if (!/^[a-z0-9_]+$/.test(username)) return {ok:false, err:'Chỉ dùng chữ thường, số và dấu gạch dưới'};
  if (STORE.users[username]) return {ok:false, err:'Tên đăng nhập đã tồn tại'};
  if (password.length < 4) return {ok:false, err:'Mật khẩu phải có ít nhất 4 ký tự'};
  if (!display.trim()) return {ok:false, err:'Vui lòng nhập tên hiển thị'};
  STORE.users[username] = {
    username, display:display.trim(), password:hashPass(password),
    createdAt:now(), streak:0, lastLoginDate:null, totalXP:0, level:1, totalCorrect:0
  };
  saveStore();
  return {ok:true};
}
function loginUser(username, password){
  username = username.trim().toLowerCase();
  const u = STORE.users[username];
  if (!u) return {ok:false, err:'Tài khoản không tồn tại'};
  if (u.password !== hashPass(password)) return {ok:false, err:'Mật khẩu không đúng'};
  STORE.current = username;
  const streakInfo = updateDailyStreak(u);
  saveStore();
  return {ok:true, streakInfo};
}
function logout(){
  STORE.current = null;
  saveStore();
  state.view = 'home';
  render();
}

/* ══════════════════════════════════════════════════════════
   DAILY STREAK
══════════════════════════════════════════════════════════ */
function updateDailyStreak(user){
  const today = todayStr();
  const yest = yesterdayStr();
  if (user.lastLoginDate === today) return { changed:false, streak:user.streak };
  let newStreak;
  if (!user.lastLoginDate) newStreak = 1;
  else if (user.lastLoginDate === yest) newStreak = (user.streak || 0) + 1;
  else newStreak = 1;
  user.streak = newStreak;
  user.lastLoginDate = today;
  if (!user.isGuest) {
    const friends = getFriends(user.username);
    friends.forEach(f => updateMutualStreak(user.username, f.username));
  }
  return { changed:true, streak:newStreak };
}
function updateMutualStreak(u1, u2){
  const key = [u1, u2].sort().join('|');
  const data = STORE.mutual[key] || { streak:0, lastDate:null };
  const today = todayStr();
  const yest = yesterdayStr();
  const ua = STORE.users[u1], ub = STORE.users[u2];
  if (!ua || !ub) return data;
  if (ua.lastLoginDate === today && ub.lastLoginDate === today) {
    if (data.lastDate === today) {}
    else if (data.lastDate === yest) data.streak++;
    else data.streak = 1;
    data.lastDate = today;
    STORE.mutual[key] = data;
    saveStore();
  }
  return data;
}
function getMutualStreak(u1, u2){
  return STORE.mutual[[u1, u2].sort().join('|')] || { streak:0, lastDate:null };
}

/* ══════════════════════════════════════════════════════════
   FRIENDS
══════════════════════════════════════════════════════════ */
function getFriendships(username){ return STORE.friendships[username] || {}; }
function getFriends(username){
  const map = getFriendships(username);
  return Object.keys(map).filter(k => map[k].status === 'accepted')
    .map(k => ({ ...STORE.users[k], username:k })).filter(u => u.username);
}
function getPendingRequests(username){
  const map = getFriendships(username);
  return Object.keys(map).filter(k => map[k].status === 'pending' && map[k].direction === 'received')
    .map(k => ({ ...STORE.users[k], username:k })).filter(u => u.username);
}
function getSentRequests(username){
  const map = getFriendships(username);
  return Object.keys(map).filter(k => map[k].status === 'pending' && map[k].direction === 'sent')
    .map(k => ({ ...STORE.users[k], username:k })).filter(u => u.username);
}
function sendFriendRequest(from, to){
  if (from === to) return {ok:false, err:'Không thể kết bạn với chính mình'};
  if (!STORE.users[to]) return {ok:false, err:'Người dùng không tồn tại'};
  if (!STORE.friendships[from]) STORE.friendships[from] = {};
  if (!STORE.friendships[to]) STORE.friendships[to] = {};
  if (STORE.friendships[from][to]) return {ok:false, err:'Đã có lời mời hoặc đã là bạn'};
  STORE.friendships[from][to] = { status:'pending', direction:'sent', since:now() };
  STORE.friendships[to][from] = { status:'pending', direction:'received', since:now() };
  saveStore();
  return {ok:true};
}
function acceptFriendRequest(user, friend){
  if (!STORE.friendships[user] || !STORE.friendships[user][friend]) return {ok:false};
  STORE.friendships[user][friend] = { status:'accepted', since:now() };
  if (!STORE.friendships[friend]) STORE.friendships[friend] = {};
  STORE.friendships[friend][user] = { status:'accepted', since:now() };
  saveStore();
  return {ok:true};
}
function declineFriendRequest(user, friend){
  if (STORE.friendships[user]) delete STORE.friendships[user][friend];
  if (STORE.friendships[friend]) delete STORE.friendships[friend][user];
  saveStore();
  return {ok:true};
}

/* ══════════════════════════════════════════════════════════
   MESSAGES
══════════════════════════════════════════════════════════ */
function chatKey(u1, u2){ return [u1, u2].sort().join('|'); }
function getMessages(u1, u2){ return STORE.messages[chatKey(u1, u2)] || []; }
function sendMessage(from, to, text){
  text = text.trim();
  if (!text) return;
  const key = chatKey(from, to);
  if (!STORE.messages[key]) STORE.messages[key] = [];
  STORE.messages[key].push({ id:'m'+now()+Math.random().toString(36).slice(2,6), from, text, ts:now(), read:false });
  saveStore();
}
function markMessagesRead(user, friend){
  const key = chatKey(user, friend);
  const msgs = STORE.messages[key] || [];
  let changed = false;
  msgs.forEach(m => { if (m.from === friend && !m.read) { m.read = true; changed = true; } });
  if (changed) saveStore();
}
function unreadCount(user){
  let c = 0;
  Object.keys(STORE.messages).forEach(k => {
    const parts = k.split('|');
    if (!parts.includes(user)) return;
    const other = parts[0] === user ? parts[1] : parts[0];
    const msgs = STORE.messages[k] || [];
    c += msgs.filter(m => m.from === other && !m.read).length;
  });
  return c;
}
function lastMessageWith(user, friend){
  const msgs = getMessages(user, friend);
  return msgs.length > 0 ? msgs[msgs.length - 1] : null;
}
function getChatFriends(user){
  const friends = getFriends(user);
  return friends.map(f => ({
    ...f,
    lastMsg: lastMessageWith(user, f.username),
    unread: getMessages(user, f.username).filter(m => m.from === f.username && !m.read).length
  })).filter(f => f.lastMsg).sort((a,b) => (b.lastMsg?.ts||0) - (a.lastMsg?.ts||0));
}

/* ══════════════════════════════════════════════════════════
   AVATAR
══════════════════════════════════════════════════════════ */
const AV_COLORS = ['#c81e1e','#3d3dc9','#047857','#b45309','#7c3aed','#0891b2','#be185d','#ca8a04','#dc2626','#1e40af'];
function avatarColor(name){
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return AV_COLORS[Math.abs(h) % AV_COLORS.length];
}
function avatarSmall(user, size=40, showDot=false){
  const initial = (user.display || user.username).charAt(0).toUpperCase();
  const color = avatarColor(user.username);
  const isOnline = user.lastLoginDate === todayStr();
  return `<div class="friend-avatar" style="width:${size}px;height:${size}px;background:${color};font-size:${size*0.4}px">
    ${esc(initial)}${showDot && isOnline ? '<span class="online-dot"></span>' : ''}
  </div>`;
}

/* ══════════════════════════════════════════════════════════
   TTS
══════════════════════════════════════════════════════════ */
const TTS = {
  currentAudio:null, useGoogle:true, rate:0.9,
  isGermanText(t){ if(!t) return false; const s=String(t).trim(); if(!s) return false;
    if(/[ăâđêôơưàảãáạằẳẵắặầẩẫấậèẻẽéẹềểễếệìỉĩíịòỏõóọồổỗốộờởỡớợùủũúụừửữứựỳỷỹýỵ]/i.test(s)) return false;
    return true; },
  clean(t){ return String(t).replace(/[„""«»]/g,'').replace(/[''`]/g,'').replace(/\s+/g,' ').trim(); },
  stop(){ if(this.currentAudio){ try{this.currentAudio.pause();this.currentAudio.currentTime=0;}catch(e){} this.currentAudio=null; }
    if('speechSynthesis' in window) speechSynthesis.cancel();
    $$('.speak-btn,.speak-mini,.speak-flash,.fb-speak').forEach(b=>b.classList.remove('speaking')); },
  speak(text, btn){
    if(!text) return;
    this.stop();
    const clean = this.clean(text);
    if(btn) btn.classList.add('speaking');
    if(this.useGoogle) this.tryGoogle(clean, text, btn);
    else this.webSpeech(text, btn);
  },
  tryGoogle(clean, orig, btn){
    const url = 'https://translate.google.com/translate_tts?ie=UTF-8&q=' + encodeURIComponent(clean) + '&tl=de&client=tw-ob';
    const a = new Audio(url);
    a.playbackRate = this.rate;
    this.currentAudio = a;
    let fb = false;
    const fallback = () => { if(fb)return; fb=true; this.webSpeech(orig, btn); };
    a.onended = () => { if(btn) btn.classList.remove('speaking'); this.currentAudio=null; };
    a.onerror = fallback;
    a.play().catch(fallback);
  },
  webSpeech(text, btn){
    if(!('speechSynthesis' in window)){ if(btn)btn.classList.remove('speaking'); showToast('⚠️ Không hỗ trợ phát âm'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='de-DE'; u.rate=0.85; u.pitch=1;
    if(deVoice) u.voice = deVoice;
    if(btn) btn.classList.add('speaking');
    u.onend = () => { if(btn) btn.classList.remove('speaking'); };
    u.onerror = () => { if(btn) btn.classList.remove('speaking'); };
    speechSynthesis.speak(u);
  }
};
let deVoice = null;
function loadVoices(){ if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  deVoice = vs.find(v=>/^de(-|_)/i.test(v.lang)) || vs.find(v=>/deutsch|german/i.test(v.name)) || null; }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices,500); setTimeout(loadVoices,1500); }
function speak(t, b){ TTS.speak(t, b); }

/* ══════════════════════════════════════════════════════════
   SOUND & CONFETTI
══════════════════════════════════════════════════════════ */
const Sound = {
  ctx:null, enabled:true,
  init(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.enabled=false; } } if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  play(t){ if(!this.enabled) return; this.init(); if(!this.ctx) return;
    if(t==='correct'){ this.tone(880,.1); setTimeout(()=>this.tone(1320,.15),70); }
    else if(t==='wrong'){ this.tone(220,.15,'sawtooth'); setTimeout(()=>this.tone(160,.25,'sawtooth'),90); }
    else if(t==='levelup'){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,.22),i*90)); }
    else if(t==='click'){ this.tone(500,.04,'sine',.06); }
    else if(t==='msg'){ this.tone(880,.08,'sine',.1); setTimeout(()=>this.tone(1100,.1,'sine',.1),60); } },
  tone(f,d,t='sine',v=.12){ if(!this.ctx) return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=t; o.frequency.value=f; g.gain.setValueAtTime(v,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+d);
    o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+d); }
};

const Confetti = {
  canvas:null, ctx:null, particles:[], raf:null, enabled:true,
  init(){ if(this.canvas) return; this.canvas = document.getElementById('confettiCanvas'); this.ctx = this.canvas.getContext('2d');
    this.resize(); window.addEventListener('resize', ()=>this.resize()); },
  resize(){ if(!this.canvas) return; this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
  burst(x,y,n=25){ if(!this.enabled) return; this.init();
    const colors = ['#c81e1e','#f4c542','#0a0a14','#ffffff','#ff6b6b','#0a7a4a','#3d3dc9'];
    for(let i=0;i<n;i++) this.particles.push({
      x,y, vx:(Math.random()-.5)*10, vy:Math.random()*-9-3, gravity:.35, life:1,
      decay:.012+Math.random()*.008, size:4+Math.random()*5,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360, rotSpeed:(Math.random()-.5)*22
    });
    if(!this.raf) this.animate(); },
  animate(){ if(!this.ctx) return; const c=this.ctx;
    c.clearRect(0,0,this.canvas.width,this.canvas.height);
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];
      p.vy+=p.gravity; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay; p.rot+=p.rotSpeed;
      if(p.life<=0){ this.particles.splice(i,1); continue; }
      c.save(); c.translate(p.x,p.y); c.rotate(p.rot*Math.PI/180);
      c.globalAlpha=p.life; c.fillStyle=p.color;
      c.fillRect(-p.size/2,-p.size/2,p.size,p.size); c.restore();
    }
    if(this.particles.length>0) this.raf=requestAnimationFrame(()=>this.animate());
    else this.raf=null; },

const ONES=['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
const TEENS=['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
function numToGerman(n){
  if(n===0)return 'null'; let r='';
  if(n>=1000){const th=Math.floor(n/1000); r+=(th===1?'ein':ONES[th])+'tausend'; n%=1000; if(!n)return r;}
  if(n>=100){const h=Math.floor(n/100); r+=(h===1?'ein':ONES[h])+'hundert'; n%=100; if(!n)return r;}
  if(n>=20){const t=Math.floor(n/10),u=n%10; if(!u)r+=TENS[t]; else r+=ONES[u]+'und'+TENS[t];}
  else if(n===1)r+='eins';
  else if(n>=2&&n<=9)r+=ONES[n];
  else if(n>=10&&n<=19)r+=TEENS[n-10];
  return r;
}
const VN_ONES=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function numToVietnamese(n){
  if(n===1000)return 'một nghìn'; if(n===0)return 'không';
  if(n<10)return VN_ONES[n];
  if(n<20){if(n===10)return 'mười';if(n===15)return 'mười lăm';return 'mười '+VN_ONES[n-10];}
  if(n<100){const t=Math.floor(n/10),u=n%10;
    if(!u)return VN_ONES[t]+' mươi';if(u===1)return VN_ONES[t]+' mươi mốt';
    if(u===5)return VN_ONES[t]+' mươi lăm';return VN_ONES[t]+' mươi '+VN_ONES[u];}
  const h=Math.floor(n/100),rest=n%100; let o=VN_ONES[h]+' trăm';
  if(!rest)return o; if(rest<10)return o+' lẻ '+VN_ONES[rest];
  if(rest<20){if(rest===10)return o+' mười';if(rest===15)return o+' mười lăm';return o+' mười '+VN_ONES[rest-10];}
  const t=Math.floor(rest/10),u=rest%10;
  if(!u)return o+' '+VN_ONES[t]+' mươi';if(u===1)return o+' '+VN_ONES[t]+' mươi mốt';
  if(u===5)return o+' '+VN_ONES[t]+' mươi lăm';return o+' '+VN_ONES[t]+' mươi '+VN_ONES[u];
}

  const fb = $('#navFriendBadge'), cb = $('#navChatBadge');
  if (pending > 0) { fb.style.display='flex'; fb.textContent = pending > 9 ? '9+' : pending; }
  else fb.style.display = 'none';
  if (unread > 0) { cb.style.display='flex'; cb.textContent = unread > 9 ? '9+' : unread; }
  else cb.style.display = 'none';
}
function showNav(show){ bottomNav.style.display = show ? 'flex' : 'none'; }

function goTo(view){
  if ((view === 'friends' || view === 'chat') && !isLoggedIn()) {
    state.authIntent = view;
    state.view = 'auth';
    render();
    return;
  }
  state.view = view;
  Sound.play('click');
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function requireAuth(intent){
  state.authIntent = intent;
  state.view = 'auth';
  render();
}

function render(){
  if (state.view === 'auth') { showNav(false); renderAuth(); return; }
  if (!STORE.users[currentId()]) ensureGuest();
  showNav(true);
  updateNavBadges();
  setNavActive(state.view);

  switch(state.view){
    case 'home': renderHome(); break;
    case 'setup': renderSetup(); break;
    case 'session': renderSession(); break;
    case 'summary': renderSummary(); break;
    case 'friends': renderFriends(); break;
    case 'chat': renderChatList(); break;
    case 'chatRoom': renderChatRoom(); break;
    case 'profile': renderProfile(); break;
    default: renderHome();
  }
}

function showAuthError(msg){
  const el = $('#authErr');
  if (el) { el.textContent = msg; el.classList.add('show'); }
}

function doLogin(){
  const u = $('#loginUser').value;
  const p = $('#loginPass').value;
  if (!u || !p) return showAuthError('Vui lòng nhập đầy đủ');
  const res = loginUser(u, p);
  if (!res.ok) return showAuthError(res.err);
  Sound.play('correct');
  const intent = state.authIntent || 'home';
  state.authIntent = null;
  state.view = intent;
  render();
  if (res.streakInfo && res.streakInfo.changed) {
    setTimeout(() => showStreakModal(res.streakInfo.streak), 500);
  }
}

function doRegister(){
  const u = $('#regUser').value;
  const d = $('#regDisplay').value;
  const p = $('#regPass').value;
  if (!u || !d || !p) return showAuthError('Vui lòng nhập đầy đủ');
  const res = registerUser(u, d, p);
  if (!res.ok) return showAuthError(res.err);
  const login = loginUser(u, p);
  if (!login.ok) return showAuthError(login.err);

  const guestProg = STORE.learning['__guest__'] || {};
  if (Object.keys(guestProg).length > 0) STORE.learning[u.toLowerCase()] = {...guestProg};
  const guest = STORE.users['__guest__'];
  if (guest) {
    if (guest.totalXP > 0) {
      const newU = STORE.users[u.toLowerCase()];
      newU.totalXP = guest.totalXP;
      newU.level = guest.level;
    }
    delete STORE.learning['__guest__'];
    guest.totalXP = 0; guest.level = 1; guest.streak = 0; guest.lastLoginDate = null;
  }
  saveStore();

  Sound.play('levelup');
  Confetti.big();

  const intent = state.authIntent || 'home';
  state.authIntent = null;
  state.view = intent;
  render();
  showToast('🎉 Chào mừng ' + d + '!');

  if (login.streakInfo && login.streakInfo.changed) {
    setTimeout(() => showStreakModal(login.streakInfo.streak), 600);
  }
}

  if (!filter) return items;
  if (catKey==='vocab' || catKey==='grammar') return items.filter(it => it.level === filter);
  if (catKey==='numbers') return items.filter(it => it.band === filter);
  return items;
}

/* ══════════════════════════════════════════════════════════
   SESSION
══════════════════════════════════════════════════════════ */
const SESSION_SIZE = 20;

function pickSessionItems(items, onlyUnlearned){
  const prog = getProgress();
  let pool = items;
  if (onlyUnlearned) {
    pool = items.filter(it => prog[it.id] !== 'mastered');
    if (!pool.length) pool = items;
  }
  const unlearned = pool.filter(it => prog[it.id] !== 'mastered');
  const mastered = pool.filter(it => prog[it.id] === 'mastered');
  shuffle(unlearned); shuffle(mastered);
  const n = Math.min(SESSION_SIZE, pool.length);
  const out = [];
  for (const it of unlearned) { if (out.length >= n) break; out.push(it); }
  for (const it of mastered) { if (out.length >= n) break; out.push(it); }
  return shuffle(out);
}
function startSession(){
  const {cat, filter, mode} = state.setup;
  const pool = getFilteredItems(cat, filter);
  const items = pickSessionItems(pool, state.setup.onlyUnlearned);
  if (!items.length) { showToast('Không có mục nào để học'); return; }
  state.session = {cat, filter, mode, items, index:0, correct:0,
    answered:false, flipped:false, currentOpts:null, currentCorrect:null, typeMode:null};
  state.view = 'session';
  render();
}
function startReviewAll(){
  const prog = getProgress();
  const all = [];
  Object.keys(CATS).forEach(k => {
    CATS[k].items.forEach(it => {
      if (prog[it.id] !== 'mastered') all.push({...it});
    });
  });
  if (!all.length) { showToast('Bạn đã thuộc hết rồi! 🎉'); return; }
  shuffle(all);
  const items = all.slice(0, SESSION_SIZE);
  state.session = {cat:'__review', filter:null, mode:'flash', items, index:0, correct:0,
    answered:false, flipped:false, currentOpts:null, currentCorrect:null, typeMode:null};
  state.view = 'session';
  render();
}

function renderSession(){
  const s = state.session;
  if (s.index >= s.items.length) { state.view = 'summary'; render(); return; }

  s.answered = false; s.flipped = false; s.currentOpts = null; s.currentCorrect = null;
  const item = s.items[s.index];
  const status = getStatus(item.id);
  const statusLabel = status === 'mastered' ? 'Đã thuộc' : status === 'learning' ? 'Đang học' : 'Mới';
  const level = item.level || '';
  const modeLabel = s.mode === 'flash' ? 'Thẻ nhớ' : s.mode === 'quiz' ? 'Trắc nghiệm' : 'Gõ đáp án';
  const catName = s.cat === '__review' ? 'Ôn tập' : CATS[s.cat].name;

  let bodyHtml = '';
  if (s.mode === 'flash') bodyHtml = renderFlashBody(item);
  else if (s.mode === 'quiz') {
    const q = buildQuiz(item);
    s.currentOpts = q.options;
    s.currentCorrect = q.correctIndex;
    bodyHtml = renderQuizBody(item, q);
  } else bodyHtml = renderTypeBody(item);

  app.innerHTML = `
    <div class="session">
      <div class="session-top">
        <button class="back-btn" id="backBtn">← Thoát</button>
        <span class="session-tag ${s.mode}">${catName} · ${modeLabel}</span>
      </div>
      <div class="progress">
        <div class="progress-meta">
          <span>Câu ${s.index + 1} / ${s.items.length}</span>
          <span class="score">✓ ${s.correct}</span>
        </div>
        <div class="progress-bar"><i style="width:${(s.index/s.items.length)*100}%"></i></div>
      </div>
      <div class="q-card">
        <div class="card-head">
          <div class="card-badges">
            ${level?`<span class="level-badge ${level}">${level}</span>`:''}
            <span class="status-badge ${status}">${statusLabel}</span>
          </div>
          <div class="card-actions">
            ${item.type==='grammar'?`<button class="hint-btn" id="hintBtn">?</button>`:''}
            <button class="speak-btn" id="speakBtn">🔊</button>
          </div>
        </div>
        <div id="hintArea"></div>
        ${bodyHtml}
        <div id="fbArea"></div>
        <div class="mark-row" id="markRow">
          <button class="mark-btn unlearn" id="markUnlearn">😕 Chưa thuộc</button>
          <button class="mark-btn learn" id="markLearn">✅ Thuộc rồi</button>
        </div>
      </div>
    </div>
  `;

  $('#backBtn').addEventListener('click', () => {
    if (confirm('Thoát phiên học?')) { TTS.stop(); state.view = 'home'; render(); }
  });
  $('#speakBtn').addEventListener('click', e => { e.stopPropagation(); speak(item.speak, e.currentTarget); });
  const hintBtn = $('#hintBtn');
  if (hintBtn && item.hint) {
    hintBtn.addEventListener('click', e => {
      e.stopPropagation();
      const area = $('#hintArea');
      if (area.innerHTML.trim()) { area.innerHTML = ''; hintBtn.classList.remove('active'); }
      else { area.innerHTML = `<div class="hint-box"><span class="label">💡 Cách làm</span>${esc(item.hint)}</div>`; hintBtn.classList.add('active'); }
    });
  }
  if (s.mode === 'flash') wireFlash(item);
  else if (s.mode === 'quiz') wireQuiz(item);
  else wireType(item);
  $('#markUnlearn').addEventListener('click', () => markItem(item, false));
  $('#markLearn').addEventListener('click', () => markItem(item, true));
  if (s.mode === 'type') setTimeout(() => $('#typeInput')?.focus(), 80);
}

function renderFlashBody(item){
  const isLetter = item.type === 'alphabet';
  const frontClass = isLetter ? 'flash-main letter' : 'flash-main';
  const frontLabel = item.type === 'vocab' ? 'Deutsch' : item.type === 'number' ? 'Số' : item.type === 'alphabet' ? 'Buchstabe' : 'Aufgabe';
  const backLabel = item.type === 'vocab' ? 'Tiếng Việt' : item.type === 'number' ? 'Deutsch' : item.type === 'alphabet' ? 'Aussprache' : 'Đáp án';
  const backSub = item.explain || item.extra || '';
  const frontSpeak = item.type === 'vocab' || item.type === 'alphabet' ? item.front : item.speak;
  const backSpeak = item.type === 'number' ? item.back : item.type === 'vocab' ? item.front : item.back;
  return `
    <div class="flash-scene">
      <div class="flashcard" id="flashcard">
        <div class="flash-face flash-front">
          <button class="speak-flash" data-speak="${esc(frontSpeak)}" onclick="event.stopPropagation();speak(this.dataset.speak,this)">🔊</button>
          <span class="flash-label">${frontLabel}</span>
          <div class="${frontClass}">${esc(item.front)}</div>
          <div class="flash-sub">Nhấn thẻ để xem đáp án</div>
        </div>
        <div class="flash-face flash-back">
          <button class="speak-flash" data-speak="${esc(backSpeak)}" onclick="event.stopPropagation();speak(this.dataset.speak,this)">🔊</button>
          <span class="flash-label">${backLabel}</span>
          <div class="flash-main">${esc(item.back)}</div>
          <div class="flash-sub">${esc(backSub)}</div>
        </div>
      </div>
    </div>
    <div class="flip-hint" id="flipHint">Nhấn thẻ hoặc nút bên dưới để lật</div>
    <button class="flip-btn" id="flipBtn">🔄 Lật thẻ</button>
  `;
}
function wireFlash(item){
  const s = state.session;
  const card = $('#flashcard');
  const flip = () => {
    if (s.flipped) return;
    s.flipped = true;
    card.classList.add('flipped');
    $('#flipHint').textContent = 'Đánh dấu để chuyển thẻ tiếp theo';
    $('#markRow').classList.add('show');
  };
  card.addEventListener('click', flip);
  $('#flipBtn').addEventListener('click', e => { e.stopPropagation(); flip(); });
}

function buildQuiz(item){
  let q, correctAnswer, pool, speakText, optionsAreGerman = false;
  if (item.type === 'vocab') {
    if (Math.random() < 0.5) {
      q = `Từ <b>"${esc(item.front)}"</b> có nghĩa là gì?`;
      correctAnswer = item.back;
      pool = CATS.vocab.items.filter(x=>x.id!==item.id).map(x=>x.back);
      speakText = item.front;
    } else {
      q = `<b>"${esc(item.back)}"</b> trong tiếng Đức là?`;
      correctAnswer = item.front;
      pool = CATS.vocab.items.filter(x=>x.id!==item.id).map(x=>x.front);
      speakText = item.front;
      optionsAreGerman = true;
    }
  } else if (item.type === 'number') {
    if (Math.random() < 0.5) {
      q = `Số <b>${item.num}</b> trong tiếng Đức là?`;
      correctAnswer = item.back;
      pool = buildNumberDistractors(item.num);
      speakText = item.back;
      optionsAreGerman = true;
    } else {
      q = `Từ <b>"${esc(item.back)}"</b> là số nào?`;
      correctAnswer = String(item.num);
      pool = buildNumberDistractorsNum(item.num);
      speakText = item.back;
    }
  } else if (item.type === 'alphabet') {
    const others = CATS.alphabet.items.filter(x=>x.id!==item.id);
    if (Math.random() < 0.5) {
      q = `Chữ <b style="font-size:1.2em">${esc(item.letter)}</b> đọc là gì?`;
      correctAnswer = item.back;
      pool = others.map(x=>x.back);
      speakText = item.letter;
      optionsAreGerman = true;
    } else {
      q = `Cách đọc <b>"${esc(item.back)}"</b> là chữ cái nào?`;
      correctAnswer = item.letter;
      pool = others.map(x=>x.letter);
      speakText = item.letter;
      optionsAreGerman = true;
    }
  } else {
    q = item.sentence.replace('___', '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    correctAnswer = item.opts[item.correct];
    pool = item.opts.filter((_,i)=>i!==item.correct);
    speakText = item.speak;
    optionsAreGerman = true;
  }
  const opts = makeOpts(correctAnswer, pool, 4);
  return {questionText: q, options: opts, correctIndex: opts.indexOf(String(correctAnswer)), speakText, optionsAreGerman};
}
function buildNumberDistractors(n){
  const set = new Set([numToGerman(n)]);
  const cands = [];
  [-1,1,-2,2,-10,10,-20,20].forEach(o => { const c=n+o; if (c>=0&&c<=1000) cands.push(numToGerman(c)); });
  for(let i=0;i<25;i++) cands.push(numToGerman(rand(0,1000)));
  shuffle(cands);
  for(const c of cands) { if(set.size>=4) break; set.add(c); }
  return [...set];
}
function buildNumberDistractorsNum(n){
  const set = new Set([String(n)]);
  const cands = [];
  [-1,1,-2,2,-10,10,-20,20].forEach(o => { const c=n+o; if (c>=0&&c<=1000) cands.push(String(c)); });
  for(let i=0;i<25;i++) cands.push(String(rand(0,1000)));
  shuffle(cands);
  for(const c of cands) { if(set.size>=4) break; set.add(c); }
  return [...set];
}
function makeOpts(correct, pool, n=4){
  const set = new Set([String(correct)]);
  for(const p of shuffle([...pool])) { if(set.size>=n) break; set.add(String(p)); }
  return shuffle([...set]);
}

  return `<div class="q-text">${q.questionText}</div><div class="options" id="opts">${optsHtml}</div>`;
}

function normalize(s){
  return String(s).toLowerCase().trim()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[.,!?;]/g,'').replace(/\s+/g,' ');
}
function wireType(item){
  const s = state.session;
  const input = $('#typeInput');
  const check = () => {
    if (s.answered) return;
    const val = input.value.trim();
    if (!val) { input.focus(); return; }
    s.answered = true;
    input.disabled = true;
    let correctAnswer, isCorrect;
    const mode = s.typeMode;
    if (item.type === 'vocab') {
      correctAnswer = mode === 'de' ? item.front : item.back;
      if (mode === 'de') {
        const norm = normalize(val), full = normalize(correctAnswer);
        const noArt = full.replace(/^(der|die|das)\s+/,'');
        isCorrect = norm === full || norm === noArt;
      } else isCorrect = normalize(val) === normalize(correctAnswer);
    } else if (item.type === 'number') {
      if (mode === 'de') { correctAnswer = item.back; isCorrect = normalize(val) === normalize(correctAnswer); }
      else { correctAnswer = String(item.num); isCorrect = val.replace(/\D/g,'') === correctAnswer; }
    } else if (item.type === 'alphabet') {
      correctAnswer = item.back;
      isCorrect = normalize(val) === normalize(correctAnswer);
    } else {
      correctAnswer = item.opts[item.correct];
      isCorrect = normalize(val) === normalize(correctAnswer);
    }
    if (isCorrect) { s.correct++; addXP(15); Sound.play('correct'); }
    else Sound.play('wrong');
    input.classList.add(isCorrect ? 'correct' : 'wrong');
    const fb = $('#fbArea');

    else if (item.type === 'vocab') extra = `<small>${esc(item.front)} = ${esc(item.back)}</small>`;
    const speakAns = TTS.isGermanText(correctAnswer) ? correctAnswer : item.speak;
    const speakBtn = `<button class="fb-speak" data-speak="${esc(speakAns)}" onclick="event.stopPropagation();speak(this.dataset.speak,this)">🔊</button>`;

  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  $('#checkBtn').addEventListener('click', check);
}

function renderSummary(){

  if (pct === 100) { emoji='🏆'; title='Tuyệt vời!'; sub='Bạn trả lời đúng tất cả!'; }
  else if (pct >= 80) { emoji='🌟'; title='Rất tốt!'; sub='Bạn nắm bài rất chắc'; }
  else if (pct >= 50) { emoji='👍'; title='Khá tốt!'; sub='Tiếp tục luyện tập nhé'; }
  else { emoji='💪'; title='Cố gắng lên!'; sub='Ôn lại và thử lần nữa'; }

  let masteredCount=0, learningCount=0;

    else if (st === 'learning') learningCount++;

function addXP(amount){
  const u = getCurrentUser();
  const prevLevel = u.level;
  u.totalXP = (u.totalXP || 0) + amount;
  u.level = Math.floor(u.totalXP / 100) + 1;
  saveStore();
  if (u.level > prevLevel) {
    Sound.play('levelup');
    Confetti.big();
    showToast(`🎉 LÊN CẤP ${u.level}!`);
  }
}
