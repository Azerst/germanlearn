<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch lernen — Lernportal</title>
<style>
  :root{
    --bg:#080b14;
    --surface:rgba(255,255,255,0.045);
    --surface-hover:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.08);
    --border-hover:rgba(255,255,255,0.18);
    --text:#eef2fb;
    --text-dim:#b8c4dd;
    --muted:#6b7ba3;
    --gold:#ffce00;
    --gold-2:#f4b400;
    --red:#dd0000;
    --green:#10b981;
    --green-2:#059669;
    --green-soft:rgba(16,185,129,0.14);
    --red-soft:rgba(239,68,68,0.14);
    --indigo:#6366f1;
    --indigo-2:#4f46e5;
    --indigo-soft:rgba(99,102,241,0.2);
    --purple:#a855f7;
    --purple-soft:rgba(168,85,247,0.18);
    --amber:#f59e0b;
    --amber-soft:rgba(245,158,11,0.16);
    --blue:#3b82f6;
    --blue-soft:rgba(59,130,246,0.16);
    --serif:'Times New Roman', 'Georgia', 'Cambria', serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:var(--text);
    background:var(--bg);
    background-image:
      radial-gradient(900px 500px at 10% -10%, rgba(99,102,241,0.16), transparent 60%),
      radial-gradient(800px 500px at 90% 5%, rgba(255,206,0,0.08), transparent 55%),
      radial-gradient(900px 600px at 50% 115%, rgba(16,185,129,0.08), transparent 60%),
      linear-gradient(180deg,#080b14,#0d1220);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .app{
    max-width:640px;margin:0 auto;padding:28px 16px 60px;
    display:flex;flex-direction:column;gap:22px;
    animation:fadeUp .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* HEADER */
  .hero{display:flex;flex-direction:column;align-items:center;gap:10px;
    text-align:center;padding:8px 0 4px}
  .flag{
    width:44px;height:30px;border-radius:7px;overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08);
    display:flex;flex-direction:column;margin-bottom:2px;
  }
  .flag span{flex:1}
  .flag span:nth-child(1){background:#111}
  .flag span:nth-child(2){background:#dd0000}
  .flag span:nth-child(3){background:#ffce00}
  .hero h1{margin:0;font-size:clamp(22px,5.5vw,30px);font-weight:800;
    letter-spacing:-.6px;line-height:1.15}
  .hero h1 em{
    font-style:normal;
    background:linear-gradient(100deg,#fff 0%,var(--gold) 60%,var(--gold-2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{margin:0;color:var(--muted);font-size:13.5px;font-weight:600;
    letter-spacing:.2px;line-height:1.5}

  .sec-head{display:flex;align-items:baseline;justify-content:space-between;
    padding:0 4px;margin-bottom:-6px}
  .sec-title{font-size:12px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--muted);font-weight:800}
  .sec-note{font-size:11.5px;color:var(--muted);font-weight:600}

  /* MODES */
  .modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .mode{
    position:relative;
    display:flex;flex-direction:column;gap:10px;
    padding:18px 16px;
    background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border:1px solid var(--border);border-radius:18px;
    color:var(--text);font-family:inherit;text-align:left;
    cursor:pointer;overflow:hidden;
    transition:all .25s cubic-bezier(.2,.8,.2,1);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .mode::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(300px 200px at 100% 0%, var(--c,transparent), transparent 70%);
    opacity:.12;pointer-events:none;transition:opacity .3s;
  }
  .mode:hover{
    background:var(--surface-hover);border-color:var(--border-hover);
    transform:translateY(-2px);box-shadow:0 12px 28px -12px rgba(0,0,0,.6);
  }
  .mode:hover::after{opacity:.25}
  .mode:active{transform:translateY(0) scale(.985)}
  .mode-emoji{
    width:44px;height:44px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;background:var(--bg-soft,var(--surface));
    border:1px solid var(--border);
  }
  .mode-name{font-size:15.5px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
  .mode-desc{font-size:12px;color:var(--muted);font-weight:600;line-height:1.4;margin-top:-2px}
  .mode[data-mode="vocab"]{--c:var(--indigo);--bg-soft:var(--indigo-soft)}
  .mode[data-mode="numbers"]{--c:var(--gold);--bg-soft:rgba(255,206,0,.15)}
  .mode[data-mode="alphabet"]{--c:var(--purple);--bg-soft:var(--purple-soft)}
  .mode[data-mode="grammar"]{--c:var(--green);--bg-soft:var(--green-soft)}

  /* EXAM SECTION */
  .exam-section{
    padding:18px 16px;
    background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01));
    border:1px solid var(--border);border-radius:20px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .exam-title{display:flex;align-items:center;gap:8px;margin:0 0 4px;
    font-size:15px;font-weight:800;letter-spacing:-.2px}
  .exam-title span{
    font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;
    background:rgba(255,206,0,.15);color:var(--gold);letter-spacing:.5px;
    text-transform:uppercase;
  }
  .exam-sub{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 14px;line-height:1.5}
  .levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .level{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:14px 6px;background:var(--surface);
    border:1.5px solid var(--border);border-radius:13px;
    color:var(--text);font-family:inherit;cursor:pointer;
    transition:all .2s cubic-bezier(.2,.8,.2,1);
  }
  .level:hover{transform:translateY(-2px);border-color:var(--border-hover);
    box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
  .level:active{transform:translateY(0) scale(.97)}
  .level-code{font-size:17px;font-weight:900;letter-spacing:-.4px;
    font-family:inherit;line-height:1}
  .level-sub{font-size:9.5px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--muted)}
  .level[data-level="A1"] .level-code{color:#10b981}
  .level[data-level="A2"] .level-code{color:#3b82f6}
  .level[data-level="B1"] .level-code{color:#f59e0b}
  .level[data-level="B2"] .level-code{color:#ef4444}
  .level[data-level="A1"]:hover{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.4)}
  .level[data-level="A2"]:hover{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.4)}
  .level[data-level="B1"]:hover{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.4)}
  .level[data-level="B2"]:hover{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}

  /* PRACTICE */
  .practice{display:flex;flex-direction:column;gap:14px;
    animation:fadeUp .4s cubic-bezier(.2,.8,.2,1)}
  .practice-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .back{
    padding:9px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-dim);
    font-family:inherit;font-size:12.5px;font-weight:700;
    cursor:pointer;transition:all .18s;
    display:flex;align-items:center;gap:5px;
  }
  .back:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border-hover)}
  .back:active{transform:scale(.97)}
  .practice-tag{
    display:flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:99px;
    font-size:11px;font-weight:800;letter-spacing:.4px;
    text-transform:uppercase;white-space:nowrap;
  }
  .practice-tag.vocab{background:var(--indigo-soft);color:#a5b4fc}
  .practice-tag.numbers{background:rgba(255,206,0,.15);color:var(--gold)}
  .practice-tag.alphabet{background:var(--purple-soft);color:#d8b4fe}
  .practice-tag.grammar{background:var(--green-soft);color:#6ee7b7}
  .practice-tag.exam{background:rgba(255,206,0,.15);color:var(--gold)}

  .progress-wrap{display:flex;flex-direction:column;gap:5px}
  .progress-meta{display:flex;justify-content:space-between;align-items:center;
    font-size:11.5px;font-weight:700;color:var(--muted)}
  .progress-meta .q-count{font-variant-numeric:tabular-nums}
  .progress-meta .score{color:var(--green)}
  .progress-bar{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
  .progress-bar>i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--gold),var(--gold-2));
    transition:width .4s cubic-bezier(.2,.8,.2,1)}

  .q-card{
    background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border:1px solid var(--border);border-radius:22px;padding:22px 20px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    position:relative;overflow:hidden;
  }
  .q-card::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:linear-gradient(135deg,rgba(255,206,0,.16),transparent 45%,transparent 55%,rgba(99,102,241,.12));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  }
  .q-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .q-level{padding:3px 9px;border-radius:6px;font-size:10px;font-weight:900;
    letter-spacing:.5px;background:rgba(255,255,255,.06);color:var(--text-dim)}
  .q-level.A1{background:rgba(16,185,129,.15);color:#6ee7b7}
  .q-level.A2{background:rgba(59,130,246,.15);color:#93c5fd}
  .q-level.B1{background:rgba(245,158,11,.15);color:#fcd34d}
  .q-level.B2{background:rgba(239,68,68,.15);color:#fca5a5}
  .q-actions{margin-left:auto;display:flex;gap:6px}

  .speak-btn,.hint-btn{
    width:38px;height:38px;border-radius:50%;padding:0;
    border:1px solid var(--border);background:var(--surface);
    color:var(--text);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
  }
  .speak-btn:hover{background:var(--surface-hover);border-color:var(--border-hover);
    transform:scale(1.08)}
  .speak-btn:active{transform:scale(.92)}
  .speak-btn.speaking{
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#1a1200;border-color:transparent;
    animation:pulse 1s infinite;
  }
  .hint-btn{
    font-family:Georgia,serif;font-weight:900;font-size:16px;
    color:var(--muted);
  }
  .hint-btn:hover{
    background:var(--amber-soft);border-color:var(--amber);
    color:var(--amber);transform:scale(1.08);
  }
  .hint-btn.active{
    background:var(--amber-soft);border-color:var(--amber);
    color:var(--amber);
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,206,0,.4)}
    70%{box-shadow:0 0 0 14px rgba(255,206,0,0)}
    100%{box-shadow:0 0 0 0 rgba(255,206,0,0)}
  }

  .q-text{
    font-size:clamp(17px,4.6vw,21px);font-weight:700;line-height:1.5;
    margin:0 0 18px;letter-spacing:-.2px;
  }
  .q-text b{color:var(--gold);font-weight:800}
  .q-text .blank{
    display:inline-block;min-width:52px;border-bottom:2px dashed var(--gold);
    color:var(--gold);
  }

  /* Hint box */
  .hint-box{
    margin:0 0 16px;padding:12px 14px;
    background:var(--amber-soft);border:1px solid rgba(245,158,11,.3);
    border-radius:12px;font-size:12.5px;font-weight:600;
    line-height:1.55;color:#fcd34d;
    animation:fbIn .3s cubic-bezier(.2,.8,.2,1);
  }
  .hint-box .label{
    display:block;font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--amber);
    font-weight:800;margin-bottom:5px;
  }

  /* OPTIONS */
  .options{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;align-items:center;gap:13px;
    padding:14px 16px;
    background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
    color:var(--text);font-family:inherit;font-size:15px;font-weight:600;
    text-align:left;cursor:pointer;
    transition:all .18s cubic-bezier(.2,.8,.2,1);
    animation:optIn .35s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .opt:nth-child(1){animation-delay:.03s}
  .opt:nth-child(2){animation-delay:.07s}
  .opt:nth-child(3){animation-delay:.11s}
  .opt:nth-child(4){animation-delay:.15s}
  @keyframes optIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .opt:hover:not(:disabled){
    background:var(--surface-hover);border-color:var(--border-hover);
    transform:translateX(3px);
  }
  .opt:disabled{cursor:default}
  .opt-letter{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,206,0,.13);color:var(--gold);
    font-weight:800;font-size:13.5px;
  }
  .opt-text{flex:1;word-break:break-word;line-height:1.35}
  .opt.correct{background:var(--green-soft);border-color:var(--green);
    animation:pop .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
  .opt.correct .opt-letter{background:rgba(16,185,129,.32);color:#6ee7b7}
  .opt.correct .opt-text{color:#6ee7b7}
  .opt.wrong{background:var(--red-soft);border-color:var(--red)}
  .opt.wrong .opt-letter{background:rgba(239,68,68,.32);color:#fca5a5}
  .opt.wrong .opt-text{color:#fca5a5}
  .opt.dimmed{opacity:.4}

  /* FEEDBACK */
  .fb{
    margin-top:14px;padding:12px 16px;border-radius:12px;
    font-size:13.5px;font-weight:600;line-height:1.5;
    animation:fbIn .3s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes fbIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .fb.correct{background:var(--green-soft);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
  .fb.wrong{background:var(--red-soft);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
  .fb small{
    display:block;margin-top:5px;font-size:12px;opacity:.9;
    font-weight:500;line-height:1.55;
  }
  .fb small b{color:#fff;font-weight:700}

  .next-btn{
    width:100%;margin-top:14px;padding:15px;
    border-radius:14px;border:0;
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#1a1200;font-family:inherit;font-size:15px;font-weight:800;
    cursor:pointer;box-shadow:0 6px 20px rgba(255,206,0,.3);
    transition:all .2s;letter-spacing:.2px;
    animation:fbIn .3s cubic-bezier(.2,.8,.2,1);
  }
  .next-btn:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(255,206,0,.4)}
  .next-btn:active{transform:translateY(0) scale(.99)}

  /* EXAM SPECIFIC */
  .exam-banner{
    padding:14px 16px;
    background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid var(--border);border-radius:14px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .exam-banner-title{
    font-family:var(--serif);font-size:16px;font-weight:700;
    color:var(--text);letter-spacing:.2px;line-height:1.2;
    margin-bottom:3px;
  }
  .exam-banner-sub{
    font-size:11.5px;color:var(--muted);font-weight:600;
    letter-spacing:.2px;
  }

  .exam-instr{
    padding:11px 14px;
    background:rgba(255,255,255,.03);
    border-left:3px solid var(--gold);
    border-radius:8px;
    font-size:12.5px;font-weight:500;color:var(--text-dim);
    line-height:1.55;margin-bottom:14px;
    font-family:var(--serif);font-style:italic;
  }

  .exam-passage{
    padding:16px 18px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);border-radius:12px;
    font-family:var(--serif);font-size:14.5px;line-height:1.7;
    color:var(--text);white-space:pre-wrap;
    margin-bottom:16px;
    max-height:260px;overflow-y:auto;
  }
  .exam-passage::-webkit-scrollbar{width:6px}
  .exam-passage::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px}
  .exam-passage .blank-num{
    display:inline-block;padding:0 6px;
    background:rgba(255,206,0,.25);color:var(--gold);
    border-radius:4px;font-weight:800;font-size:12.5px;
    font-family:'Inter',sans-serif;
    margin:0 2px;line-height:1.4;
  }
  .exam-passage .blank-num.hl{
    background:var(--gold);color:#1a1200;
    box-shadow:0 0 0 2px rgba(255,206,0,.3);
    animation:blankPulse 1.5s infinite;
  }
  @keyframes blankPulse{
    0%,100%{box-shadow:0 0 0 2px rgba(255,206,0,.3)}
    50%{box-shadow:0 0 0 5px rgba(255,206,0,.05)}
  }

  .exam-q-num{
    font-size:10.5px;font-weight:800;color:var(--gold);
    letter-spacing:1.5px;text-transform:uppercase;
    margin-bottom:7px;
  }
  .exam-q-text{
    font-family:var(--serif);font-size:15.5px;font-weight:700;
    line-height:1.5;margin-bottom:14px;color:var(--text);
  }

  /* SUMMARY */
  .summary{
    text-align:center;padding:34px 22px;
    background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border:1px solid var(--border);border-radius:22px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    animation:fadeUp .4s cubic-bezier(.2,.8,.2,1);
  }
  .sum-emoji{font-size:52px;line-height:1;margin-bottom:10px}
  .sum-title{
    font-size:23px;font-weight:800;margin:0 0 4px;letter-spacing:-.4px;
    background:linear-gradient(100deg,#fff,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sum-sub{font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:20px}
  .sum-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px;text-align:left}
  .sum-stat{
    background:var(--surface);border:1px solid var(--border);border-radius:13px;
    padding:13px 15px;
  }
  .sum-stat .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--muted);font-weight:800;margin-bottom:3px}
  .sum-stat .val{font-size:21px;font-weight:800;color:var(--text)}
  .sum-stat.gold .val{color:var(--gold)}
  .sum-stat.green .val{color:var(--green)}
  .sum-actions{display:flex;gap:8px}
  .sum-actions button{
    flex:1;padding:13px;border-radius:12px;border:1px solid var(--border);
    font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
    transition:all .2s;
  }
  .sum-actions .home-btn{background:var(--surface);color:var(--text)}
  .sum-actions .home-btn:hover{background:var(--surface-hover)}
  .sum-actions .again-btn{
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#1a1200;border-color:transparent;
    box-shadow:0 5px 16px rgba(255,206,0,.3);
  }
  .sum-actions .again-btn:hover{transform:translateY(-1px)}

  /* FOOTER */
  .foot{
    text-align:center;font-size:11px;color:#4d5d80;font-weight:600;
    padding-top:8px;line-height:1.7;
  }
  .foot kbd{
    background:rgba(255,255,255,.06);border:1px solid var(--border);
    border-radius:4px;padding:1px 6px;font-size:10px;font-family:inherit;
    color:var(--text-dim);font-weight:700;
  }

  @media (max-width:440px){
    .app{padding:22px 14px 44px;gap:18px}
    .mode{padding:15px 13px;gap:8px}

/* ══════════════════════════════════════════════════════════
   GERMAN NUMBERS (0–1000)
══════════════════════════════════════════════════════════ */
const ONES  = ['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
const TEENS = ['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS  = ['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];

function numToGerman(n){
  if (n === 0) return 'null';
  let r = '';
  if (n >= 1000) {
    const th = Math.floor(n/1000);
    r += (th === 1 ? 'ein' : ONES[th]) + 'tausend';
    n %= 1000;
    if (n === 0) return r;
  }
  if (n >= 100) {
    const h = Math.floor(n/100);
    r += (h === 1 ? 'ein' : ONES[h]) + 'hundert';
    n %= 100;
    if (n === 0) return r;
  }
  if (n >= 20) {
    const t = Math.floor(n/10), u = n%10;
    if (u === 0) r += TENS[t];
    else         r += ONES[u] + 'und' + TENS[t];
  } else if (n === 1) {
    r += 'eins';
  } else if (n >= 2 && n <= 9) {
    r += ONES[n];
  } else if (n >= 10 && n <= 19) {
    r += TEENS[n-10];
  }
  return r;
}

let deVoice = null;
function loadVoices(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  deVoice = vs.find(v=>/^de(-|_)/i.test(v.lang))
         || vs.find(v=>/deutsch|german/i.test(v.name))
         || null;
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, btn){
  if (!text) return;
  if (!('speechSynthesis' in window)) {
    alert('Trình duyệt không hỗ trợ phát âm.');
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = 0.85; u.pitch = 1;
  if (deVoice) u.voice = deVoice;
  $$('.speak-btn').forEach(b => b.classList.remove('speaking'));
  if (btn) btn.classList.add('speaking');
  u.onend = () => { if (btn) btn.classList.remove('speaking'); };
  u.onerror = () => { if (btn) btn.classList.remove('speaking'); };
  speechSynthesis.speak(u);
}

/* ══════════════════════════════════════════════════════════
   QUESTION BUILDERS (practice modes)
══════════════════════════════════════════════════════════ */
function makeOpts(correct, pool, n=4){
  const set = new Set();
  const cs = String(correct);
  set.add(cs);
  for (const p of shuffle([...pool])) {
    if (set.size >= n) break;
    const s = String(p);
    if (s === cs) continue;
    set.add(s);
  }
  return shuffle([...set]);
}

function buildVocabQ(v){
  const dir = Math.random() < 0.5 ? 'de-vi' : 'vi-de';
  if (dir === 'de-vi') {
    const pool = VOCAB.filter(x=>x.de!==v.de).map(x=>x.vi);
    const opts = makeOpts(v.vi, pool);
    return {type:'vocab', level:v.lv,
      prompt:`Từ <b>"${esc(v.de)}"</b> có nghĩa là gì?`,
      options:opts, correct:opts.indexOf(v.vi),
      speak:v.de, explain:`${v.de} = ${v.vi}`};
  }
  const pool = VOCAB.filter(x=>x.de!==v.de).map(x=>x.de);
  const opts = makeOpts(v.de, pool);
  return {type:'vocab', level:v.lv,
    prompt:`<b>"${esc(v.vi)}"</b> trong tiếng Đức là?`,
    options:opts, correct:opts.indexOf(v.de),
    speak:v.de, explain:`${v.vi} = ${v.de}`};
}

function buildGrammarQ(g){
  return {type:'grammar', level:g.lv,
    prompt: g.q.replace('___', '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>'),
    options:[...g.opts], correct:g.a,
    speak: g.q.replace('___', g.opts[g.a]).replace(/[.,!?]/g,''),
    explain:g.ex, hint:g.hint};
}

function numDistractors(n){
  const set = new Set();
  const correct = numToGerman(n);
  set.add(correct);
  const cands = [];
  for (const o of [-1,1,-2,2,-10,10,-20,20,-100,100]) {
    const c = n + o; if (c>=0 && c<=1000) cands.push(c);
  }
  if (n>=10 && n<=99) { const t=Math.floor(n/10),u=n%10; if (u!==0) cands.push(u*10+t); }
  for (let i=0;i<30;i++) cands.push(rand(0,1000));
  shuffle(cands);
  for (const c of cands) {
    if (set.size>=4) break;
    if (c===n) continue;
    const s = numToGerman(c);
    if (set.has(s)) continue;
    set.add(s);
  }
  return [...set];
}

function buildNumberQ(){
  const n = rand(0,1000);
  if (Math.random() < 0.5) {
    const correct = numToGerman(n);
    const opts = shuffle(numDistractors(n));
    return {type:'numbers', level:null,
      prompt:`Số <b>${n}</b> trong tiếng Đức viết là?`,
      options:opts, correct:opts.indexOf(correct),
      speak:correct, explain:`${n} = ${correct}`};
  }
  const german = numToGerman(n);
  const set = new Set([String(n)]);
  const cands = [];
  for (const o of [-1,1,-2,2,-10,10,-20,20]) { const c=n+o; if (c>=0&&c<=1000) cands.push(c); }
  for (let i=0;i<30;i++) cands.push(rand(0,1000));
  shuffle(cands);
  for (const c of cands) {
    if (set.size>=4) break;
    if (c===n) continue;
    set.add(String(c));
  }
  const opts = shuffle([...set]);
  return {type:'numbers', level:null,
    prompt:`Từ <b>"${german}"</b> là số nào?`,
    options:opts, correct:opts.indexOf(String(n)),
    speak:german, explain:`${german} = ${n}`};
}

function buildAlphabetQ(a){
  const others = ALPHABET.filter(x=>x.l!==a.l);
  if (Math.random() < 0.5) {
    const opts = makeOpts(a.p, others.map(x=>x.p));
    return {type:'alphabet', level:null,
      prompt:`Chữ <b style="font-size:1.3em">${esc(a.l)}</b> đọc là gì?`,
      options:opts, correct:opts.indexOf(a.p),
      speak:a.l, explain:`${a.l} = "${a.p}" · Ví dụ: ${a.ex}`};
  }
  const opts = makeOpts(a.l, others.map(x=>x.l));
  return {type:'alphabet', level:null,
    prompt:`Cách đọc <b>"${esc(a.p)}"</b> là chữ cái nào?`,
    options:opts, correct:opts.indexOf(a.l),
    speak:a.l, explain:`${a.p} = ${a.l} · Ví dụ: ${a.ex}`};
}

function buildSession(mode, count=10){
  if (mode === 'vocab') return shuffle([...VOCAB]).slice(0,count).map(buildVocabQ);
  if (mode === 'grammar') return shuffle([...GRAMMAR]).slice(0,count).map(buildGrammarQ);
  if (mode === 'numbers') {
    const out=[]; for (let i=0;i<count;i++) out.push(buildNumberQ()); return out;
  }
  if (mode === 'alphabet') return shuffle([...ALPHABET]).slice(0,count).map(buildAlphabetQ);
  return [];
}

    <div class="foot">
      Nhấn <kbd>1</kbd>–<kbd>4</kbd> chọn đáp án · <kbd>Enter</kbd> câu tiếp · <kbd>🔊</kbd> nghe tiếng Đức · <kbd>?</kbd> xem gợi ý ngữ pháp
    </div>
  `;
  $$('.mode').forEach(b => b.addEventListener('click', () => startPractice(b.dataset.mode)));
  $$('.level').forEach(b => b.addEventListener('click', () => startExam(b.dataset.level)));
}

/* ══════════════════════════════════════════════════════════
   START
══════════════════════════════════════════════════════════ */
function startPractice(mode){
  const questions = buildSession(mode, 10);
  state.session = {mode, level:null, questions, index:0, correct:0, answered:false};
  state.view = 'practice';
  renderQuestion();
}

function startExam(level){
  const exam = EXAMS[level];
  const shuffled = shuffle([...exam.questions]);
  state.session = {
    mode:'exam', level, questions:shuffled,
    index:0, correct:0, answered:false, examData:exam,
  };
  state.view = 'practice';
  renderExamQuestion();
}

/* ══════════════════════════════════════════════════════════
   RENDER PRACTICE (vocab / numbers / alphabet / grammar)
══════════════════════════════════════════════════════════ */
const MODE_LABEL = {vocab:'Vokabeln', numbers:'Zahlen', alphabet:'Alphabet', grammar:'Grammatik', exam:'Prüfung'};

function renderQuestion(){
  const s = state.session;
  if (s.index >= s.questions.length) return renderSummary();

  const q = s.questions[s.index];
  s.answered = false;

  const LETTERS = ['A','B','C','D'];
  const levelBadge = q.level ? `<span class="q-level ${q.level}">${q.level}</span>` : '';
  const hintBtn = (q.type === 'grammar' && q.hint)
    ? `<button class="hint-btn" id="hintBtn" title="Hướng dẫn cách làm">?</button>` : '';

  document.title = `${MODE_LABEL[s.mode]} · ${s.index+1}/${s.questions.length}`;

  app.innerHTML = `
    <div class="practice">
      <div class="practice-top">
        <button class="back" id="backBtn">← Thoát</button>
        <span class="practice-tag ${s.mode}">${MODE_LABEL[s.mode]}</span>
      </div>

      <div class="progress-wrap">
        <div class="progress-meta">
          <span class="q-count">Câu ${s.index+1} / ${s.questions.length}</span>
          <span class="score">✓ ${s.correct} đúng</span>
        </div>
        <div class="progress-bar"><i style="width:${(s.index/s.questions.length)*100}%"></i></div>
      </div>

      <div class="q-card">
        <div class="q-head">
          ${levelBadge}
          <div class="q-actions">
            ${hintBtn}
            <button class="speak-btn" id="speakBtn" title="Nghe tiếng Đức">🔊</button>
          </div>
        </div>
        <div class="q-text">${q.prompt}</div>
        <div id="hintArea"></div>
        <div class="options" id="opts"></div>
        <div id="fbArea"></div>
      </div>
    </div>
  `;

  const optsEl = $('#opts');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-letter">${LETTERS[i]}</span>` +
                    `<span class="opt-text">${esc(opt)}</span>`;
    btn.addEventListener('click', () => answer(i));
    optsEl.appendChild(btn);
  });

  $('#backBtn').addEventListener('click', () => {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    renderHome();
  });
  $('#speakBtn').addEventListener('click', e => {
    e.stopPropagation();
    speak(q.speak, e.currentTarget);
  });

  // Hint button
  const hintBtnEl = $('#hintBtn');
  if (hintBtnEl) {
    hintBtnEl.addEventListener('click', e => {
      e.stopPropagation();
      const hintArea = $('#hintArea');
      if (hintArea.innerHTML.trim()) {
        hintArea.innerHTML = '';
        hintBtnEl.classList.remove('active');
      } else {
        hintArea.innerHTML = `<div class="hint-box"><span class="label">💡 Cách làm</span>${esc(q.hint)}</div>`;
        hintBtnEl.classList.add('active');
      }
    });
  }

  setTimeout(() => $('#opts .opt')?.focus(), 60);
}

/* ══════════════════════════════════════════════════════════
   RENDER EXAM
══════════════════════════════════════════════════════════ */
function renderExamQuestion(){
  const s = state.session;
  if (s.index >= s.questions.length) return renderSummary();

  const q = s.questions[s.index];
  const exam = s.examData;
  s.answered = false;

  const LETTERS = ['a','b','c'];

  // Build passage (with blank highlight for B1/B2)
  let passageHtml = '';
  if (exam.sharedText) {
    let text = exam.sharedText;
    const curBlank = q.blankNum;
    text = text.replace(/\((\d+)\)/g, (m, num) => {
      const isHL = parseInt(num) === curBlank;
      return `<span class="blank-num${isHL ? ' hl' : ''}">(${num})</span>`;
    });
    passageHtml = `<div class="exam-passage">${text}</div>`;
  } else if (q.passage) {
    passageHtml = `<div class="exam-passage">${esc(q.passage)}</div>`;
  }

  document.title = `${exam.name} · ${s.index+1}/${s.questions.length}`;

  app.innerHTML = `
    <div class="practice">
      <div class="practice-top">
        <button class="back" id="backBtn">← Thoát</button>
        <span class="practice-tag exam">${exam.name}</span>
      </div>

      <div class="exam-banner">
        <div class="exam-banner-title">${exam.subtitle}</div>
        <div class="exam-banner-sub">📖 ${exam.section} · ⏱ ${exam.duration} · ${s.questions.length} Aufgaben</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-meta">
          <span class="q-count">Aufgabe ${s.index+1} / ${s.questions.length}</span>
          <span class="score">✓ ${s.correct} richtig</span>
        </div>
        <div class="progress-bar"><i style="width:${(s.index/s.questions.length)*100}%"></i></div>
      </div>

      <div class="q-card">
        <div class="exam-instr">${esc(exam.instructions)}</div>
        ${passageHtml}
        <div class="exam-q-num">Aufgabe ${s.index+1}</div>
        <div class="exam-q-text">${esc(q.q)}</div>
        <div class="options" id="opts"></div>
        <div id="fbArea"></div>
      </div>
    </div>
  `;

  const optsEl = $('#opts');
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-letter">${LETTERS[i]}</span>` +
                    `<span class="opt-text">${esc(opt)}</span>`;
    btn.addEventListener('click', () => answerExam(i));
    optsEl.appendChild(btn);
  });

  $('#backBtn').addEventListener('click', () => {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    renderHome();
  });
}

/* ══════════════════════════════════════════════════════════
   ANSWER HANDLERS
══════════════════════════════════════════════════════════ */
function answer(idx){
  const s = state.session;
  if (s.answered) return;
  s.answered = true;

  const q = s.questions[s.index];
  const isCorrect = idx === q.correct;
  if (isCorrect) s.correct++;

  const LETTERS = ['A','B','C','D'];
  const opts = $$('#opts .opt');
  opts.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx)  b.classList.add('wrong');
    else                 b.classList.add('dimmed');
  });

  const fb = $('#fbArea');
  if (isCorrect) {
    fb.innerHTML = `<div class="fb correct">✅ Chính xác!<small>${esc(q.explain || '')}</small></div>`;
  } else {
    fb.innerHTML = `<div class="fb wrong">❌ Sai rồi! Đáp án đúng: <b>${LETTERS[q.correct]}</b> — <b>${esc(q.options[q.correct])}</b><small>${esc(q.explain || '')}</small></div>`;
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.textContent = s.index === s.questions.length - 1 ? 'Xem kết quả →' : 'Câu tiếp →';
  nextBtn.addEventListener('click', () => {
    s.index++;
    renderQuestion();
  });
  fb.appendChild(nextBtn);

  $('.progress-meta .score').textContent = `✓ ${s.correct} đúng`;
}

function answerExam(idx){
  const s = state.session;
  if (s.answered) return;
  s.answered = true;

  const q = s.questions[s.index];
  const isCorrect = idx === q.a;
  if (isCorrect) s.correct++;

  const LETTERS = ['a','b','c'];
  const opts = $$('#opts .opt');
  opts.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a)    b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
    else              b.classList.add('dimmed');
  });

  const fb = $('#fbArea');
  if (isCorrect) {
    fb.innerHTML = `<div class="fb correct">✅ Richtig!<small>${esc(q.explain || '')}</small></div>`;
  } else {
    fb.innerHTML = `<div class="fb wrong">❌ Falsch! Richtige Antwort: <b>${LETTERS[q.a]})</b> <b>${esc(q.opts[q.a])}</b><small>${esc(q.explain || '')}</small></div>`;
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.textContent = s.index === s.questions.length - 1 ? 'Ergebnis ansehen →' : 'Weiter →';
  nextBtn.addEventListener('click', () => {
    s.index++;
    renderExamQuestion();
  });
  fb.appendChild(nextBtn);

  $('.progress-meta .score').textContent = `✓ ${s.correct} richtig`;
}

/* ══════════════════════════════════════════════════════════
   SUMMARY
══════════════════════════════════════════════════════════ */
function renderSummary(){
  const s = state.session;
  const total = s.questions.length;
  const pct = total > 0 ? Math.round(s.correct/total*100) : 0;
  const isExam = s.mode === 'exam';

  let emoji='🎉', title='Hoàn thành!', sub='Bạn đã hoàn thành phiên học';
  if (pct === 100)    {emoji='🏆'; title='Tuyệt vời!'; sub='Bạn trả lời đúng tất cả!';}
  else if (pct >= 80) {emoji='🌟'; title='Rất tốt!'; sub='Bạn nắm bài rất chắc';}
  else if (pct >= 50) {emoji='👍'; title='Khá tốt!'; sub='Tiếp tục luyện tập nhé';}
  else                {emoji='💪'; title='Cố gắng lên!'; sub='Ôn lại và thử lần nữa';}

  const tagText = isExam ? `Prüfung ${s.level}` : MODE_LABEL[s.mode];
  document.title = `Kết quả · ${tagText}`;

  app.innerHTML = `
    <div class="practice">
      <div class="practice-top">
        <button class="back" id="backBtn">← Trang chủ</button>
        <span class="practice-tag ${isExam ? 'exam' : s.mode}">${tagText}</span>
      </div>

      <div class="summary">
        <div class="sum-emoji">${emoji}</div>
        <h2 class="sum-title">${title}</h2>
        <p class="sum-sub">${isExam ? EXAMS[s.level].name + ' · ' : ''}${sub}</p>

        <div class="sum-stats">
          <div class="sum-stat green">
            <div class="lbl">Đúng / Tổng</div>
            <div class="val">${s.correct} / ${total}</div>
          </div>
          <div class="sum-stat gold">
            <div class="lbl">Tỉ lệ đúng</div>
            <div class="val">${pct}%</div>
          </div>
        </div>

        <div class="sum-actions">
          <button class="home-btn" id="homeBtn">🏠 Trang chủ</button>
          <button class="again-btn" id="againBtn">🔄 Làm lại</button>
        </div>
      </div>
    </div>
  `;

  $('#homeBtn').addEventListener('click', renderHome);
  $('#backBtn').addEventListener('click', renderHome);
  $('#againBtn').addEventListener('click', () => {
    if (isExam) startExam(s.level);
    else startPractice(s.mode);
  });
}

/* ══════════════════════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (state.view !== 'practice') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;

  const s = state.session;
  if (s.index >= s.questions.length) return;

  if (!s.answered) {
    const idx = {'Digit1':0,'Digit2':1,'Digit3':2,'Digit4':3,
                 'Numpad1':0,'Numpad2':1,'Numpad3':2,'Numpad4':3}[e.code];
    if (idx !== undefined) {
      e.preventDefault();
      const opts = $$('#opts .opt');
      if (opts[idx]) opts[idx].click();
    }
  } else {
    if (e.code === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      $('.next-btn')?.click();
    }
  }
});

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
renderHome();
</script>
</body>
</html>
